name: efti_gate_ee

services:
  database:
    container_name: efti_database
    image: postgres:18
    environment:
    - POSTGRES_USER=efti
    - POSTGRES_PASSWORD=01234
    - POSTGRES_DB=efti
    volumes:
    - data:/var/lib/postgresql
    - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U efti -d efti
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  liquibase:
    container_name: efti_liquibase
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    volumes:
    - ./DSL/Liquibase:/liquibase/changelog:ro
    environment:
    - AUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
    command: --defaultsFile=/liquibase/changelog/liquibase.properties update -DAUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}

  resql:
    container_name: efti_resql
    build:
      context: .
      dockerfile: docker/resql/Dockerfile
    platform: linux/amd64
    depends_on:
      database:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  ruuter:
    container_name: efti_ruuter
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    platform: linux/amd64
    environment:
    - RUST_LOG=debug
    volumes:
    - ./DSL/Ruuter:/app/DSL:ro
    - ./constants.ini:/app/constants.ini:ro
    - ./ruuter.yaml:/app/ruuter.yaml:ro
    cpus: '0.5'
    depends_on:
      - resql
    mem_limit: 512M

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    depends_on:
      - ruuter

  edelivery:
    environment:
      - OWN_PARTY_ID=eu-ee01
      - RESQL_URL=http://resql:8090
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=edelivery
      - PORT=8081
    depends_on:
      - resql
    mem_limit: 512M

  xml-mapper:
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=xml-mapper
      - PORT=8082
    mem_limit: 512M

  multiplexer:
    environment:
      - RESQL_URL=http://resql:8090
      - EDELIVERY_URL=http://edelivery:8081
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=multiplexer
      - PORT=8083
    depends_on:
      - resql
    mem_limit: 512M

  datamapper:
    build:
      context: .
      dockerfile: docker/datamapper/Dockerfile
    platform: linux/amd64
    mem_limit: 512M

volumes:
  data:
