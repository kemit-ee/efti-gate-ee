services:
  database:
    container_name: efti_database
    image: postgres:17
    environment:
    - POSTGRES_USER=efti
    - POSTGRES_PASSWORD=01234
    - POSTGRES_DB=efti
    ports:
    - 54322:5432
    volumes:
    - data:/var/lib/postgresql
    - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U efti -d efti
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  liquibase:
    container_name: liquibase
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    volumes:
    - ./DSL/Liquibase:/liquibase/changelog
    environment:
    - AUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
    command: --defaultsFile=/liquibase/changelog/liquibase.properties update -DAUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
  resql:
    build:
      context: .
      dockerfile: docker/resql/Dockerfile
    platform: linux/amd64
    depends_on:
    - database
    ports:
    - 8090:8090
  ruuter:
    container_name: ruuter
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    platform: linux/amd64
    environment:
    - RUST_LOG=debug
    volumes:
    - ./DSL/Ruuter:/app/DSL
    - ./constants.ini:/app/constants.ini
    - ./ruuter.yaml:/app/ruuter.yaml
    ports:
    - 8086:8086
    cpus: '0.5'
    mem_limit: 512M
  edelivery:
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=edelivery
      - PORT=8081
    ports:
    - 8081:8081
    mem_limit: 512M
  xml-mapper:
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=xml-mapper
      - PORT=8082
    ports:
    - 8082:8082
    mem_limit: 512M
  multiplexer:
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=multiplexer
      - PORT=8083
    ports:
    - 8083:8083
    mem_limit: 512M
  datamapper:
    build:
      context: .
      dockerfile: docker/datamapper/Dockerfile
    platform: linux/amd64
    ports:
    - 3000:3000
    mem_limit: 512M
volumes:
  data: null
