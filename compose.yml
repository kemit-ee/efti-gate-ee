name: efti_gate_ee

services:
  database:
    container_name: efti_database
    image: postgres:18
    environment:
    - POSTGRES_USER=efti
    - POSTGRES_PASSWORD=01234
    - POSTGRES_DB=efti
    volumes:
    - data:/var/lib/postgresql
    - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U efti -d efti
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  liquibase:
    container_name: efti_liquibase
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    volumes:
    - ./DSL/Liquibase:/liquibase/changelog:ro
    environment:
    - AUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
    command: --defaultsFile=/liquibase/changelog/liquibase.properties update -DAUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}

  resql:
    container_name: efti_resql
    build:
      context: .
      dockerfile: docker/resql/Dockerfile
    platform: linux/amd64
    # The base image ships a healthcheck against :8080; ReSQL listens on :8090.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  ruuter:
    container_name: efti_ruuter
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    platform: linux/amd64
    cpus: '0.5'
    depends_on:
      - resql
    mem_limit: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/efti/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Public developer mock of the X-Road authority surface (/developer/**). Standalone by
  # design: no database, no core, no link to the real gate — so exposing it publicly cannot
  # leak real data or reach a privileged route. See docs/specs/x_road_developer_mock.md.
  ruuter-developer:
    container_name: efti_ruuter_developer
    build:
      context: .
      dockerfile: docker/ruuter-developer/Dockerfile
    platform: linux/amd64
    cpus: '0.25'
    mem_limit: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/developer/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
      args:
        - VITE_USE_PROD_TARA_URL=true
    depends_on:
      ruuter:
        condition: service_healthy
      ruuter-developer:
        condition: service_healthy

  edelivery:
    environment:
      - OWN_GATE_ID
      - RESQL_URL=http://resql:8090
      - RUUTER_URL=http://ruuter:8086
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=edelivery
      - PORT=8081
    depends_on:
      - resql
    mem_limit: 512M

  xml-mapper:
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=xml-mapper
      - PORT=8082
    mem_limit: 512M

  multiplexer:
    environment:
      - OWN_GATE_ID
      - RESQL_URL=http://resql:8090
      - EDELIVERY_URL=http://edelivery:8081
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
      - PROJECT=multiplexer
      - PORT=8083
    depends_on:
      - resql
    mem_limit: 512M

  tara-mock:
    container_name: efti_tara_mock
    build:
      context: .
      dockerfile: docker/tara-mock/Dockerfile
    volumes:
      - tara-mock-vault:/service/vault
      - ./docker/tara-mock/identities.json:/service/identities.json:ro
      - ./docker/tara-mock/config.json:/service/config.json:ro

  tim-database:
    container_name: efti_tim_database
    image: postgres:18
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=tim-secret
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - tim-data:/var/lib/postgresql

  tim:
    container_name: efti_tim
    build:
      context: .
      dockerfile: docker/tim/Dockerfile
    depends_on:
      - tim-database
      - tara-mock
    environment:
      - TIM_DATABASE_URL=postgres://tim:tim-secret@tim-database:5432/tim
      - TIM_ADMIN_TOKEN=dev-tim-admin-token
      - TIM_TARA_CLIENT_ID=efti
      - TIM_TARA_CLIENT_SECRET=efti-secret
    volumes:
      - tara-mock-vault:/tara-mock-vault:ro
      - tim-jwt-key:/opt/tim/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

volumes:
  data:
  tara-mock-vault:
  tim-jwt-key:
  tim-data:
