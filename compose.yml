name: efti_gate_ee

services:
  database:
    container_name: efti_database
    image: postgres:18
    cpus: '2.0'
    mem_limit: 1G
    environment:
    - POSTGRES_USER=efti
    - POSTGRES_PASSWORD=01234
    - POSTGRES_DB=efti
    volumes:
    - data:/var/lib/postgresql
    - ./DSL/Liquibase/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U efti -d efti
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Separate PostgreSQL instance holding the consignments cold-storage table (efti_archive).
  # Reached only through ReSql's `archive` datasource — no foreign-data wrapper, no direct
  # connection from anywhere else.
  archive-database:
    container_name: efti_archive_database
    image: postgres:18
    cpus: '0.5'
    mem_limit: 512M
    environment:
    - POSTGRES_USER=efti
    - POSTGRES_PASSWORD=01234
    - POSTGRES_DB=efti_archive
    volumes:
    - archive-data:/var/lib/postgresql
    - ./DSL/Liquibase/archive-init.sql:/docker-entrypoint-initdb.d/archive-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efti -d efti_archive"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  liquibase:
    container_name: efti_liquibase
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    volumes:
    # A subdirectory, not /liquibase itself: that's the image's own liquibase
    # install (docker-entrypoint.sh, lib/, internal/...) and a bind mount there
    # would hide it instead of layering like the Dockerfile's COPY does.
    - ./DSL/Liquibase:/liquibase/changelog:ro
    environment:
    - AUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}
    # searchPath in liquibase.properties targets the image COPY layout
    # (DSL/Liquibase/ -> /liquibase/); override it for this bind-mounted layout.
    command: --defaultsFile=/liquibase/changelog/liquibase.properties --search-path=/liquibase/changelog update -DAUDIT_SALT=${AUDIT_SALT:-dev-local-audit-salt-change-me-32chars}

  resql:
    container_name: efti_resql
    build:
      context: .
      dockerfile: docker/resql/Dockerfile
    platform: linux/amd64
    environment:
      # Matches the `database` service's POSTGRES_PASSWORD above — resql.yaml
      # references this by name via password_env rather than embedding it in
      # the datasource URL.
      - RESQL_EFTI_PASSWORD=01234
      - RESQL_ARCHIVE_PASSWORD=01234
      - RESQL_INTERNAL_TOKEN
    # The distroless image provides its own probe; ReSQL listens on :8090.
    healthcheck:
      test: ["CMD", "/app/resql", "health", "--url", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      archive-database:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  # ADR-011 registry file server: plain nginx serving the JSON that `docker/registry/Dockerfile`
  # generates from registry/**/*.yml at build time. There is no mount and no runtime conversion —
  # a deployment with its own gates/platforms/authorities builds its own image. A malformed registry
  # file therefore fails `docker compose build`, not startup.
  # INTERNAL ONLY — the documents carry live platform API keys, so this port must never be published
  # or proxied (the same posture as resql, which also has no public port here).
  registry:
    container_name: efti_registry
    build:
      context: .
      dockerfile: docker/registry/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    # busybox wget: nginx:alpine ships no curl. health.json is generated by the converter.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health.json || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Turvis trust view (ADR-011 amendment, SPEC section 7.2): the allowlist-filtered view of registry/ as its
  # own static artifact, built from the same revision as `registry` (pass the same SOURCE_REVISION to both).
  # It carries no platform data and no apiKey, which is why Turvis reads this and never `registry`.
  # INTERNAL ONLY, no published port. Nothing consumes it yet (Turvis integration is #305/#308).
  turvis-trust:
    container_name: efti_turvis_trust
    build:
      context: .
      dockerfile: docker/turvis-trust/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health.json || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  ruuter:
    container_name: efti_ruuter
    build:
      context: .
      dockerfile: docker/ruuter/Dockerfile
    platform: linux/amd64
    cpus: '2.0'
    depends_on:
      resql:
        condition: service_healthy
      registry:
        condition: service_healthy
    mem_limit: 512M
    volumes:
      - ./constants.ini:/app/constants.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/efti/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # X-Road provider adapter (/xroad/**, ADR-006) on its own Ruuter. Reached only by the Security Server:
  # no published port here (compose.override.yml adds a loopback one for development) and it must never
  # be proxied or ingressed publicly. Its constants-xroad.ini (mounted, holds INTERNAL_SERVICE_TOKEN) and
  # internal_requests.allowed_urls (ruuter-xroad.yaml) limit what it can read and call. The forwarding
  # routes call the main `ruuter` for efti/api/v1/authority/*.
  ruuter-xroad:
    container_name: efti_ruuter_xroad
    build:
      context: .
      dockerfile: docker/ruuter-xroad/Dockerfile
    platform: linux/amd64
    cpus: '1.0'
    depends_on:
      resql:
        condition: service_healthy
      registry:
        condition: service_healthy
      ruuter:
        condition: service_healthy
      xml-mapper:
        condition: service_started
    mem_limit: 256M
    volumes:
      - ./constants-xroad.ini:/app/constants.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/xroad/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Public developer mock of the X-Road authority surface (/developer/**). Standalone by
  # design: no database, no core, no link to the real gate — so exposing it publicly cannot
  # leak real data or reach a privileged route. See docs/developer/x_road_developer_mock.md.
  ruuter-xroad-mock:
    container_name: efti_ruuter_xroad_mock
    build:
      context: .
      dockerfile: docker/ruuter-xroad-mock/Dockerfile
    platform: linux/amd64
    cpus: '0.25'
    mem_limit: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/developer/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Turvis mock (issue #306): the Turvis contract DSL (docs/specs/turvis/SPEC.md) served by a standalone
  # Ruuter, no database, no dependency on the gate, no real cryptography. DEVELOPMENT AND TEST ONLY: it has
  # a committed dev token (constants-turvis-mock.ini) and must never be deployed to production. It is not
  # built or deployed by .gitlab-ci.yml and has no devops chart. Nothing calls it yet (the edelivery
  # integration is #305), so no other service depends on it. The published port is loopback-only
  # (compose.override.yml).
  turvis-mock:
    container_name: efti_turvis_mock
    build:
      context: .
      dockerfile: docker/turvis-mock/Dockerfile
    platform: linux/amd64
    cpus: '0.25'
    mem_limit: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/turvis/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Scheduler for the gate's /ops/v1/* jobs (archive sweep, purges, read-model refresh). Job set:
  # DSL/CronManager/efti-ops.yaml, baked into the image (docker/cronmanager/Dockerfile) — a job
  # change needs `docker compose up --build cronmanager`. Internal only, like resql/registry: no
  # published port. OPS_AUTHORIZATION is the whole header value, `Bearer <ARCHIVE_OPS_TOKEN>`;
  # without it (or without CRONMANAGER_ADMIN_TOKEN) CronManager loads no job / does not start.
  cronmanager:
    container_name: efti_cronmanager
    build:
      context: .
      dockerfile: docker/cronmanager/Dockerfile
    environment:
      - OPS_AUTHORIZATION
      - CRONMANAGER_ADMIN_TOKEN
      - RUST_LOG=info
    depends_on:
      ruuter:
        condition: service_healthy
    cpus: '0.25'
    mem_limit: 64M

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
      args:
        - VITE_USE_PROD_TARA_URL=true
    depends_on:
      ruuter:
        condition: service_healthy
      ruuter-xroad-mock:
        condition: service_healthy

  edelivery:
    environment:
      - OWN_GATE_ID
      - RESQL_URL=http://resql:8090
      - RESQL_INTERNAL_TOKEN
      - REGISTRY_URL=http://registry:8080
      - RUUTER_URL=http://ruuter:8086
      - INTERNAL_SERVICE_TOKEN
      - LOGGER_CLASS
      - LOGGER_SERVICE_NAME=edelivery
      - KEYSTORE_DIR=/app/certs
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-changeit}
      # Turvis (#305): legacy in-process crypto is the default and Turvis is never called unless the mode is
      # shadow or turvis. TURVIS_URL and the dedicated TURVIS_INTERNAL_TOKEN have no default here, so this file
      # alone never ships a known token; compose.override.yml (dev/CI) points them at the turvis-mock.
      - TURVIS_INTEGRATION_MODE=${TURVIS_INTEGRATION_MODE:-legacy}
      - TURVIS_URL
      - TURVIS_INTERNAL_TOKEN
      - TURVIS_SHADOW_MAX_INFLIGHT=${TURVIS_SHADOW_MAX_INFLIGHT:-8}
      - TURVIS_MAX_PAYLOAD_MIB=${TURVIS_MAX_PAYLOAD_MIB:-40}
    volumes:
      - ./code/certs:/app/certs:ro
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
        - PROJECT=edelivery
        - PORT=8081
    depends_on:
      resql:
        condition: service_healthy
      registry:
        condition: service_healthy
    # A maximum Turvis payload (TURVIS_MAX_PAYLOAD_MIB=40) is held in several copies at once (about 12x the payload
    # on the outbound request side alone, measured on a 10 MiB payload), so 512M (410 MiB of heap) cannot carry one.
    mem_limit: 2G

  xml-mapper:
    environment:
      - LOGGER_CLASS
      - LOGGER_SERVICE_NAME=xml-mapper
      - INTERNAL_SERVICE_TOKEN
    build:
      context: code
      dockerfile: ../docker/code/Dockerfile
      args:
        - PROJECT=xml-mapper
        - PORT=8082
    mem_limit: 512M

  tara-mock:
    container_name: efti_tara_mock
    build:
      context: .
      dockerfile: docker/tara-mock/Dockerfile
    volumes:
      - tara-mock-vault:/service/vault
      - ./docker/tara-mock/identities.json:/service/identities.json:ro
      - ./docker/tara-mock/config.json:/service/config.json:ro

  tim-database:
    container_name: efti_tim_database
    image: postgres:18
    environment:
      - POSTGRES_USER=tim
      - POSTGRES_PASSWORD=tim-secret
      - POSTGRES_DB=tim
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - tim-data:/var/lib/postgresql

  # TIM's own image is distroless since 0.4.1-alpha (no shell/apt/openssl), so
  # the CA-trust wait/import and JWT-key generation that its entrypoint used
  # to do at boot now happen here, into volumes `tim` mounts read-only.
  tim-init:
    container_name: efti_tim_init
    build:
      context: .
      dockerfile: docker/tim-init/Dockerfile
    depends_on:
      - tara-mock
    volumes:
      - tara-mock-vault:/tara-mock-vault:ro
      - tim-jwt-key:/opt/tim/keys
      - tim-ca-bundle:/tim-ca-bundle

  tim:
    container_name: efti_tim
    build:
      context: .
      dockerfile: docker/tim/Dockerfile
    depends_on:
      tim-database:
        condition: service_started
      tim-init:
        condition: service_completed_successfully
    environment:
      - TIM_DATABASE_URL=postgres://tim:tim-secret@tim-database:5432/tim
      - TIM_ADMIN_TOKEN=dev-tim-admin-token
      - TIM_INTROSPECT_RUUTER_SECRET=${TIM_INTROSPECT_RUUTER_SECRET:-dev-introspect-secret}
      - TIM_TARA_CLIENT_ID=efti
      - TIM_TARA_CLIENT_SECRET=efti-secret
      - SSL_CERT_FILE=/tim-ca-bundle/ca-bundle.pem
    volumes:
      - tim-jwt-key:/opt/tim/keys:ro
      - tim-ca-bundle:/tim-ca-bundle:ro
    # The distroless image provides its own probe (no curl/shell available).
    healthcheck:
      test: ["CMD", "/app/tim", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  # Observability stack (MON-1/MON-2/MON-3). Scrapes edelivery/xml-mapper's klite-provided
  # /metrics endpoint (code/core/src/metrics/RequestMetrics.kt) -- Ruuter, ReSql and the registry
  # don't expose one yet. No published ports here (production-like); compose.override.yml adds
  # dev-only host bindings.
  prometheus:
    container_name: efti_prometheus
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - edelivery
      - xml-mapper

  alertmanager:
    container_name: efti_alertmanager
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    container_name: efti_grafana
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  data:
  archive-data:
  tim-ca-bundle:
  tara-mock-vault:
  tim-jwt-key:
  grafana-data:
  tim-data:
