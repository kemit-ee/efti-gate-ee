# Add more config for localhost development, e.g. port bindings
services:
  database:
    ports:
      - "${EFTI_DB_PORT:-54321}:5432"
  resql:
    ports:
      - "${EFTI_RESQL_PORT:-8090}:8090"
    develop:
      watch:
        - action: sync+restart
          path: ./DSL/Resql
          target: /app/sql
          initial_sync: true
  ruuter:
    ports:
      - "${EFTI_RUUTER_PORT:-8086}:8086"
    develop:
      watch:
        - action: sync+restart
          path: ./DSL/Ruuter
          target: /app/DSL
          initial_sync: true
  edelivery:
    ports:
      - 8081:8081
  xml-mapper:
    ports:
      - 8082:8082
  multiplexer:
    ports:
      - 8083:8083
  ui:
    ports:
      - 8000:80
    build:
      args:
        - VITE_USE_PROD_TARA_URL=false

  tara-mock:
    ports:
      - "8888:8080"

  tim:
    ports:
      - "8085:8085"

  tim-database:
    ports:
      - "19433:5432"

  http-tests:
    image: jetbrains/intellij-http-client
    depends_on:
      - ruuter
      - xml-mapper
    volumes:
      - ./:/workdir
    command: -L VERBOSE --env-file tests/http/http-client.env.json -e docker tests/http/consignments.http
