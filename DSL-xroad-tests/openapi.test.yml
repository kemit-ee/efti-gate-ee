# xroad/GET/provide/openapi.yml - the generated provider-side OpenAPI description. Public (the project
# guard is overridden), so it answers without any X-Road header and makes no upstream call.
mode: inprocess

tests:
  - name: OpenAPI description is public and lists the provider-side paths
    request:
      method: GET
      path: /xroad/provide/openapi
    expect:
      status: 200
      body_matches:
        openapi: "3.0.3"

  - name: a POST data route still demands X-Road-Client
    request:
      method: POST
      path: /xroad/provide/v1/echo
      headers: { content-type: "application/json" }
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }

  - name: a GET data route next to the public description still demands X-Road-Client
    request:
      method: GET
      path: /xroad/provide/v1/subsets
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }
