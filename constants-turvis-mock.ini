[DSL]
PORT=8091
# Development/test credential of the Turvis mock. NOT the fleet's INTERNAL_SERVICE_TOKEN (SPEC 11.2
# requires a dedicated token), and not a secret: it is committed, baked into the mock image and used
# by DSL-turvis-mock-tests. The mock must never be deployed to production.
# Own gate id, the fixed key_handle (SPEC 7.1): sign and decrypt answer KEY_HANDLE_UNKNOWN for any other.
OWN_GATE_ID=EU-EE
AUTH_MODE=shared-token
TURVIS_INTERNAL_TOKEN=dev-turvis-mock-token
