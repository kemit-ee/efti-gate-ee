[book]
title = "eFTI Gate (EE)"
authors = ["KeMIT"]
description = "Run, seed and verify the Estonian eFTI Gate locally: two gates exchanging AS4 messages, sample data, gate certificates and a Postman collection."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/kemit-ee/efti-gate-ee"
edit-url-template = "https://github.com/kemit-ee/efti-gate-ee/edit/dev/docs/book/{path}"
site-url = "/efti-gate-ee/"
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.playground]
runnable = false

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
