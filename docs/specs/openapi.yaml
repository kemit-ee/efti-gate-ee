  # ----------------------------------------------------------------------------
  # ADMIN API — GATES
  # ----------------------------------------------------------------------------

  /api/v1/gates:
    get:
      tags: [Admin - Gates]
      summary: List gates
      operationId: listGates
      description: |
        Returns all registered eFTI gates visible to the authenticated admin user.
        SUPER_ADMIN sees all gates; gate-scoped ADMIN sees only their own gate.
        Paginated; total row count returned in `X-Total-Count` header.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: List of gates
          headers:
            X-Total-Count:
              description: Total number of rows matching the filter (across all pages).
              schema:
                type: integer
                example: 42
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gate'
              example:
                - id: "eu-xx01"
                  countryCode: "EE"
                  eDeliveryUrl: "https://efti.example.com/services/msh"
                  status: "ONLINE"
                  createdAt: "2025-01-15T09:00:00Z"
                - id: "eu-zz01"
                  countryCode: "FI"
                  eDeliveryUrl: "https://efti-peer.example.com/services/msh"
                  status: "ONLINE"
                  createdAt: "2025-02-01T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin - Gates]
      summary: Create gate
      operationId: createGate
      description: |
        Creates a new gate record. The body's `id` must not already exist — if it
        does, returns 409. After successful create, the gate is immediately pinged
        to verify connectivity. To update an existing gate, use
        `PUT /api/v1/gates/{gateId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateWrite'
            example:
              id: "eu-yy01"
              countryCode: "DE"
              eDeliveryUrl: "https://efti-peer.example.com/services/msh"
              eDeliveryCert: "-----BEGIN CERTIFICATE-----\nMIIC...-----END CERTIFICATE-----"
              status: "ONLINE"
      responses:
        '201':
          description: Gate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/gates/own:
    get:
      tags: [Admin - Gates]
      summary: Get own gate configuration
      operationId: getOwnGate
      description: Returns the configuration of this gate itself (read from config, not DB).
      responses:
        '200':
          description: Own gate configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/gates/{gateId}:
    get:
      tags: [Admin - Gates]
      summary: Get gate
      operationId: getGate
      description: Returns the current state for the given gate id — the latest row by `created_at`. Soft-deleted gates (latest row `is_active=FALSE`) are returned with `isGateActive=false`.
      parameters:
        - $ref: '#/components/parameters/GateIdPath'
      responses:
        '200':
          description: Gate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Admin - Gates]
      summary: Update gate
      operationId: updateGate
      description: |
        Updates an existing gate record. Append-only: the gate INSERTs a new
        `gates` row sharing the same logical `id`; the latest row by `created_at`
        is the current state. Operator-driven status transitions (manual
        `DISABLED`) go through here; ping-driven `ONLINE`/`OFFLINE` flips are
        written by `POST /api/v1/admin/ping-gates` (CronManager). After
        successful update, the gate is pinged to verify the new configuration.

        404 if `gateId` is unknown. To create a new gate, use `POST /api/v1/gates`.
      parameters:
        - $ref: '#/components/parameters/GateIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateWrite'
      responses:
        '200':
          description: Gate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Admin - Gates]
      summary: Delete gate
      operationId: deleteGate
      description: |
        Removes a gate from the registry. A gate cannot delete itself.
        Requires write access to the specified gate ID. Append-only: writes a
        latest row with `is_active=FALSE`; cross-border G2G traffic to/from this
        gate stops on the next registry-sync NOTIFY.
      parameters:
        - $ref: '#/components/parameters/GateIdPath'
      responses:
        '204':
          description: Gate deleted (latest row written with `is_active=FALSE`)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/gates/{gateId}/ping:
    post:
      tags: [Admin - Gates]
      summary: Ping gate
      operationId: pingGate
      description: Manually triggers an eDelivery ping to the specified gate to test connectivity.
      parameters:
        - $ref: '#/components/parameters/GateIdPath'
      responses:
        '200':
          description: Ping successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

