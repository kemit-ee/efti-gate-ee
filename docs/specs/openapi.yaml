  # ----------------------------------------------------------------------------
  # ADMIN API — USERS
  # ----------------------------------------------------------------------------

  /api/v1/users:
    get:
      tags: [Admin - Users]
      summary: List users
      operationId: listUsers
      description: |
        Lists users visible to the authenticated admin. SUPER_ADMIN sees all users;
        gate-scoped ADMIN sees only users within their gate/authority scope.
        Paginated; total row count in `X-Total-Count` header.
      parameters:
        - name: gateId
          in: query
          required: false
          schema:
            type: string
            example: "eu-xx01"
        - name: authorityId
          in: query
          required: false
          schema:
            type: string
            example: "auth-mta"
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: List of users
          headers:
            X-Total-Count:
              description: Total number of rows matching the filter (across all pages).
              schema:
                type: integer
                example: 24
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Admin - Users]
      summary: Create user
      operationId: createUser
      description: |
        Creates a `users` row representing a human caller (authority officer or
        gate admin). The user authenticates via TARA OIDC; the `tara_sub` field
        in the body is the user's Estonian PIC. On the first inbound JWT whose
        `sub` matches this `tara_sub`, the gate has a row to bind to.

        The gate does **not** issue user secrets — TARA owns auth. Platform
        identity is mTLS via `platforms.cert_subject`, not a user row; G2G
        identity is mTLS at the AS4 access point. Neither has a `users` record.

        409 if `tara_sub` already exists on an active row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWrite'
            examples:
              authorityUser:
                summary: Authority user with subset restrictions
                value:
                  taraSub: "EE00000000000"
                  name: "MTA Inspector"
                  email: "inspector@example.com"
                  roles:
                    AUTHORITY: ["auth-mta"]
                  subsets: ["EU01", "EU02"]
              gateAdminUser:
                summary: Gate-scoped admin
                value:
                  taraSub: "EE00000000000"
                  name: "Gate Admin (Estonia)"
                  email: "admin@example.com"
                  isAdmin: true
                  roles:
                    ADMIN: ["eu-xx01"]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{userId}:
    get:
      tags: [Admin - Users]
      summary: Get user
      operationId: getUser
      description: Returns the latest row for the given user id.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Admin - Users]
      summary: Update user
      operationId: updateUser
      description: |
        Updates an existing user. Append-only: INSERTs a new `users` row sharing the
        same logical `id`; the latest row by `created_at` is the current state.
        404 if `userId` is unknown. `taraSub` is required (PIC for TARA users;
        literal `local-admin` for the break-glass row).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWrite'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Admin - Users]
      summary: Delete user
      operationId: deleteUser
      description: Deletes a user. Admins cannot delete themselves.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{userId}/revoke-token:
    post:
      tags: [Admin - Users]
      summary: Revoke all of a user's outstanding tokens (broadcast revocation)
      operationId: revokeUserToken
      description: |
        Broadcast revocation of every JWT currently issued for `userId`. The gate
        writes a new `users` row with `token_revoked_at = NOW()` (append-only); on
        subsequent JWT validation the gate rejects any JWT whose `iat` predates the
        resolved user's latest `token_revoked_at`. The user's next request triggers
        re-authentication via TARA.

        Distinct from `POST /api/v1/auth/logout`, which revokes a single specific
        JWT by adding its `jti` to the `sessions` denylist. Use revoke-token when
        the entire user is suspect (compromised credential, offboarding) and you
        want to invalidate every JWT they hold; use logout when the user is just
        ending a session.

        Idempotent — calling twice in succession produces the same effective state
        (the latest `users` row's `token_revoked_at` advances; older JWTs stay
        rejected).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '204':
          description: Tokens revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/user:
    get:
      tags: [Admin - Users]
      summary: Get current authenticated user
      operationId: getCurrentUser
      description: Returns the profile of the currently authenticated user.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

