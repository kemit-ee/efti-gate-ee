      description: 'AS4/eDelivery edge proxy (Ruuter pass-through proxy, issue turnerrainer/Ruuter#134). This route makes
        Ruuter the entry point for external eDelivery traffic: a peer gate POSTs its AS4 message to POST /services/msh and
        Ruuter streams it byte-identically to the Klite edelivery container''s /services/msh, so the bytes the AS4 signature
        covers are never re-serialised. Ruuter does not parse, decrypt or transform the body. Request inputs: Content-Type
        (required; enforced by the sibling .guard.yml as multipart/related with type="application/soap+xml" and a boundary)
        and the AS4 multipart body (opaque bytes, capped at max_body_bytes). The per-route controls: body cap, Content-Encoding
        allow-list and in-flight concurrency cap, are declared below, mirroring edelivery''s own BODY_LIMIT_MB default so
        the edge is never weaker than the service behind it.

        '
      operationId: post_services_msh
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: false
      responses:
        default:
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Proxied upstream response from http://edelivery:8081/services/msh
      summary: msh
      tags:
      - services
security: []
