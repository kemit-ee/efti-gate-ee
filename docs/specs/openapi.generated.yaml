      description: 'ADR-012 read-model refresh - CronManager calls this on a timer (Bearer ARCHIVE_OPS_TOKEN). (1) Writes
        new full snapshot generations of the consignment-counts and consignment-summary read models, each published in the
        same SQL statement as its snapshot (readers never see a partial snapshot; overlapping runs are serialised by an advisory
        lock). (2) Deletes generations older than keepGenerations. The source tables stay canonical; the read model can always
        be rebuilt. Body (optional): {keepGenerations: number}. The registry lists have no read model any more (ADR-011):
        gates/platforms/authorities live in registry/** and are served by the `registry` service, so there is nothing to snapshot
        here.'
      operationId: post_ops_v1_refresh_read_models
      requestBody:
        content:
          application/json:
            schema:
              properties:
                keepGenerations:
                  description: How many of the newest published generations to keep. Defaults to 2; the current generation
                    is never removed.
                  type: number
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  generation:
                    type: string
                  purgedRows:
                    type: integer
                  rows:
                    type: integer
                type: object
          description: OK
          headers:
