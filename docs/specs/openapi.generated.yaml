  /ops/v1/archive-consignments:
    post:
      description: 'Scheduled archive sweep - CronManager calls this on a timer (Bearer ARCHIVE_OPS_TOKEN). Everything goes
        through Ruuter + ReSql across two datasources: (1) SELECT a batch of superseded consignments rows from the live DB
        - those whose newer sibling is older than olderThanDays (default 2); (2) INSERT that batch into the separate archive
        DB; (3) read every row back from the archive DB and confirm it landed; (4) only if 100 % are confirmed, DELETE exactly
        those rows from the live DB. A verification mismatch deletes nothing. One batch per call - re-invoke until `candidates`
        is 0. Body (optional): {olderThanDays: number, batchLimit: number}.'
      operationId: post_ops_v1_archive_consignments
      requestBody:
        content:
          application/json:
            schema:
              properties:
                batchLimit:
                  description: Maximum number of candidate rows to move in this call. Re-invoke until `candidates` is 0.
                  type: number
                olderThanDays:
                  description: Age threshold in days for a superseded row's newer sibling before it becomes archivable. Defaults
                    to 2 when omitted.
                  type: number
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  archived:
                    type: integer
                  candidates:
                    type: integer
                  deleted:
                    type: integer
                type: object
          description: OK
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            traceparent:
              $ref: '#/components/headers/traceparent'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            traceparent:
              $ref: '#/components/headers/traceparent'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            traceparent:
              $ref: '#/components/headers/traceparent'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Gateway
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            traceparent:
              $ref: '#/components/headers/traceparent'
      summary: archive-consignments
      tags:
      - ops
  /ops/v1/expire-identifiers:
    post:
      description: 'Cabotage-expiry sweep (Reg 2024/1942 Art 11(4)) - CronManager calls this on a timer (Bearer ARCHIVE_OPS_TOKEN).
        Every current road consignment (transport mode 3, latest row ACTIVE) whose carrier acceptance date is more than 14
        days ago gets an INACTIVE copy appended as its new latest row; nothing is updated or deleted. At most 1000 per call
        - `more: true` means re-invoke. Body (optional): {dryRun: boolean} - true only counts the candidates and writes nothing.'
      operationId: post_ops_v1_expire_identifiers
      requestBody:
        content:
          application/json:
            schema:
              properties:
                dryRun:
                  description: When true, count the expirable consignments without appending INACTIVE rows or a jobs_execution_log
                    row. Defaults to false.
                  type: boolean
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  candidates:
                    type: integer
                  dryRun:
                    type: boolean
                  expired:
                    type: integer
                  more:
                    type: boolean
                type: object
          description: OK
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            traceparent:
              $ref: '#/components/headers/traceparent'
        '400':
