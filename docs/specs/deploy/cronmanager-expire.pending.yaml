# CronManager job definition: daily cabotage-expiry sweep — NOT DEPLOYED.
# https://github.com/turnerrainer/CronManager (schema of 0.2.3-alpha, same as DSL/CronManager/efti-ops.yaml)
#
# The target route does not exist yet: there is no DSL/Ruuter/ops/POST/v1/expire-identifiers.yml.
# The spec (docs/specs/data-transformations.md `expires_at`, diagrams seq-08/state-01) still names
# the pre-Ruuter path /api/v1/admin/expire-identifiers. This file is therefore kept outside
# DSL/CronManager/ (which the cronmanager image loads): a scheduled call to a missing route would
# only 404 every night. When the route lands under /ops/v1/, move this job into
# DSL/CronManager/efti-ops.yaml.
#
# Marks road consignments inactive once `transport_date + 14 days < NOW()` per Reg 2024/1942
# Art 11(4) (cabotage retention).

efti_gate_expire_identifiers:
  # 03:45 daily — operator-tunable.
  trigger: "0 45 3 * * ?"
  type: http
  method: POST
  url: http://ruuter:8086/ops/v1/expire-identifiers
  headers:
    Content-Type: application/json
  headerEnvs:
    Authorization: OPS_AUTHORIZATION
  retryCount: 3
  retryDelay: 30000
