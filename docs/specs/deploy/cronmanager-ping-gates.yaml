# CronManager job definition: peer-gate health probe
# https://github.com/turnerrainer/cronmanager
#
# *** NOT YET IMPLEMENTED ***
# The target route below (`/ops/v1/ping-gates`) does not exist in DSL/Ruuter/ops/
# — only archive-consignments and purge-archive are implemented there today (see
# cronmanager-archive.yaml). This file documents the intended shape for when that
# route is built; do not deploy it as-is, CronManager would just get 404s.
#
# Probes every peer gate in the local registry over AS4 or Fast HTTP
# every 5 minutes; INSERTs new `gates` rows with the latest health
# status.
#
# turnerrainer/cronmanager's HTTP job type is bare method+url only — no `headers:`,
# no `body:`, and no runtime env-var interpolation of job fields (confirmed against
# its book/src/configuration.md "YAML job file shape" reference, 2026-09-21). Every
# `${...}` placeholder below is therefore NOT resolved by CronManager itself — it
# MUST be substituted by your deploy pipeline into a rendered file BEFORE that file
# is placed in CronManager's `dsl_path`. Never commit a rendered file with a real
# token — only this template, with the placeholders intact, belongs in git.
#
# ARCHIVE_OPS_TOKEN: same static ops token as the archive/purge jobs, reused here
# for consistency — would need its own DSL/Ruuter/ops/POST/v1/ping-gates.yml route
# behind the existing ops/.guard.yml (?opsToken= query param, see that guard for
# why a header credential isn't an option here).

efti_gate_ping_gates:
  # Quartz cron: every 5 minutes. Operator-tunable, but going much
  # rarer than 5 min hurts the registry-sync detection latency.
  trigger: "0 */5 * * * ?"

  type: http
  method: POST
  url: "${GATE_BASE_URL}/ops/v1/ping-gates?opsToken=${ARCHIVE_OPS_TOKEN}"

  retryCount: 2
  retryDelay: 10000
