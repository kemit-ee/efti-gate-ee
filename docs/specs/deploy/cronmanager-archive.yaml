# CronManager job definitions: consignments archival sweep + retention purge
# https://github.com/Buerostack/CronManager
#
# Canonical reference for issue #143 / #56 (Append-Only Archival via CronManager).
# Implementation: DSL/Ruuter/ops/POST/v1/{archive-consignments,purge-archive}.yml,
# see docs/architecture/infrastructure/append_only_archival.md for the full flow.
# Drop this file (or an operator-tuned variant) into CronManager's DSL/jobs/
# directory; restart CronManager to load. Operators MUST inject the
# ARCHIVE_OPS_TOKEN env var from a Kubernetes Secret — do NOT commit a token
# in this YAML. Same value as the gate's constants.ini ARCHIVE_OPS_TOKEN
# (see docs/specs/deploy/resource-and-secrets-requirements.md §3.2).

efti_gate_archive_sweep:
  # Quartz cron: 03:00 every day. Operator-overridable. One batch of superseded
  # consignments rows per HTTP call — re-invoke on a short interval (e.g. every
  # few minutes) until the response's `candidates` field is 0, or let this
  # trigger alone catch up gradually; either is safe, the sweep is idempotent.
  trigger: "0 0 3 * * ?"

  type: http
  method: POST
  url: "${GATE_BASE_URL}/ops/v1/archive-consignments"

  headers:
    Authorization: "Bearer ${ARCHIVE_OPS_TOKEN}"
    Content-Type: "application/json"

  # Optional body: defaults are olderThanDays=2, batchLimit unset (ReSql default).
  # A row only moves once its newer sibling is at least olderThanDays old — the
  # current row (including a DELETED tombstone) never moves.
  body: |
    {
      "olderThanDays": 2
    }

  # The route itself is a strict pipeline (select -> insert -> verify -> delete)
  # and deletes nothing on a verification mismatch, so a retry after a transient
  # failure just re-selects the same still-live batch.
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: "30s"

  timeout: "60s"

efti_gate_archive_purge:
  # Quartz cron: 04:00 every day — after the sweep above, on a separate slower
  # retention timer. Permanently deletes rows from the *archive* DB once they
  # exceed keepDays (default 2555 ~= 7 years); does not touch the live DB.
  trigger: "0 0 4 * * ?"

  type: http
  method: POST
  url: "${GATE_BASE_URL}/ops/v1/purge-archive"

  headers:
    Authorization: "Bearer ${ARCHIVE_OPS_TOKEN}"
    Content-Type: "application/json"

  # Optional body: default keepDays=2555. Override only for a shorter/longer
  # legal retention period on cold storage.
  body: |
    {}

  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: "30s"

  timeout: "60s"
