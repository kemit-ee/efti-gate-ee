[DSL]
PORT=8087
# Only what DSL/Ruuter-xroad reads. TIM_ADMIN_TOKEN, ARCHIVE_OPS_TOKEN and DEV_LOGIN_ENABLED stay in
# constants.ini, so this container never holds them. Keep the origins in step with
# internal_requests.allowed_urls in ruuter-xroad.yaml.
#
# RUUTER_URL is the MAIN Ruuter: the forwarding routes call efti/api/v1/authority/* there.
RUUTER_URL=http://ruuter:8086
RESQL_URL=http://resql:8090
REGISTRY_URL=http://registry:8080
XML_MAPPER_URL=http://xml-mapper:8082
# Must equal INTERNAL_SERVICE_TOKEN in constants.ini. Mounted read-only at runtime (compose.yml),
# never baked into the image; production mounts it from a Secret like constants.ini.
INTERNAL_SERVICE_TOKEN=dev-internal-service-token-change-me
