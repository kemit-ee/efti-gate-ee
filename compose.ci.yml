# CI-specific Docker Compose override.
#
# Project name: efti_gate_ee_ci_stack  (via -p flag — override files cannot set name:)
#
# Usage (set EFTI_*_PORT env vars to pick conflict-free host ports):
#   EFTI_DB_PORT=19432 EFTI_RESQL_PORT=19090 EFTI_RUUTER_PORT=19086 \
#     docker compose -p efti_gate_ee_ci_stack -f compose.yml -f compose.ci.yml \
#     build database liquibase resql ruuter
#   EFTI_DB_PORT=19432 EFTI_RESQL_PORT=19090 EFTI_RUUTER_PORT=19086 \
#     docker compose -p efti_gate_ee_ci_stack -f compose.yml -f compose.ci.yml \
#     up -d database liquibase resql ruuter
#   EFTI_DB_PORT=19432 EFTI_RESQL_PORT=19090 EFTI_RUUTER_PORT=19086 \
#     docker compose -p efti_gate_ee_ci_stack -f compose.yml -f compose.ci.yml down -v
#
# What this overrides:
#   - resql: depends on liquibase completing successfully before starting.
#     On a fresh CI volume the schema migrations must run before ResQL can
#     serve queries against the operational tables.
#
# Port selection: pass EFTI_*_PORT env vars to pick conflict-free host ports.
# Pass 19xxx values to avoid conflicts with a running dev stack on the same host.

services:
  database:
    container_name: efti_ci_database
    ports:
      - "${EFTI_DB_PORT:-54321}:5432"

  liquibase:
    container_name: efti_ci_liquibase

  resql:
    container_name: efti_ci_resql
    ports:
      - "${EFTI_RESQL_PORT:-8090}:8090"
    depends_on:
      database:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  ruuter:
    container_name: efti_ci_ruuter
    ports:
      - "${EFTI_RUUTER_PORT:-8086}:8086"
