# CI-specific Docker Compose override.
#
# Usage (set EFTI_*_PORT env vars to pick conflict-free host ports):
#   EFTI_DB_PORT=19432 EFTI_RESQL_PORT=19090 EFTI_RUUTER_PORT=19086 \
#     docker compose -f compose.yml -f compose.ci.yml \
#     build database liquibase resql ruuter
#   EFTI_DB_PORT=19432 EFTI_RESQL_PORT=19090 EFTI_RUUTER_PORT=19086 \
#     docker compose -f compose.yml -f compose.ci.yml \
#     up -d database liquibase resql ruuter
#   EFTI_DB_PORT=19432 EFTI_RESQL_PORT=19090 EFTI_RUUTER_PORT=19086 \
#     docker compose -f compose.yml -f compose.ci.yml down -v
#
# What this overrides:
#   - resql: depends on liquibase completing successfully before starting.
#     On a fresh CI volume the schema migrations must run before ResQL can
#     serve queries against the operational tables.
#
# Port selection: compose.yml uses ${EFTI_*_PORT:-<default>} interpolation.
# Pass 19xxx values to avoid conflicts with a running dev stack on the same host.

services:
