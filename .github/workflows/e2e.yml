name: E2E smoke tests

on:
  push:
  pull_request:

jobs:
  dsl-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: dsl-lint (both DSL roots) + dsl-test
        # dsl-lint / dsl-test ship inside the runtime image since Ruuter 0.9.14-rc
        # (turnerrainer/Ruuter#83), built from exactly the engine version they lint
        # against — no separate tools image to build. Keep this tag in step with
        # docker/ruuter/Dockerfile.
        run: |
          IMAGE=turnerrainer/ruuter:0.10.1-rc
          run() { docker run --rm -v "$PWD:/workdir" -w /workdir "$IMAGE" "$@"; }
          run dsl-lint --dsl DSL/Ruuter            --constants constants.ini
          run dsl-lint --dsl DSL/Ruuter-xroad-mock --constants constants-xroad-mock.ini
          run dsl-test --dsl DSL/Ruuter --tests DSL-tests --constants constants.ini
          run dsl-test --dsl DSL/Ruuter-xroad-mock --tests DSL-mock-tests --constants constants-xroad-mock.ini

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: efti input-contract check
        run: python3 scripts/validate-dsl.py
      - name: rich mock dataset XSD and field-coverage checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils
          python3 tests/mock/dataset.py
      - name: append-only SQL regression checks (disposable PostgreSQL)
        run: python3 tests/sql/regression.py
      - name: fresh-install schema regression checks
        run: python3 tests/sql/regression.py --init

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('code/**/*.gradle*', 'code/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: gradlew test
        # Mirrors .gitlab-ci.yml's backend:test — blocking, same as there.
        # jacocoTestReport runs automatically after `test` (finalizedBy in build.gradle.kts).
        working-directory: code
        run: ./gradlew test

      - name: gradlew jacocoTestCoverageVerification
        # Mirrors .gitlab-ci.yml's backend:coverage-gate: allow_failure until every module's
        # 80% line-coverage baseline is raised (core cleared it; multiplexer/pubsub/edelivery
        # are still 38-58%, see that job's comment) — report, don't gate PRs yet.
        continue-on-error: true
        working-directory: code
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            code/*/build/test-results/test/
            code/*/build/reports/jacoco/test/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EFTI_DB_PORT: 19432
      EFTI_RESQL_PORT: 19090
      EFTI_RUUTER_PORT: 19086

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build CI images
        run: |
          CI_TAG_ARGS=()
          while read -r CI_BUILD_SERVICE; do
            CI_TAG_ARGS+=(--set "$CI_BUILD_SERVICE.tags=efti_gate_ee-$CI_BUILD_SERVICE")
          done < <(docker buildx bake --print | jq -r '.target | keys[]')
          docker buildx bake \
            "${CI_TAG_ARGS[@]}" \
            --load \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

      - name: Start services
        run: |
          docker compose -f compose.yml up --no-build -d --wait || { docker compose logs; exit 1; }

      - name: Run http tests
        run: |
          docker compose run --rm http-tests

      - name: Print logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown
        if: always()
        run: |
          docker compose down -v
