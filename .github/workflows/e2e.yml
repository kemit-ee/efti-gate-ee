name: E2E smoke tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EFTI_DB_PORT: 19432
      EFTI_RESQL_PORT: 19090
      EFTI_RUUTER_PORT: 19086

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build CI images
        run: |
          docker buildx bake \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

      - name: Start services
        run: |
          docker compose -f compose.yml up -d --wait || docker compose logs

      - name: Run http tests
        run: |
          docker compose run --rm http-tests

      - name: Print logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown
        if: always()
        run: |
          docker compose down -v
