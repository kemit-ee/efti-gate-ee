name: E2E smoke tests

on:
  push:
  pull_request:

jobs:
  dsl-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dsl-tools (Ruuter dsl-lint + dsl-test, pinned to the runtime tag)
        uses: docker/build-push-action@v6
        with:
          context: docker/dsl-tools
          load: true
          tags: dsl-tools:local
          cache-from: type=gha,scope=dsl-tools
          cache-to: type=gha,mode=max,scope=dsl-tools

      - name: dsl-lint (both DSL roots) + dsl-test
        run: |
          run() { docker run --rm -v "$PWD:/workdir" -w /workdir dsl-tools:local "$@"; }
          run dsl-lint --dsl DSL/Ruuter            --constants constants.ini
          run dsl-lint --dsl DSL/Ruuter-xroad-mock --constants constants-xroad-mock.ini
          run dsl-test --dsl DSL/Ruuter --tests DSL-tests --constants constants.ini

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: efti input-contract check
        run: python3 scripts/validate-dsl.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EFTI_DB_PORT: 19432
      EFTI_RESQL_PORT: 19090
      EFTI_RUUTER_PORT: 19086

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build CI images
        run: |
          docker buildx bake \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

      - name: Start services
        run: |
          docker compose -f compose.yml up -d --wait || docker compose logs

      - name: Run http tests
        run: |
          docker compose run --rm http-tests

      - name: Print logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown
        if: always()
        run: |
          docker compose down -v
