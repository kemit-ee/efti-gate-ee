name: Issue prerequisite tests

on:
  pull_request:
    paths:
      - '.github/scripts/issue-prerequisites*'
      - '.github/workflows/issue-prerequisites*'
  push:
    paths:
      - '.github/scripts/issue-prerequisites*'
      - '.github/workflows/issue-prerequisites*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test .github/scripts/issue-prerequisites.test.cjs
