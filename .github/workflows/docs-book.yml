name: docs-book

# Builds the mdBook in docs/book/ and publishes it to GitHub Pages
# (https://kemit-ee.github.io/efti-gate-ee/). Pull requests only build it, so a broken book fails
# the PR; pushes to dev (and a manual run) also deploy.
#
# One-time repository setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [dev]
    paths:
      - 'docs/book/**'
      - '.github/workflows/docs-book.yml'
  pull_request:
    paths:
      - 'docs/book/**'
      - '.github/workflows/docs-book.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          MDBOOK_VER=0.4.40
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VER}/mdbook-v${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Install mdbook-mermaid
        run: |
          MERMAID_VER=0.14.1
          curl -sSfL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VER}/mdbook-mermaid-v${MERMAID_VER}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Build
        run: mdbook build docs/book
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
