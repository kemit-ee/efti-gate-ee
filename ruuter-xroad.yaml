port: 8087

# Standalone Ruuter for the X-Road provider adapter (/xroad/**). Only the Security Server may reach it:
# the guard trusts X-Road-Client unconditionally (ADR-006), so this listener must never be proxied or
# ingressed publicly.
#
# Same list as ruuter.yaml. 502 is required: the forwarding routes normalise a core or ReSql failure to
# 502 GATEWAY_UNAVAILABLE, and without it here Ruuter would replace the RFC 7807 body with a generic error.
http_codes_allow_list: [200, 201, 202, 204, 400, 401, 403, 404, 409, 415, 422, 500, 502, 503, 504]

dsl:
  project: xroad

guards:
  enforce_on_methods: [GET, POST, PUT, DELETE]

incoming_requests:
  request_timeout_ms: 90000
  allowed_method_types: [GET, POST, PUT, DELETE]

internal_requests:
  # Every target is a private compose address, so the private-network block stays off and the
  # allowlist below is what limits outbound calls. Origins must match constants-xroad.ini.
  block_private_networks: false
  allowed_urls:
    - http://registry:8080
    - http://resql:8090
    - http://ruuter:8086
    - http://xml-mapper:8082

stop_in_case_of_exception: true

logging:
  display_request_content: false
  display_response_content: false
