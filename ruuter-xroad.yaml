port: 8087

# Kept in sync with ruuter.yaml so an upstream status is never silently swapped for a generic error.
http_codes_allow_list: [200, 201, 202, 204, 400, 401, 403, 404, 409, 422, 500, 504]

dsl:
  project: xroad

guards:
  enforce_on_methods: [GET, POST, PUT, DELETE]

incoming_requests:
  allowed_method_types: [GET, POST, PUT, DELETE]

internal_requests:
  # The X-Road guards and handlers call ReSQL by compose service name (http://resql:8090), which
  # is a private-network address. There is no loopback helper DSL on this Ruuter — see ADR-006 for
  # why the authority lookup is repeated in each handler instead of factored into an internal route.
  block_private_networks: false

stop_in_case_of_exception: true

logging:
  display_request_content: false
  display_response_content: false
