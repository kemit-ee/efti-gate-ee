# efti/GET/api/v1/xtr/ready - outbound X-Road client (XTR) reachability probe; the guard is the
# efti/GET/api/v1 internal-service-token check.
mode: mock-http
constants:
  XTR_URL: "{MOCK}"
  INTERNAL_SERVICE_TOKEN: "test-internal-token"
tests:
  - name: no service token -> 401
    request:
      method: GET
      path: /efti/api/v1/xtr/ready
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }

  - name: XTR answers its health -> 200
    setup:
      mocks:
        - url_matches: /health
          method: GET
          status: 200
          body: { status: "ok" }
    request:
      method: GET
      path: /efti/api/v1/xtr/ready
      headers: { x-internal-service-token: "test-internal-token" }
    expect:
      status: 200

  - name: XTR unhealthy -> 502 GATEWAY_UNAVAILABLE
    setup:
      mocks:
        - url_matches: /health
          method: GET
          status: 503
          body: { status: "down" }
    request:
      method: GET
      path: /efti/api/v1/xtr/ready
      headers: { x-internal-service-token: "test-internal-token" }
    expect:
      status: 502
      body_matches: { code: "GATEWAY_UNAVAILABLE" }
