# POST /ops/v1/purge-async-responses — CronManager's AS4 hand-off retention timer. The ops guard
# is a literal Bearer compare; a ReSql error must be a 502, never a 200 with a bogus count.
mode: mock-http
constants:
  RESQL_URL: "{MOCK}"
  ARCHIVE_OPS_TOKEN: "test-ops-token"

tests:
  - name: no ops token -> 401
    request:
      method: POST
      path: /ops/v1/purge-async-responses
      body: {}
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }

  - name: wrong ops token -> 401
    request:
      method: POST
      path: /ops/v1/purge-async-responses
      headers: { authorization: "Bearer wrong" }
      body: {}
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }

  - name: valid token returns the purged count
    setup:
      mocks:
        - url_matches: /efti/delete_expired_async_responses
          method: POST
          body: [{ purgedCount: 3 }]
        - url_matches: /efti/insert_job_execution_log
          method: POST
          body: []
    request:
      method: POST
      path: /ops/v1/purge-async-responses
      headers: { authorization: "Bearer test-ops-token" }
      body: { keepMinutes: 10 }
    expect:
      status: 200
      body: { purged: 3 }

  - name: a ReSql error is a 502
    setup:
      mocks:
        - url_matches: /efti/delete_expired_async_responses
          method: POST
          status: 500
          body: []
        - url_matches: /efti/insert_job_execution_log
          method: POST
          body: []
    request:
      method: POST
      path: /ops/v1/purge-async-responses
      headers: { authorization: "Bearer test-ops-token" }
      body: {}
    expect:
      status: 502
      body_matches: { code: "ASYNC_RESPONSES_PURGE_FAILED" }
