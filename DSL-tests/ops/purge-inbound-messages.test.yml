# POST /ops/v1/purge-inbound-messages - CronManager's inbound AS4 duplicate-elimination retention timer (#336). The ops guard
# is a literal Bearer compare; a ReSql error must be a 502, never a 200 with a bogus count.
mode: mock-http
constants:
  RESQL_URL: "{MOCK}"
  ARCHIVE_OPS_TOKEN: "test-ops-token"

tests:
  - name: no ops token -> 401
    request:
      method: POST
      path: /ops/v1/purge-inbound-messages
      body: {}
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }

  - name: wrong ops token -> 401
    request:
      method: POST
      path: /ops/v1/purge-inbound-messages
      headers: { authorization: "Bearer wrong" }
      body: {}
    expect:
      status: 401
      body_matches: { code: "UNAUTHORIZED" }

  - name: keepHours of the wrong type -> 400
    request:
      method: POST
      path: /ops/v1/purge-inbound-messages
      headers: { authorization: "Bearer test-ops-token", content-type: "application/json" }
      body: { keepHours: "ten" }
    expect:
      status: 400

  - name: valid token returns the purged count
    setup:
      mocks:
        - url_matches: /efti/delete_expired_inbound_messages
          method: POST
          body: [{ purgedCount: 3 }]
        - url_matches: /efti/insert_job_execution_log
          method: POST
          body: []
    request:
      method: POST
      path: /ops/v1/purge-inbound-messages
      headers: { authorization: "Bearer test-ops-token", content-type: "application/json" }
      body: { keepHours: 48 }
    expect:
      status: 200
      body: { purged: 3 }

  - name: a ReSql error is a 502
    setup:
      mocks:
        - url_matches: /efti/delete_expired_inbound_messages
          method: POST
          status: 500
          body: []
        - url_matches: /efti/insert_job_execution_log
          method: POST
          body: []
    request:
      method: POST
      path: /ops/v1/purge-inbound-messages
      headers: { authorization: "Bearer test-ops-token", content-type: "application/json" }
      body: {}
    expect:
      status: 502
      body_matches: { code: "INBOUND_MESSAGES_PURGE_FAILED" }
