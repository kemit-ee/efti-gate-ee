# eFTI Gate (EE) source pipeline — standard-service-delivery@8.0.1.
# Eleven images (liquibase, turvis-trust and, until its devops chart exists, cronmanager are build-only;
# resql bakes the same RELEASE_VERSION into databaseMigration; registry is the ADR-011 registry
# file server, turvis-trust the generated Turvis trust view built from the same revision). Wrapper charts live in services/efti/devops. The edelivery image carries no AS4 keystore: its chart
# must mount the per-environment Secret at /app/certs/own.p12 (KEYSTORE_PASSWORD alongside);
# see docs/specs/deploy/resource-and-secrets-requirements.md §3.5.
#
# Required subgroup variables: SERVICECODE, GITOPS_TOKEN, DTRACK_API_KEY.
# Inherited: HARBOR_*, SONAR_*, DTRACK_URL, ARGOCD_KUBERNETES_NONLIVE_*.
#
# GitHub Actions (.github/workflows/e2e.yml) still owns the docker-compose http-tests
# smoke run; this pipeline is the kemitaws platform build + release path.

stages:
  - test
  - build
  - scan
  - package
  - deploy-dev
  - deploy-test
  - deploy-prelive
  - deploy-live

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - when: never

variables:
  SECRET_DETECTION_ENABLED: "true"

include:
  - component: gitlab.kemitaws.ee/platform-internal/ci-components/standard-service-delivery@8.0.1
    inputs:
      service_code: efti
      version_base: "0.1.0"
      architecture: arm64
      sonar_name: efti
      sonar_sources: code/ui,DSL
      # MFN-1 (EFTI-52): Sonar already runs on every pipeline here (test stage) -- this is the whole
      # of MFN-1's scope. Quality-gate enforcement stays off (same `quality_gate: false` posture as
      # ljvis-2's sonar-scan@6.6.0 component calls) until someone with SonarQube access confirms the
      # current violation count; flipping this blind could fail every future pipeline.
      sonar_quality_gate: false
      sonar_architecture: amd64
      sonar_extra_args: >-
        -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/draft/**,**/test/**
      builds:
        - name: ruuter
          image_repository: ruuter/images
          dockerfile: docker/ruuter/Dockerfile
        - name: ruuter-xroad-mock
          image_repository: ruuter-xroad-mock/images
          dockerfile: docker/ruuter-xroad-mock/Dockerfile
        - name: resql
          image_repository: resql/images
          dockerfile: docker/resql/Dockerfile
        - name: liquibase
          image_repository: liquibase/images
          dockerfile: docker/liquibase/Dockerfile
        - name: tim
          image_repository: tim/images
          dockerfile: docker/tim/Dockerfile
        - name: ui
          image_repository: ui/images
          dockerfile: docker/ui/Dockerfile
        - name: edelivery
          image_repository: edelivery/images
          dockerfile: docker/edelivery/Dockerfile
        - name: xml-mapper
          image_repository: xml-mapper/images
          dockerfile: docker/xml-mapper/Dockerfile
        - name: registry
          image_repository: registry/images
          dockerfile: docker/registry/Dockerfile
        # Turvis trust view (ADR-011 amendment): built and scanned from the same revision as `registry`,
        # not yet deployed — nothing consumes it until the Turvis integration (#305/#308) and its
        # `turvis-trust` component in services/efti/devops exist.
        - name: turvis-trust
          image_repository: turvis-trust/images
          dockerfile: docker/turvis-trust/Dockerfile
        # Built and scanned, not yet deployed: the `cronmanager` component needs its wrapper chart
        # in services/efti/devops first (env OPS_AUTHORIZATION + CRONMANAGER_ADMIN_TOKEN from a
        # Secret, no exposed port). See docs/specs/deploy/README.md (CronManager).
        - name: cronmanager
          image_repository: cronmanager/images
          dockerfile: docker/cronmanager/Dockerfile
      components:
        - name: efti-config
        - name: resql
        - name: ruuter
        - name: ruuter-xroad-mock
        - name: tim
        - name: ui
        - name: edelivery
        - name: xml-mapper
        - name: registry
      deploy:
        - environment: dev
          mode: auto
  - template: Security/Secret-Detection.gitlab-ci.yml

# ---------------------------------------------------------------------------- test

secret_detection:
  stage: test
  tags: ["arm64"]

# Sonar cannot parse the Ruuter DSL; this catches a broken flow and the input-contract
# regressions before an image is built (mirrors the GitHub Actions dsl-validate job).
"validate:dsl":
  stage: test
  image: harbor.kemitaws.ee/base-images/devops-aio:1.0.0
  tags: ["arm64"]
  interruptible: true
  # dsl-lint / dsl-test ship inside the runtime image since Ruuter 0.9.14-rc
  # (turnerrainer/Ruuter#83). Keep this tag in step with docker/ruuter/Dockerfile.
  # The runner needs a Docker daemon (same as the image-build components).
  script:
    - set -euo pipefail
    - IMAGE=turnerrainer/ruuter:0.12.1-rc
    - run() { docker run --rm -v "$PWD:/workdir" -w /workdir "$IMAGE" "$@"; }
    - run dsl-lint --audit --dsl DSL/Ruuter            --constants constants.ini
    - run dsl-lint --audit --dsl DSL/Ruuter-xroad-mock --constants constants-xroad-mock.ini
    - run dsl-lint --audit --dsl DSL/Ruuter-turvis-mock --constants constants-turvis-mock.ini
    - run dsl-test --dsl DSL/Ruuter --tests DSL-tests --constants constants.ini
    - run dsl-test --dsl DSL/Ruuter-xroad-mock --tests DSL-mock-tests --constants constants-xroad-mock.ini
    - run dsl-test --dsl DSL/Ruuter-turvis-mock --tests DSL-turvis-mock-tests --constants constants-turvis-mock.ini
    - pip3 install --quiet pyyaml cryptography
    - python3 scripts/validate-dsl.py
    - python3 scripts/validate-no-pii-log.py
    - python3 tests/pii/test_validate_no_pii_log.py
    # registry/**/*.yml is converted to JSON at image build time by the same script, so this
    # validates the registry without building an image (ADR-011: the converter is the validator).
    # The same run builds and validates the Turvis trust view (turvis-trust.json, ADR-011 amendment).
    - python3 scripts/registry-to-json.py
    - python3 tests/registry/test_registry_to_json.py
    # docs/specs/turvis/SPEC.md sections 4/5 vs the Turvis mock DSL and its scenarios: drift fails the job.
    - python3 scripts/validate-turvis-contract.py
    - python3 tests/turvis/test_validate_turvis_contract.py
    # New XML parser / Turvis call / xml-mapper caller without an allowlist entry fails (perimeter trust model, #307).
    - python3 scripts/validate-xml-surface.py
    - python3 tests/xmlsurface/test_validate_xml_surface.py
    - >-
      docker run --rm -v "$PWD:/workdir:ro" -w /workdir python:3.12-slim
      sh -ec 'apt-get update -qq && apt-get install -y -qq libxml2-utils && pip install --quiet pyyaml && python3 tests/mock/dataset.py'
    - python3 tests/sql/regression.py
    - python3 tests/sql/regression.py --init

.frontend:
  stage: test
  image: harbor.kemitaws.ee/dockerhub/library/node:22-alpine
  tags: ["arm64"]
  interruptible: true
  # Temporary onboarding state: these checks report failures but do not gate release yet.
  allow_failure: true
  cache:
    key:
      files: [code/ui/package-lock.json]
    paths: [code/ui/node_modules/]
  before_script:
    - cd code/ui
    - npm ci --prefer-offline --no-audit

"frontend:check":
  extends: .frontend
  script:
    - npm audit --audit-level=high || true
    - npm run check

"frontend:test":
  extends: .frontend
  script:
    - npm run test:coverage
  artifacts:
    when: always
    paths: [code/ui/coverage/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: code/ui/coverage/cobertura-coverage.xml

# Playwright needs glibc (its bundled Chromium doesn't run on musl/alpine), so this uses
# the official Playwright image instead of the shared .frontend node:22-alpine base.
# Temporary onboarding state, same as the rest of .frontend: report failures, don't gate yet.
"frontend:e2e":
  stage: test
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  tags: ["arm64"]
  interruptible: true
  allow_failure: true
  cache:
    key:
      files: [code/ui/package-lock.json]
    paths: [code/ui/node_modules/]
  before_script:
    - cd code/ui
    - npm ci --prefer-offline --no-audit
  script:
    - CI=true npx playwright test
  artifacts:
    when: always
    paths: [code/ui/playwright-report/]
    expire_in: 7 days

# Protected-ref image build already runs the vite build; MR pipelines check it separately.
"frontend:build":
  extends: .frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      when: never
    - when: on_success
  script:
    - npm run build

"backend:test":
  stage: test
  image: harbor.kemitaws.ee/dockerhub/library/eclipse-temurin:25-jdk-alpine
  tags: ["arm64"]
  interruptible: true
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths: [code/.gradle/, code/*/build/]
  script:
    - cd code
    # jacocoTestReport runs automatically after `test` (finalizedBy in build.gradle.kts).
    - ./gradlew test --info
  artifacts:
    when: always
    paths: [code/*/build/reports/jacoco/test/]
    reports:
      junit: code/*/build/test-results/test/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: code/*/build/reports/jacoco/test/jacocoTestReport.xml

# Coverage floor (Epic 18 / docs/cfr/software-quality/test_coverage_and_quality.md: >=80%
# line coverage on business logic). Baseline as of this job's introduction is well under
# that (core has no tests at all; edelivery is under 80%; only xml-mapper clears it) —
# allow_failure: true until each module's baseline is raised,
# then flip this to a blocking part of backend:test.
"backend:coverage-gate":
  stage: test
  image: harbor.kemitaws.ee/dockerhub/library/eclipse-temurin:25-jdk-alpine
  tags: ["arm64"]
  interruptible: true
  allow_failure: true
  needs: ["backend:test"]
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths: [code/.gradle/, code/*/build/]
  script:
    - cd code
    - ./gradlew jacocoTestCoverageVerification --info

"release:pin:dev":
  environment:
    name: dev
    url: https://eftidev.kemitaws.ee
