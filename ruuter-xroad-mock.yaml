port: 8088

# Standalone Ruuter for the PUBLIC developer mock (/developer/**). Same rationale as ruuter.yaml's
# list — an intended status must never be silently swapped for a generic error — but no longer
# identical to it: 501 stays here for the transport-means mock's `scope: allgates` NOT_IMPLEMENTED
# response, while the real route implements allgates (issue #125) and ruuter.yaml dropped 501.
http_codes_allow_list: [200, 201, 202, 204, 400, 401, 403, 404, 409, 422, 500, 501, 502, 504]

dsl:
  # Fallback/label only — Ruuter resolves the project per request from the first URL segment
  # against the directories under /app/DSL (the main gate Ruuter sets `project: efti` yet serves
  # /xroad/, /admin/, …). The DSL directory here is still `developer/`, so the public surface
  # stays /developer/**.
  project: ruuter-xroad-mock

guards:
  enforce_on_methods: [GET, POST, PUT, DELETE]

incoming_requests:
  allowed_method_types: [GET, POST, PUT, DELETE]

internal_requests:
  # This project makes NO outbound calls — every route returns a canned response. Private
  # networks stay blocked; there is nothing on the private network this container should reach.
  block_private_networks: true

stop_in_case_of_exception: true

logging:
  display_request_content: false
  display_response_content: false
