# Readiness probe for the X-Road surface, mirroring DSL/Ruuter/efti/GET/health/ready.yml.
# Public by construction: the project-level xroad/.guard.yml is overridden for xroad/GET/health/
# (see the .guard.yml there), the same way the efti probes stay public. Served on the main Ruuter
# (port 8086) at /xroad/health/ready; kept for the Security Server's own probing.
declaration:
  description: "X-Road readiness probe — returns 200 only if the database is reachable, 503
    otherwise. Public despite living under xroad/ (xroad/GET/health/.guard.yml overrides the
    project guard). No inputs."

check_db:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_db_status"
    headers:
      Content-Type: "application/json"
    body: {}
  result: db_result

check_status:
  switch:
    - condition: ${db_result.response.status == 0 || db_result.response.status >= 300}
      next: unavailable

respond:
  return: "OK"
  status: 200
  wrapper: false
  next: end

unavailable:
  return: "Database unavailable"
  status: 503
  wrapper: false
  next: end
