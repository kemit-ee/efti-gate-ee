declaration:
  description: "X-Road subset-permission discovery (ADR-006). Returns the eFTI subsets the calling
    organisation is permitted to request, resolved from the X-Road-Client memberCode via the
    authority's `registryCode` to its `subsets` in registry/authorities/*.json (the ADR-015 registry
    service). The registry code is taken from the Security-Server-established header only, never
    from the request, so a caller can never ask about another organisation's entitlement. Callers
    answer their own yes/no questions locally from this list — a dataset request may name up to
    seven subsets, and one call covers all of them."
  # Inputs: X-Road-Client (memberCode resolves the calling organisation) and X-Road-Id are
  # validated by xroad/.guard.yml. No body, no query params. No allowlist block — an
  # allowlist.header strips every header not listed, including the ones the guard reads.

# The guard has already validated the header shape and confirmed the memberCode resolves to an
# authority. This handler still re-resolves rather than reading ${authority}: it discloses subset
# entitlements, so it does not depend on another DSL's context for its authorisation decision, and
# the registry service may have been restarted (picking up an edited registry/**) between the two
# lookups. Deliberately NOT factored into an internal loopback DSL either: a route under
# xroad/POST/internal/ would sit outside every guard and be reachable from outside, letting anyone
# enumerate registry codes to harvest authority names and subsets. One extra registry call is
# cheaper than that exposure.
resolve_authority:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/authorities.json"
    headers:
      Content-Type: "application/json"
  result: authority_res
  next: match_authority

match_authority:
  assign:
    # `|| []` rather than a ternary: a bare `: ` inside an unquoted YAML scalar is a mapping
    # separator, so `? :` cannot be written here. An empty array is truthy, so a real match set
    # passes through unchanged.
    authority_matches: ${(Array.isArray(authority_res.response.body) && authority_res.response.body.filter(a => (a.registryCode ?? '') === incoming.headers['x-road-client'].split('/')[2])) || []}
  next: check_authority

# Defence in depth. The guard already rejected an unresolvable and an ambiguous memberCode, but this
# handler discloses subset entitlements, so it re-checks rather than trusting the guard: a match set
# larger than one must never resolve to matches[0], because that would hand one organisation
# another's entitlement. Deny is the fall-through branch and every accept path is an explicit
# positive condition — a non-array body yields [] from match_authority, so it lands on `forbidden`.
check_authority:
  switch:
    # A registry transport failure (status 0) is a gate-side outage, not an authorisation answer —
    # it must not be reported to the caller as "you are not a competent authority". Kept ahead of
    # the != 200 catch-all.
    - condition: ${authority_res.response.status == 0 || authority_res.response.status >= 300}
      next: entitlement_lookup_failed
    - condition: ${authority_res.response.status != 200}
      next: forbidden
    - condition: ${authority_matches.length === 0}
      next: forbidden
    - condition: ${authority_matches.length > 1}
      next: ambiguous
    - condition: ${authority_matches.length === 1}
      next: respond
  next: forbidden

respond:
  return:
    registryCode: ${authority_matches[0]?.registryCode}
    authorityId: ${authority_matches[0]?.id}
    subsets: ${authority_matches[0]?.subsets}
  wrapper: false
  status: 200
  next: end

forbidden:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden","code":"FORBIDDEN","title":"Forbidden","status":403,"detail":"The X-Road client does not resolve to an active competent authority."}')}
  status: 403
  wrapper: false
  next: end

ambiguous:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden","code":"FORBIDDEN","title":"Forbidden","status":403,"detail":"The X-Road client registry code resolves to more than one active competent authority. This is a registry misconfiguration; contact the gate operator."}')}
  status: 403
  wrapper: false

entitlement_lookup_failed:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/bad-gateway","code":"GATEWAY_UNAVAILABLE","title":"Bad Gateway","status":502,"detail":"The subset-entitlement lookup failed. This is a gate-side data-layer failure, not an authorisation decision."}')}
  status: 502
  wrapper: false
  next: end
