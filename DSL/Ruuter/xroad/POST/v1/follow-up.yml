declaration:
  description: "X-Road Authority operation: send a follow-up message to a platform via the gate
    (ADR-006). Forwards to the gate's core REST API. No subset gate: a follow-up carries a message,
    not dataset content, and takes no subset parameter."
  # Inputs (X-Road-Client / X-Road-Id validated by xroad/.guard.yml):
  #   body.uil          object, required — {gateId, platformId, datasetId}
  #   body.referenceIds array,  required — dataset-request ids this follow-up refers to
  #   body.message      string, required — the follow-up text
  #   body.files        array,  optional — {fileName, base64Content, mimeType}
  # No allowed_body — it would make `files` mandatory and strip anything core adds later; a proxy
  # should not strip fields core validates itself. `validate_input` below is the contract.

# A missing/non-object body or a body missing uil / referenceIds / message is a generic 400 before
# the forward; `files` is optional so it is not checked. First step.
validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.uil == null || incoming.body.referenceIds == null || incoming.body.message == null}
      next: bad_request
  next: forward_to_core

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "The request body must be a JSON object with 'uil' (object), 'referenceIds' (array) and 'message' (string)."
  wrapper: false
  status: 400
  next: end

# timeout must exceed core's own 65s edelivery timeout (authority/follow-up.yml send_via_edelivery).
#
# NOTE: core's authority/follow-up.yml writes requestingUserId: "" into follow_up_log, so the
# X-Road caller is not attributed. Pre-existing and equally true of the JWT path; fixing it needs
# the audit story, where forwarding the resolved authority id would be the mechanism. See ADR-006.
forward_to_core:
  call: http.post
  timeout: 70000
  args:
    url: "[#RUUTER_URL]/efti/api/v1/authority/follow-up"
    headers:
      Content-Type: application/json
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
      x-request-id: "${incoming.headers['x-road-id']}"
    body: ${incoming.body}
  result: core_res
  next: check_core_status

# Since Ruuter 0.9.15-rc (issue turnerrainer/Ruuter#89) a connection refusal, DNS failure, TLS
# handshake error or the timeout expiring no longer aborts the run: the http.post binds a stub
# `{status: 0, error: <kind>}` to core_res and falls through here, so the availability-failure
# class reaches core_unavailable's semantic 502 instead of Ruuter's generic 500. Policy pre-flight
# rejections (SSRF, host-allowlist, malformed URL, size cap) still raise.
check_core_status:
  switch:
    - condition: ${core_res.response.status == 0}
      next: core_unavailable
    - condition: ${core_res.response.status >= 400}
      next: core_error
  next: respond

respond:
  return: ${core_res.response.body}
  wrapper: false
  status: ${core_res.response.status}
  next: end

# Normalised to 502 GATEWAY_UNAVAILABLE, matching errors.json exactly; core's real status and body
# are carried in coreStatus / coreResponse. See dataset.yml's core_error for the full rationale.
core_error:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's follow-up request failed. The gate's own status and response are carried in coreStatus and coreResponse."
    coreStatus: ${core_res.response.status}
    coreResponse: ${core_res.response.body}
  wrapper: false
  status: 502
  next: end

# Transport failure reaching core (issue #89): core never produced a status. Distinct from
# core_error so an operator sees "unreachable" rather than "core returned 5xx".
core_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's core follow-up API is unreachable. The transport failure kind is carried in transportError."
    transportError: ${core_res.response.error}
  wrapper: false
  status: 502
  next: end
