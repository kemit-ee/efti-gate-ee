declaration:
  description: "X-Road transport-means lookup (ADR-006). A transport-means identifier comes in — a
    road registration plate, a vessel IMO, an aircraft registration, or a transport-equipment
    (container) id — and the identifier-level data this gate holds against it comes back.
    Mode-neutral by design: one service covers all of them.

    Returns NO dataset content. The caller uses a returned uil with POST /xroad/v1/dataset to fetch
    content, which goes through the subset check. Requires EU02 (means of transport) in
    authorities.subsets, because that is what this data is.

    `scope` grades the request along ONE axis of increasing cost: existence (sub-second boolean,
    local) < local (full local projection, default) < allgates (cross-gate fan-out, async)."
  # No allowed_body, for the same reason as dataset.yml: the field-list form is used once in the
  # whole repo and its filter-vs-require semantics are unproven.

# The project-level xroad/.guard.yml has already validated the X-Road-Client shape, confirmed a
# UUID-shaped X-Road-Id, resolved exactly one ACTIVE authority, and bound the row as ${authority}.
#
# Only proven-in-this-repo constructs: ?. and ?? are used widely. Deliberately no String() or
# .trim() — neither appears anywhere in the DSL, so engine support is unproven. Consequence: the
# identifier is matched VERBATIM (no trimming, and case-sensitively because the columns are
# TEXT/TEXT[] not CITEXT). Stated in openapi.yaml.
#
# No ternary either, though it has precedent at auth/POST/callback.yml:49 — a ternary contains
# ": " which terminates a YAML plain scalar, so it only works quoted.
#
# country_code and scope are QUOTED, so they always reach the next step as strings, never as a JSON
# null. A real JSON null in a ReSql *body* param has no precedent here (all 17 `?? null` uses in the
# repo are in `headers:`), and if Ruuter rendered it as the string "null" every unfiltered lookup
# would silently return found: 0. The SQL treats '' as "any country".
#
# poll is NOT quoted: it is only ever compared with `=== true`, so a JSON boolean must stay a
# boolean. Anything else — "true" the string, 1, an object — fails the strict comparison and the
# request is handled as a fresh lookup, which then demands an identifier. Fail-closed.
setup:
  assign:
    registry_code: ${authority.registryCode}
    identifier: ${incoming.body?.identifier ?? ''}
    country_code: "${incoming.body?.countryCode ?? ''}"
    scope: "${incoming.body?.scope ?? 'local'}"
    poll: ${incoming.body?.poll ?? false}
  next: check_input

# The `.length == null` clauses are a type check built from proven constructs: a string has a numeric
# length, while a number, boolean or object has `undefined`, and `undefined == null` is true. Without
# it a numeric identifier would reach ReSql, be rejected as a param type error, and surface as a
# 502 gateway error — misreporting a caller mistake as a gate fault.
#
# countryCode is checked against the RAW body, not the assigned country_code: the assign quotes the
# value, so by then a number has already become a string and the mistake is invisible.
#
# An unknown scope is rejected rather than silently defaulted: a caller who sends scope: "Local" or
# scope: "existance" is asking for a guarantee we would not be giving them, and on the existence
# path that difference is a border decision.
#
# Known gap: a NON-EMPTY array identifier passes (['ABC'].length === 1) and yields 200 with
# found: 0 / registered: false rather than 400, because distinguishing an array from a string needs
# Array.isArray, unproven in this engine. Every other wrong type — null, empty string, number,
# boolean, object, empty array — is rejected.
check_input:
  switch:
    # scope and countryCode are validated for polls too — the poll bypass below only waives the
    # identifier requirement. A poll echoes these fields back, and echoing a value the non-poll
    # path rejects would put an out-of-enum scope in a published response field.
    - condition: ${scope != 'existence' && scope != 'local' && scope != 'allgates'}
      next: bad_request_scope
    - condition: ${incoming.body?.countryCode != null && incoming.body.countryCode.length == null}
      next: bad_request_country
    # A poll ({poll: true} with the same X-Road-Id as the original allgates call) carries no
    # identifier, so it skips the identifier check — but NOT the EU02 entitlement below: the
    # pending multiplexer queue has no ownership check (ADR-006), so at minimum the poller must
    # itself be entitled to EU02-class data.
    - condition: ${poll === true}
      next: check_subset_permission
    - condition: ${identifier == null || identifier.length == null || identifier.length == 0}
      next: bad_request_identifier
  next: check_subset_permission

# EU02 is "means of transport (vehicle plate, container number)" per Delegated Reg 2024/2024, so
# this response IS EU02-class data by definition — for every scope, including the bare boolean.
# Reuses the containment SQL the dataset route uses; no new entitlement query.
check_subset_permission:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_authority_subsets"
    headers:
      Content-Type: application/json
      x-request-id: "${incoming.headers['x-road-id']}"
    body:
      registry_code: "${registry_code}"
      requested_subsets: ["EU02"]
  result: subset_res
  next: evaluate_permission

# Same fail-closed shape as dataset.yml: deny is the fall-through, every accept path is an explicit
# positive condition, and no accept path derefs body[0] without having proven it exists and is
# non-null. A non-array ReSql body makes every length comparison false and lands on `forbidden`.
evaluate_permission:
  switch:
    - condition: ${subset_res.response.status === 400}
      next: bad_request_identifier
    - condition: ${subset_res.response.status != 200}
      next: entitlement_lookup_failed
    - condition: ${subset_res.response.body == null || subset_res.response.body.length == 0}
      next: forbidden
    - condition: ${subset_res.response.body.length > 1 && subset_res.response.body[0] != null && subset_res.response.body[0].authorityId != null}
      next: ambiguous
    - condition: ${subset_res.response.body.length === 1 && subset_res.response.body[0] != null && subset_res.response.body[0].allowed == true}
      next: route_by_scope
    - condition: ${subset_res.response.body.length === 1 && subset_res.response.body[0] != null && subset_res.response.body[0].allowed == false}
      next: forbidden_subset
  next: forbidden

# scope was already validated in check_input, so the fall-through here is unreachable in practice.
# It still routes to the local projection rather than to an error: `local` is the documented default,
# so if a future edit adds an enum value and forgets a branch, the safe landing is the narrower
# local answer, not a 500 and not a cross-gate fan-out.
route_by_scope:
  switch:
    - condition: ${poll === true}
      next: poll_core
    - condition: ${scope == 'existence'}
      next: lookup_existence
    - condition: ${scope == 'allgates'}
      next: route_allgates
  next: lookup_local

# Sub-second path: a boolean, no consignment data. The SQL wraps the same latest-row-correct query
# the projection uses, so a soft-deleted or re-plated consignment cannot answer `registered: true`.
lookup_existence:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_transport_means_registered"
    headers:
      Content-Type: application/json
      x-request-id: "${incoming.headers['x-road-id']}"
    body:
      transport_means_id: "${identifier}"
      country_code: "${country_code}"
  result: existence_res
  next: check_existence

# Error is the fall-through. The accept requires exactly one row carrying a non-null `registered`,
# which a string, object, number or null body all fail — the same discipline as check_lookup below.
check_existence:
  switch:
    - condition: ${existence_res.response.status != 200}
      next: existence_lookup_failed
    - condition: ${existence_res.response.body != null && existence_res.response.body.length === 1 && existence_res.response.body[0] != null && existence_res.response.body[0].registered != null}
      next: respond_existence
  next: existence_lookup_failed

respond_existence:
  return:
    identifier: ${identifier}
    countryCode: ${country_code}
    scope: ${scope}
    registered: ${existence_res.response.body[0].registered}
  wrapper: false
  status: 200
  next: end

# Single local ReSql call — no timeout override needed, nowhere near core's 65s paths. The SQL
# deliberately returns no `xml`; see the header comment in get_consignments_by_transport_means.sql.
lookup_local:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments_by_transport_means"
    headers:
      Content-Type: application/json
      x-request-id: "${incoming.headers['x-road-id']}"
    body:
      transport_means_id: "${identifier}"
      country_code: "${country_code}"
  result: local_res
  next: check_lookup

# Error is the fall-through here too: a non-array body must never be emitted as `consignments`.
# An empty array IS a legitimate 200 answer, so it is an explicit accept rather than a fall-through.
#
# Distinguishing an array from a string needs care without Array.isArray (unproven in this engine):
# `body.length >= 0` is true for a string as well, so a 200 carrying "oops" would be emitted as
# four consignments. Instead, accept either an empty result, or a non-empty one whose first element
# carries `uil` — a field get_consignments_by_transport_means always builds. Only proven constructs
# (.length, indexing, property access), and a string, object, number or null all fail both.
check_lookup:
  switch:
    - condition: ${local_res.response.status != 200}
      next: local_lookup_failed
    - condition: ${local_res.response.body != null && local_res.response.body.length == 0}
      next: respond_local
    - condition: ${local_res.response.body != null && local_res.response.body.length > 0 && local_res.response.body[0] != null && local_res.response.body[0].uil != null}
      next: respond_local
  next: local_lookup_failed

# "We do not know this transport means" is a successful answer to the question asked, so an empty
# result is 200 with found: 0 — not 404.
respond_local:
  return:
    identifier: ${identifier}
    countryCode: ${country_code}
    scope: ${scope}
    found: ${local_res.response.body.length}
    consignments: ${local_res.response.body}
  wrapper: false
  status: 200
  next: end

# --- scope: allgates (issue #125, ADR-007 variant A) --------------------------------------------
#
# Forwards to core authority/search, which is LOCAL-FIRST and NON-BLOCKING: a local hit answers
# immediately (x-poll-more: false); a local miss registers the broadcast with the multiplexer and
# answers [] with x-poll-more: true at once — the neighbour gates' results are collected via
# polling. Either way the result is normalised by xml-mapper to the same curated projection
# scope: local returns, so the response shape is identical across scopes (ADR-007). Polling:
# repeat the call with the same X-Road-Id and body {poll: true} while x-poll-more is true;
# repeating identifier/countryCode/scope in the poll body is optional and only affects the echo
# fields of the response.
#
# The criterion is transportMeansOrEquipmentId — the same three-way OR (main transport OR used OR
# carried equipment) the local SQL applies. Known limitation: FTI019 has no OR criterion, so for the
# cross-gate XML the xml-mapper degrades it to MainCarriageTransportMeansIDParameterScope —
# equipment ids match locally but not on remote gates.
#
# Two forward steps rather than one: a conditional body field needs a ternary, which is unproven
# here (see the header comment), so the country filter gets its own step.
route_allgates:
  switch:
    - condition: ${country_code != ''}
      next: forward_to_core_search_with_country
  next: forward_to_core_search

# X-Road-Id becomes x-request-id — load-bearing, not tidy: core keys the multiplexer polling on it.
# Core's first call returns the local slice immediately and never blocks on peer gates (the
# broadcast is registered in the background), so 15s is generous — same as xroad/POST/v1/search.yml.
forward_to_core_search:
  call: http.post
  timeout: 15000
  args:
    url: "[#RUUTER_URL]/efti/api/v1/authority/search"
    headers:
      Content-Type: application/json
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
      x-request-id: "${incoming.headers['x-road-id']}"
    body:
      transportMeansOrEquipmentId:
        operator: "EQ"
        id: "${identifier}"
      # The local slice must apply the same ACTIVE allowlist as the curated projection — without it,
      # allgates would disclose INACTIVE consignments that local and existence deliberately hide.
      # The xml-mapper drops this key from the broadcast XML (FTI019 has no status criterion), so
      # remote gates are unaffected.
      status:
        operator: "EQ"
        status: "ACTIVE"
  result: core_res
  next: check_core_search_status

forward_to_core_search_with_country:
  call: http.post
  timeout: 15000
  args:
    url: "[#RUUTER_URL]/efti/api/v1/authority/search"
    headers:
      Content-Type: application/json
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
      x-request-id: "${incoming.headers['x-road-id']}"
    body:
      transportMeansOrEquipmentId:
        operator: "EQ"
        id: "${identifier}"
      transportRegCountry:
        operator: "EQ"
        country: "${country_code}"
      status:
        operator: "EQ"
        status: "ACTIVE"
  result: core_res
  next: check_core_search_status

# The x-poll header is what makes core poll the multiplexer instead of searching. The criteria body
# is sent anyway: core's poll branch ignores it, and if the header were ever lost the failure mode
# is a fresh criteria-bound search (on a bare poll the identifier is '', which matches nothing) —
# not a criteria-less search that would match everything. The timeout ladder: the multiplexer's
# GET /rest long-polls up to MULTIPLEXER_REST_POLL_SECONDS (default 30) for the first gate
# response, core's poll_remaining allows 35s for that, and this step sits above both — a shorter
# timeout would turn a healthy long-poll into a spurious 502.
poll_core:
  call: http.post
  timeout: 40000
  args:
    url: "[#RUUTER_URL]/efti/api/v1/authority/search"
    headers:
      Content-Type: application/json
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
      x-request-id: "${incoming.headers['x-road-id']}"
      x-poll: "true"
    body:
      transportMeansOrEquipmentId:
        operator: "EQ"
        id: "${identifier}"
      status:
        operator: "EQ"
        status: "ACTIVE"
  result: core_res
  next: check_core_search_status

# Since Ruuter 0.9.15-rc (issue turnerrainer/Ruuter#89) a connection refusal, DNS failure, TLS
# handshake error or the timeout expiring binds a stub {status: 0, error: <kind>} instead of
# aborting the run, so the availability-failure class reaches core_search_unavailable's semantic
# 502 — same pattern as xroad/POST/v1/search.yml's check_core_status.
check_core_search_status:
  switch:
    - condition: ${core_res.response.status == 0}
      next: core_search_unavailable
    - condition: ${core_res.response.status >= 400}
      next: core_search_failed
  next: normalize_results

# Core does not answer in one shape: a local hit is raw get_consignments rows, broadcast/poll
# results are xml-mapper ConsignmentRows. The normalizer accepts both and emits the same curated
# projection as get_consignments_by_transport_means.sql — no xml blob, uil nested — which is what
# keeps the local <-> allgates shape promise (ADR-007 variant A).
normalize_results:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/transport-means/normalize"
    headers:
      Content-Type: application/json
      x-request-id: "${incoming.headers['x-road-id']}"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${core_res.response.body}
  result: norm_res
  next: check_normalize

# Same array discipline as check_lookup: error is the fall-through, an empty array is an explicit
# accept, and a non-empty body must prove itself an array of projections via body[0].uil.
check_normalize:
  switch:
    - condition: ${norm_res.response.status != 200}
      next: normalize_failed
    - condition: ${norm_res.response.body != null && norm_res.response.body.length == 0}
      next: respond_allgates
    - condition: ${norm_res.response.body != null && norm_res.response.body.length > 0 && norm_res.response.body[0] != null && norm_res.response.body[0].uil != null}
      next: respond_allgates
  next: normalize_failed

# Same contract fields as respond_local, plus x-poll-more so the caller knows whether gates are
# still answering. scope is a LITERAL, not the echo: every response through this step is a
# cross-gate result — on the fresh path ${scope} is 'allgates' anyway, and on a poll the body's
# scope (defaulted 'local' when omitted) describes the poll request, not the result. Labelling a
# poll result 'local' or 'existence' would put a lie in a published enum field.
# identifier/countryCode still echo the poll body — found and consignments are the meaningful
# fields there.
respond_allgates:
  return:
    identifier: ${identifier}
    countryCode: ${country_code}
    scope: "allgates"
    found: ${norm_res.response.body.length}
    consignments: ${norm_res.response.body}
  headers:
    x-poll-more: ${core_res.response.headers['x-poll-more'] ?? 'false'}
  wrapper: false
  status: 200
  next: end

bad_request_identifier:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "identifier is required and must be a non-empty string."
  wrapper: false
  status: 400
  next: end

bad_request_country:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "countryCode, if given, must be a string."
  wrapper: false
  status: 400
  next: end

bad_request_scope:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "scope must be one of 'existence', 'local' or 'allgates'. Omit it for 'local'."
  wrapper: false
  status: 400
  next: end

# The denied/permitted sets are RFC 7807 extension members rather than interpolated into the detail
# prose — every value is then a whole-value interpolation, and a machine caller can branch on the
# arrays directly. Same shape as dataset.yml.
forbidden_subset:
  return:
    type: "https://api.efti.ee/errors/forbidden-subset"
    code: "FORBIDDEN_SUBSET"
    title: "Subset Access Denied"
    status: 403
    detail: "A transport-means lookup returns means-of-transport data (EU02), which this authority is not permitted to access."
    authorityId: ${subset_res.response.body[0].authorityId}
    deniedSubsets: ${subset_res.response.body[0].deniedSubsets}
    permittedSubsets: ${subset_res.response.body[0].subsets}
  wrapper: false
  status: 403
  next: end

# Residual denial: the entitlement lookup returned no row, or a row whose `allowed` was neither true
# nor false. Transport failures go to entitlement_lookup_failed, so this detail is accurate.
forbidden:
  return:
    type: "https://api.efti.ee/errors/forbidden"
    code: "FORBIDDEN"
    title: "Forbidden"
    status: 403
    detail: "The X-Road client does not resolve to an active competent authority."
  wrapper: false
  status: 403
  next: end

ambiguous:
  return:
    type: "https://api.efti.ee/errors/forbidden"
    code: "FORBIDDEN"
    title: "Forbidden"
    status: 403
    detail: "The X-Road client registry code resolves to more than one active competent authority. This is a registry misconfiguration; contact the gate operator."
  wrapper: false
  status: 403
  next: end

# Distinct failure steps rather than one shared: this route makes up to three upstream calls on any
# given request, and a shared step could not tell an operator which one failed. openapi's
# XRoadBadGateway documents `failedStep` for exactly this.
entitlement_lookup_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The subset-entitlement lookup failed in the gate's data layer. This is not an authorisation decision."
    failedStep: "check_authority_subsets"
    resqlStatus: ${subset_res.response.status}
  wrapper: false
  status: 502
  next: end

existence_lookup_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The transport-means existence check failed in the gate's data layer. This is not an authorisation decision."
    failedStep: "check_transport_means_registered"
    resqlStatus: ${existence_res.response.status}
  wrapper: false
  status: 502
  next: end

local_lookup_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The transport-means lookup failed in the gate's data layer. This is not an authorisation decision."
    failedStep: "get_consignments_by_transport_means"
    resqlStatus: ${local_res.response.status}
  wrapper: false
  status: 502
  next: end

# Normalised to 502 GATEWAY_UNAVAILABLE like search.yml's core_error: errors.json binds each code to
# exactly one status and RFC 7807 requires body status to match HTTP status, so core's real status
# and body travel in coreStatus / coreResponse instead.
core_search_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's cross-gate consignment search failed. The gate's own status and response are carried in coreStatus and coreResponse."
    failedStep: "authority-search"
    coreStatus: ${core_res.response.status}
    coreResponse: ${core_res.response.body}
  wrapper: false
  status: 502
  next: end

# Transport failure reaching core (issue #89): core never produced a status. Distinct from
# core_search_failed so an operator sees "unreachable" rather than "core returned 5xx".
core_search_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's core consignment search is unreachable. The transport failure kind is carried in transportError."
    failedStep: "authority-search"
    transportError: ${core_res.response.error}
  wrapper: false
  status: 502
  next: end

# Known limitation: on a POLL this failure loses data — the multiplexer's GET /rest is a drain, so
# by the time normalisation runs the peer responses are already out of the 90s buffer, and retrying
# the poll returns empty. Accepted for now: the normaliser is a local, stateless service whose
# failure modes are deploy-time (down, incompatible), not per-request; a fallback that returned
# core's un-normalised body would break the one-shape contract this route exists to keep.
normalize_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Normalising the cross-gate search results failed in the gate's mapping layer. This is not an authorisation decision. If this was a poll, the drained results are lost — the caller must re-issue the original search."
    failedStep: "transport-means-normalize"
    mapperStatus: ${norm_res.response.status}
  wrapper: false
  status: 502
  next: end
