declaration:
  description: "Echo endpoint for X-Road connectivity testing. The guard has already validated the
    caller against the authorities registry and exposed the row as ${authority}; this handler just
    echoes it back with the X-Road headers and the request body."

respond:
  return:
    xRoadClient: "${incoming.headers['x-road-client']}"
    xRoadId: "${incoming.headers['x-road-id']}"
    xRoadUserId: "${incoming.headers['x-road-userid']}"
    authority: ${authority}
    echo: ${incoming.body}
  wrapper: false
  status: 200
  next: end
