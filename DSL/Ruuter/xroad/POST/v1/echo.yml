declaration:
  description: "Echo endpoint for X-Road connectivity testing. The guard has already validated the
    caller against the authorities registry and exposed the row as ${authority}; this handler just
    echoes it back with the X-Road headers and the request body."
  # Inputs: X-Road-Client / X-Road-Id are validated by xroad/.guard.yml (declared there).
  # The body is a free-form JSON object reflected verbatim in `echo` — no field contract, so no
  # allowlist.body (which would make listed fields mandatory and strip the rest); validate_input
  # only rejects a missing/empty body.
  allowlist:
    header:
      - field: x-road-client
        type: string
        description: "instance/memberClass/memberCode[/subsystemCode] — set by the Security Server"
      - field: x-road-id
        type: string
        description: "X-Road message id; echoed back"
      - field: x-road-userid
        type: string
        description: "caller-asserted user id; echoed back, never trusted for access"

validate_input:
  switch:
    - condition: ${incoming.body == null}
      next: bad_request
  next: respond

respond:
  return:
    xRoadClient: "${incoming.headers['x-road-client']}"
    xRoadId: "${incoming.headers['x-road-id']}"
    xRoadUserId: "${incoming.headers['x-road-userid']}"
    authority: ${authority}
    echo: ${incoming.body}
  wrapper: false
  status: 200
  next: end

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A JSON request body is required."
  wrapper: false
  status: 400
  next: end
