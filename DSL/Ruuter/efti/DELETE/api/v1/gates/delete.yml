delete_gate:
  call: http.post
  args:
    url: "http://resql:8090/efti/soft_delete_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.gateId}"
  result: delete_result
  next: check_delete

check_delete:
  switch:
    - condition: ${delete_result.response.body == null || delete_result.response.body.length == 0}
      next: delete_failed
  next: verify_gate

verify_gate:
  call: http.post
  args:
    url: "http://resql:8090/efti/get_gate_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.gateId}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: not_found
    - condition: ${verify_result.response.body[0].isGateActive != false}
      next: verify_failed
  next: respond

respond:
  return: ""
  status: 204
  next: end

delete_failed:
  return: '{"error": "Failed to delete gate"}'
  status: 500
  next: end

not_found:
  return: '{"error": "Not Found"}'
  status: 404
  next: end

verify_failed:
  return: '{"error": "Gate deletion could not be verified"}'
  status: 500
  next: end
