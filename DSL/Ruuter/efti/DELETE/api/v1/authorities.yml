delete_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: delete_result
  next: check_delete

check_delete:
  switch:
    - condition: ${delete_result.response.body == null || delete_result.response.body.length == 0}
      next: delete_failed
  next: verify_authority

verify_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: not_found
    - condition: ${verify_result.response.body[0].status != 'DELETED'}
      next: verify_failed
  next: respond

respond:
  return: ""
  status: 204
  next: end

delete_failed:
  return: '{"error": "Failed to delete authority"}'
  status: 500
  next: end

not_found:
  return: '{"error": "Not Found"}'
  status: 404
  next: end

verify_failed:
  return: '{"error": "Authority deletion could not be verified"}'
  status: 500
  next: end
