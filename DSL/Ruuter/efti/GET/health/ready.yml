declaration:
  description: "Readiness probe — returns 200 only if the database is reachable, 503 otherwise.
    No inputs."

check_db:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_db_status"
    headers:
      Content-Type: "application/json"
    body: {}
  result: db_result

check_status:
  switch:
    - condition: ${db_result.response.status == 0 || db_result.response.status >= 300}
      next: unavailable

respond:
  return: "OK"
  status: 200
  wrapper: false
  next: end

unavailable:
  return: "Database unavailable"
  status: 503
  wrapper: false
  next: end
