search_consignments:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments_by_identifier"
    headers:
      Content-Type: "application/json"
    body:
      identifier: "${incoming.params.identifier}"
      limit: "${incoming.params.limit}"
      offset: "${incoming.params.offset}"
  result: search_result
  next: respond

respond:
  return: ${search_result.response.body}
  wrapper: false
  next: end
