get_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_xml"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: "${incoming.params.datasetId}"
      platformId: "${incoming.params.platformId}"
      gateId: ""
  result: consignment_result
  next: check_found

check_found:
  switch:
    - condition: ${consignment_result.response.body == null || consignment_result.response.body.length == 0}
      next: not_found
  next: respond

respond:
  return: ${consignment_result.response.body[0].xml}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  next: end

not_found:
  return: '{"error": "Not Found"}'
  status: 404
  next: end
