declaration:
  call: declare
  version: "0.1"
  description: "Current user profile. Open to any authenticated caller, scoped to their own row — docs/specs/permissions-matrix.md:163, openapi.yaml operation getCurrentUser."
  method: get
  namespace: service
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"

# The guard has already proven the caller is authenticated. Resolving again here is how we
# get the caller's row — a guard returns only pass/fail, not data.
get_user_context:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-user-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
    body: {}
  result: auth_user
  next: check_user_context

check_user_context:
  switch:
    - condition: ${auth_user.response.body !== "false"}
      next: return_user
  next: token_invalid

return_user:
  return: ${auth_user.response.body}
  wrapper: false
  next: end

token_invalid:
  status: 401
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/token-invalid","code":"TOKEN_INVALID","title":"Invalid Token","status":401,"detail":"The presented token is expired, revoked, or does not resolve to an active gate user.","instance":"/api/v1/user"}')}
  wrapper: false
  next: end
