declaration:
  description: "Authority requests a dataset from a Platform via the gate"

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}

params:
  assign:
    gateId: ${incoming.params.pathParams[0]}
    platformId: ${incoming.params.pathParams[1]}
    datasetId: ${incoming.params.pathParams[2]}
    subsets: ${incoming.params.subsets}

uil:
  assign:
    request_json:
      uil:
        gateId: ${gateId}
        platformId: ${platformId}
        datasetId: ${datasetId}
      subsets: ${subsets?.split(',') ?? []}

check_gate:
  switch:
    - condition: ${gateId != '[#OWN_GATE_ID]'}
      next: request_to_xml

call_local_platform:
  template: api/v1/dataset-local
  request_type: "POST"
  # Ruuter #72 (h2ck.me H1, 0.9.11-rc): template: now runs the callee's guard against the
  # CHILD context — nothing is inherited from incoming.headers automatically. This route is
  # itself under efti/GET/api/v1/authority/.guard.yml (same X-Internal-Service-Token
  # credential as dataset-local's own efti/POST/api/v1/.guard.yml), so forward it.
  headers:
    x-request-id: ${requestId}
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body: ${request_json}
  result: dataset_response
  next: check_local_result

check_local_result:
  switch:
    - condition: ${dataset_response == null || dataset_response.xml == null}
      next: local_platform_error
  next: convert_response_to_json

local_platform_error:
  return: ${dataset_response}
  wrapper: false
  status: 404
  next: end

request_to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
    body: ${request_json}
  result: request_xml

check_request_xml:
  switch:
    - condition: ${request_xml.response.status == 0}
      next: mapper_unavailable

send_via_edelivery:
  call: http.post
  timeout: 65000
  args:
    url: "[#EDELIVERY_URL]/api/v1/send/${gateId}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
    body: ${request_xml.response.body}
    content_type: plaintext
  result: edelivery_response

check_edelivery_response:
  switch:
    # Transport failure reaching the peer gate over eDelivery (issue #89, status 0): edelivery_error
    # echoes edelivery_response.response.status as the HTTP status, which would emit a broken
    # `status: 0`. Route the availability-failure class to a real 502.
    - condition: ${edelivery_response.response.status == 0}
      next: remote_gate_unavailable
    - condition: ${edelivery_response.response.status != 200}
      next: edelivery_error

assign_dataset_from_edelivery:
  assign:
    dataset_response:
      xml: ${edelivery_response.response.body}
  next: convert_response_to_json

edelivery_error:
  return:
    error: "Remote gate dataset request failed"
    detail: ${edelivery_response.response.body}
  wrapper: false
  status: ${edelivery_response.response.status}
  next: end

convert_response_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-json"
    headers:
      x-request-id: ${requestId}
      content-type: "text/xml"
    body: ${dataset_response.xml}
    content_type: plaintext
  result: dataset_json

check_dataset_json:
  switch:
    - condition: ${dataset_json.response.status == 0}
      next: mapper_unavailable

respond:
  return: ${dataset_json.response.body}
  wrapper: false
  next: end

mapper_unavailable:
  return:
    error: "XML mapper unavailable"
  wrapper: false
  status: 502
  next: end

remote_gate_unavailable:
  return:
    error: "The remote gate is unreachable"
    transportError: ${edelivery_response.response.error}
  wrapper: false
  status: 502
  next: end
