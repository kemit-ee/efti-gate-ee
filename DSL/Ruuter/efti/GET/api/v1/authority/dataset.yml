declaration:
  description: "Authority requests a dataset from a Platform via the gate"

assign:
  assign:
    gateId: ${incoming.params.pathParams[0]}
    platformId: ${incoming.params.pathParams[1]}
    datasetId: ${incoming.params.pathParams[2]}
    subsets: ${incoming.params.subsets}

check_gate:
  switch:
    - condition: ${gateId != '[#OWN_GATE_ID]'}
      next: forward_to_remote_gate

call_local_platform:
  template: api/v1/dataset-local
  request_type: "POST"
  body:
    uil:
      gateId: ${gateId}
      platformId: ${platformId}
      datasetId: ${datasetId}
    subsets: ${subsets?.split(',') ?? []}
  result: dataset_response

convert_response_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-json"
    headers:
      Content-Type: "text/xml"
    body: ${dataset_response.xml}
    content_type: plaintext
  result: dataset_json

respond:
  return: ${dataset_json.response.body}
  wrapper: false
