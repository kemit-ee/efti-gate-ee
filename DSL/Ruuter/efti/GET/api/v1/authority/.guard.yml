# Authority-facing dataset request via GET (Authority API, matrix §3.2). Restricted to
# authenticated users. Competent authorities proper authenticate as organisations over X-Road,
# not via this JWT surface. Mirrors efti/POST/api/v1/authority/.guard.yml.
#
# Deliberately does NOT accept the X-Internal-Service-Token branch that the POST sibling has: the
# X-Road adapter forwards only POST, so the token gets no more reach than it needs. If a future
# internal caller needs a GET authority route, add the branch here explicitly rather than assuming
# the asymmetry is an oversight.
validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
      x-forwarded-for: ${incoming.headers['x-forwarded-for'] ?? null}
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body: {}
  result: auth_result

check_result:
  switch:
    - condition: ${auth_result.response.status == 200}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
