# Authority-facing dataset request via GET (Authority API, matrix §3.2). efti/api/v1/* is
# gate-internal only - the sole credential is X-Internal-Service-Token, same posture as
# efti/POST/api/v1/authority/.guard.yml. There is no JWT / gate-operator path here.
#
# override_ancestors: true - this check is identical to efti/GET/api/v1/.guard.yml, so
# replace the ancestor chain rather than run the same X-Internal-Service-Token switch
# twice per request (perf: analysis §4j).

declaration:
  override_ancestors: true
  description: "efti/GET/api/v1/authority guard - gate-internal. Credential:
    X-Internal-Service-Token (required), must equal INTERNAL_SERVICE_TOKEN.
    Replaces the identical ancestor check (efti/GET/api/v1/.guard.yml)."

check_service_token:
  switch:
    - condition: ${incoming.headers != null && incoming.headers['x-internal-service-token'] != null && incoming.headers['x-internal-service-token'] != '' && incoming.headers['x-internal-service-token'] == '[#INTERNAL_SERVICE_TOKEN]'}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  detach:
    do:
      - call: http.post
        args:
          url: "[#RESQL_URL]/efti/insert_audit_log"
          headers:
            Authorization: "Bearer [#RESQL_TOKEN]"
            Content-Type: "application/json"
          body:
            action: "efti-internal.auth_denied"
            resource: "efti-internal-authority"
            ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
            details: "${JSON.stringify({ reason: 'missing or invalid X-Internal-Service-Token' })}"
  next: guard_fail_respond

guard_fail_respond:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    code: "UNAUTHORIZED"
    title: "Unauthorized"
    status: 401
    detail: "This endpoint requires a valid X-Internal-Service-Token."
  status: 401
  headers:
    Content-Type: "application/problem+json"
  wrapper: false
  next: end
