# Authority-facing dataset request via GET (Authority API, matrix §3.2). Restricted to gate
# operators: requires a TARA JWT resolving to a users row with is_admin. Competent authorities
# proper authenticate as organisations over X-Road, not via this JWT surface. Mirrors
# efti/POST/api/v1/authority/.guard.yml.
validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
      x-forwarded-for: ${incoming.headers['x-forwarded-for'] ?? null}
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body: {}
  result: auth_result
  next: check_result

check_result:
  switch:
    - condition: ${auth_result.response.status == 200}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
  next: end
