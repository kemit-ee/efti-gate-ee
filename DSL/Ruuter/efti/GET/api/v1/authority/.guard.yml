# Authority-facing dataset request via GET (Authority API, matrix §3.2). Requires a
# TARA JWT resolving to a users row with the ADMIN or AUTHORITY role.
#
# Deliberately does NOT accept the X-Internal-Service-Token branch that the POST sibling has: the
# X-Road adapter forwards only POST, so the token gets no more reach than it needs. If a future
# internal caller needs a GET authority route, add the branch here explicitly rather than assuming
# the asymmetry is an oversight.
validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-user-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
      x-viljus-knows-a-secret: "[#INTERNAL_SECRET]"
      x-forwarded-for: ${incoming.headers['x-forwarded-for'] ?? null}
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body: {}
  result: auth_result
  next: check_result

check_result:
  switch:
    - condition: ${auth_result.response.status != 200}
      next: guard_fail
    - condition: ${auth_result.response.body.isAdmin == true || auth_result.response.body.isAuthority == true}
      next: guard_success
  next: guard_fail_forbidden

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
  next: end

guard_fail_forbidden:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden","title":"Forbidden","status":403,"detail":"This action requires the ADMIN or AUTHORITY role."}')}
  status: 403
  wrapper: false
  next: end
