route:
  switch:
    - condition: ${incoming.params.userId != null}
      next: fetch_single
  next: fetch_list

fetch_single:
  call: http.post
  args:
    url: "http://resql:8090/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.userId}"
  result: single_result
  next: check_single

check_single:
  switch:
    - condition: ${single_result.response.body == null || single_result.response.body.length == 0}
      next: not_found
  next: respond_single

respond_single:
  return: ${single_result.response.body}
  next: end

fetch_list:
  call: http.post
  args:
    url: "http://resql:8090/efti/get_users"
    headers:
      Content-Type: "application/json"
    body:
      limit: "${incoming.params.limit}"
      offset: "${incoming.params.offset}"
      gateId: "${incoming.params.gateId}"
      authorityId: "${incoming.params.authorityId}"
  result: list_result
  next: respond_list

respond_list:
  return: ${list_result.response.body}
  next: end

not_found:
  return: '{"error": "Not Found"}'
  status: 404
  next: end
