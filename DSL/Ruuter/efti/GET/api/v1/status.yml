get_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_by_id"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: "${incoming.params.pathParams[0]}"
  result: consignment_result

check_found:
  switch:
    - condition: ${!consignment_result.response.body.length}
      next: not_found


respond:
  return: ${consignment_result.response.body}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
