declaration:
  description: "Check whether a consignment dataset is registered at this gate and its current
    status (gate-internal, X-Internal-Service-Token). Path: datasetId. No query params, no body."

get_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_by_id"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: "${incoming.params.pathParams[0]}"
  result: consignment_result

check_found:
  switch:
    # Transport failure reaching ReSql (issue #89, status 0) — a non-array stub body would otherwise
    # make !body.length true and report a data-layer outage as 404 Not Found.
    - condition: ${consignment_result.response.status == 0}
      next: data_unavailable
    - condition: ${!consignment_result.response.body.length}
      next: not_found


respond:
  return: ${consignment_result.response.body}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end

data_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
