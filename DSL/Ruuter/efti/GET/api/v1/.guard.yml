# Any authenticated user. Validates JWT via TIM + DB lookup. Returns 401 if not authenticated.
# The GET/api/v1/test/ subdirectory has its own public .guard that overrides this one.
guard_success:
  return: "success"
  status: 200
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  next: end
