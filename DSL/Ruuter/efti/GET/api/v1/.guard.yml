# efti/api/v1/* is gate-internal only - no TIM/JWT path. The sole credential is
# X-Internal-Service-Token. test/ overrides this to stay public (diagnostic endpoints);
# authority/ has its own copy of this same check for clarity and future divergence.

declaration:
  description: "efti/GET/api/v1 guard - gate-internal. Credential: X-Internal-Service-Token
    (required), must equal INTERNAL_SERVICE_TOKEN. test/ overrides this to public."

check_service_token:
  switch:
    - condition: ${incoming.headers != null && incoming.headers['x-internal-service-token'] != null && incoming.headers['x-internal-service-token'] != '' && incoming.headers['x-internal-service-token'] == '[#INTERNAL_SERVICE_TOKEN]'}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  detach:
    do:
      - call: http.post
        args:
          url: "[#RESQL_URL]/efti/insert_audit_log"
          headers:
            Content-Type: "application/json"
          body:
            action: "efti-internal.auth_denied"
            resource: "efti-internal"
            ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
            details: "${JSON.stringify({ reason: 'missing or invalid X-Internal-Service-Token' })}"
  next: guard_fail_respond

guard_fail_respond:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    code: "UNAUTHORIZED"
    title: "Unauthorized"
    status: 401
    detail: "This endpoint requires a valid X-Internal-Service-Token."
  status: 401
  headers:
    Content-Type: "application/problem+json"
  wrapper: false
  next: end
