consignments:
  call: http.post
  args:
    url: "http://resql:8090/efti/get_consignments"
    headers:
      Content-Type: "application/json"
    body:
      criteria:
      limit: "${incoming.params.limit}"
      offset: "${incoming.params.offset}"
  result: search_result
  next: respond

respond:
  return: ${search_result.response.body}
  wrapper: false
  next: end
