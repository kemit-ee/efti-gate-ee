declaration:
  description: "Public health diagnostic — returns the database status. No inputs (see the
    efti/GET/api/v1/test/.guard.yml override that keeps this endpoint public)."

check_db:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_db_status"
    headers:
      Content-Type: "application/json"
    body: {}
  result: db_status

check_status:
  switch:
    - condition: ${db_status.response.status == 0 || db_status.response.status >= 300}
      next: unavailable

respond:
  return: ${db_status.response.body}
  wrapper: false
  next: end

unavailable:
  return: {"error": "Database unavailable"}
  status: 503
  wrapper: false
  next: end
