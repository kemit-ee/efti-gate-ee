fetch_audit_log:
  call: http.post
  args:
    url: "http://resql:8090/efti/get_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      resource: "${incoming.params.resource}"
      resourceId: "${incoming.params.resourceId}"
      userId: "${incoming.params.userId}"
      from: "${incoming.params.from}"
      to: "${incoming.params.to}"
      limit: "${incoming.params.limit ?: 20}"
      offset: "${incoming.params.offset ?: 0}"
  result: result
  next: respond

respond:
  return: ${result.response.body}
  next: end
