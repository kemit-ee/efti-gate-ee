check_exists:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: exists_result
  next: check_found

check_found:
  switch:
    - condition: ${exists_result.response.body == null || exists_result.response.body.length == 0}
      next: not_found
  next: update_user

update_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_user"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      taraSub: "${incoming.body.taraSub}"
      name: "${incoming.body.name}"
  result: update_result
  next: check_update

check_update:
  switch:
    - condition: ${update_result.response.body == null || update_result.response.body.length == 0}
      next: update_failed
  next: verify_user

verify_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body}
  next: end

not_found:
  return: '{"error": "Not Found"}'
  status: 404
  next: end

update_failed:
  return: '{"error": "Failed to update user"}'
  status: 500
  next: end

verify_failed:
  return: '{"error": "User updated but could not be verified"}'
  status: 500
  next: end
