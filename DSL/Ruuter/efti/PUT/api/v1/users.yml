check_admin:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
    body: {}
  result: admin_check
  next: verify_admin

verify_admin:
  switch:
    - condition: ${admin_check.response.status == 200}
      next: check_exists
  next: admin_fail

admin_fail:
  return: ${admin_check.response.body}
  status: ${admin_check.response.status}
  wrapper: false
  next: end

check_exists:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: exists_result
  next: check_found

check_found:
  switch:
    - condition: ${exists_result.response.body == null || exists_result.response.body.length == 0}
      next: not_found
  next: check_self_admin_removal

# An admin cannot remove their own ADMIN role — that would lock them out of admin operations.
check_self_admin_removal:
  switch:
    - condition: ${admin_check.response.body[0].id == incoming.params.pathParams[0] && (incoming.body.roles == null || !incoming.body.roles.contains('ADMIN'))}
      next: self_admin_removal_forbidden
  next: update_user

update_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_user"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      taraSub: "${incoming.body.taraSub}"
      name: "${incoming.body.name}"
      roles: "${incoming.body.roles}"
  result: update_result
  next: check_update

check_update:
  switch:
    - condition: ${update_result.response.body == null || update_result.response.body.length == 0}
      next: update_failed
  next: verify_user

verify_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  wrapper: false
  return: ${verify_result.response.body[0]}
  next: end

self_admin_removal_forbidden:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden","title":"Forbidden","status":403,"detail":"An admin cannot remove their own ADMIN role."}')}
  status: 403
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update user"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "User updated but could not be verified"}
  status: 500
  wrapper: false
  next: end
