declaration:
  description: "Accept consignment XML from Platforms (External API)"
  allowed_body: [xml]

consignment_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/upload/request-to-json"
    body:
      text: "${incoming.body.xml}"
    content_type: plaintext
    headers:
      Content-Type: "text/xml"
  result: consignment_json
  next: insert_consignment

insert_consignment:
  call: http.post
  args:
      url: "[#RESQL_URL]/efti/insert_consignment"
      headers:
        Content-Type: "application/json"
      body: ${consignment_json.response.body}
  result: insert_result
  next: respond

# TODO: verify?

respond:
  return: ${insert_result.response.body[0]}
  wrapper: false
  status: 201
  next: end
