declaration:
  description: "Accept consignment XML from Platforms"
  allowed_body: [xml]

consignment_xml:
  call: http.post
  args:
    url: "http://xml-mapper:8082/api/v1/upload/request-to-json"
    body:
      text: "${incoming.body.xml}"
    content_type: plaintext
    headers:
      Content-Type: "text/xml"
  result: consignment_json
  next: insert_consignment

insert_consignment:
  call: http.post
  args:
      url: "http://resql:8090/efti/insert_consignment"
      headers:
        Content-Type: "application/json"
      body: ${consignment_json.response.body}
  result: insert_result
  next: respond

# TODO: verify?

respond:
  return: ${insert_result.response.body}
  status: 201
  next: end
