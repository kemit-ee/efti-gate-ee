create_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_platform"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      baseUrl: "${incoming.body.baseUrl}"
      headers: "${incoming.body.headers}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      certSubject: "${incoming.body.certSubject}"
      certSerial: "${incoming.body.certSerial}"
      status: "${incoming.body.status}"
  result: insert_result
  next: check_insert

check_insert:
  switch:
    - condition: ${insert_result.response.body == null || insert_result.response.body.length == 0}
      next: insert_failed
  next: verify_platform

verify_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_platform_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create platform"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Platform created but could not be verified"}
  status: 500
  wrapper: false
  next: end
