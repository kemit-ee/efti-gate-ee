declaration:
  description: "Authority sends a follow-up message to a Platform via the gate (TARA JWT)"
  allowed_body: [json]

insert_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_follow_up_log"
    headers:
      Content-Type: "application/json"
    body:
      requestingGateId: "${env.OWN_GATE_ID}"
      requestingUserId: ""
      datasetRequestId: "${incoming.body.uil.datasetId}"
      destinationGateId: "${incoming.body.uil.gateId}"
      destinationPlatformId: "${incoming.body.uil.platformId}"
      payload: "${incoming.body.message}"
      status: "DELIVERED"
  result: log_result
  next: check_insert

check_insert:
  switch:
    - condition: ${log_result.response.body == null || log_result.response.body.length == 0}
      next: insert_failed
  next: check_gate

check_gate:
  switch:
    - condition: ${incoming.body.uil.gateId != env.OWN_GATE_ID}
      next: forward_to_remote_gate
  next: get_platform

get_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_platform_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.uil.platformId}"
  result: platform_result
  next: check_platform

check_platform:
  switch:
    - condition: ${platform_result.response.body == null || platform_result.response.body.length == 0}
      next: platform_not_found
  next: forward_to_platform

forward_to_platform:
  call: http.post
  args:
    url: "${platform_result.response.body.baseUrl}/${incoming.body.uil.datasetId}/follow-up"
    headers:
      Content-Type: "application/json"
      X-Dataset-Request-ID: "${incoming.body.referenceIds[0]}"
    body:
      uil: ${incoming.body.uil}
      message: ${incoming.body.message}
      files: ${incoming.body.files}
  result: platform_response
  next: respond

respond:
  return: ${incoming.body.uil}
  wrapper: false
  status: 201
  next: end

forward_to_remote_gate:
  # TODO: Forward to remote gate over eDelivery
  return: '{"error": "Remote gate follow-up not yet implemented"}'
  status: 501
  next: end

platform_not_found:
  return: '{"type":"https://api.efti.ee/errors/platform-not-found","title":"Platform Not Found","status":404,"detail":"Platform not found"}'
  status: 404
  next: end

insert_failed:
  return: '{"error": "Failed to log follow-up message"}'
  status: 500
  next: end
