check_admin:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
    body: {}
  result: admin_check
  next: verify_admin

verify_admin:
  switch:
    - condition: ${admin_check.response.status == 200}
      next: check_exists
  next: admin_fail

admin_fail:
  return: ${admin_check.response.body}
  status: ${admin_check.response.status}
  wrapper: false
  next: end

check_exists:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: exists_result
  next: check_found

check_found:
  switch:
    - condition: ${exists_result.response.body == null || exists_result.response.body.length == 0}
      next: not_found
  next: revoke_token

revoke_token:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/revoke_user_token"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: revoke_result
  next: check_revoke

check_revoke:
  switch:
    - condition: ${revoke_result.response.body == null || revoke_result.response.body.length == 0}
      next: revoke_failed
  next: verify_user

verify_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
    - condition: ${verify_result.response.body[0].tokenRevokedAt == null}
      next: verify_failed
  next: respond

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end

revoke_failed:
  return: {"error": "Failed to revoke user token"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Token revocation could not be verified"}
  status: 500
  wrapper: false
  next: end
