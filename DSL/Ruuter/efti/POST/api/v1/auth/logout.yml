declaration:
  version: "1.0"
  description: "Logout — blacklist JWT via TIM and clear the browser cookie."
  method: post
  accepts: json
  returns: json
  allowlist:
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

check_cookie:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.cookie == null}
      next: clear_cookie
  next: expire_tim_session

expire_tim_session:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/blacklist"
    headers:
      cookie: ${incoming.headers.cookie}
      X-TIM-Admin-Token: "[#TIM_ADMIN_TOKEN]"
  result: expire_result
  next: clear_cookie

clear_cookie:
  headers:
    Set-Cookie: "eftiJwtCookie=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0"
  return: "logged out"
  next: end
