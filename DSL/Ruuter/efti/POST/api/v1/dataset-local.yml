declaration:
  description: "Retrieve dataset from local platform — used by mock-gate handler when receiver is own gate"
  allowed_body: [xml]

parse_request:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-json"
    headers:
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: ${incoming.body.xml}
  result: request_json

call_dataset:
  template: api/v1/authority/dataset
  request_type: "POST"
  body:
    uil:
      gateId: "[#OWN_GATE_ID]"
      platformId: "${request_json.response.body.uil.platformId}"
      datasetId: "${request_json.response.body.uil.datasetId}"
    subsets: "${request_json.response.body.subsets}"
  result: dataset_response

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-xml"
    headers:
      Content-Type: "application/json"
    body: ${dataset_response}
  result: xml_response

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
