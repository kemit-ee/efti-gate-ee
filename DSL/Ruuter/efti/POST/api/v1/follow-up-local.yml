declaration:
  description: "Process follow-up locally — used by mock-gate handler when receiver is own gate"
  allowed_body: [xml]

parse_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/request-to-json"
    headers:
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: "${incoming.body.xml}"
  result: followup_json
  next: call_follow_up

call_follow_up:
  template: api/v1/follow-up
  request_type: "POST"
  body:
    uil:
      gateId: "[#OWN_GATE_ID]"
      platformId: "${followup_json.response.body.uil.platformId}"
      datasetId: "${followup_json.response.body.uil.datasetId}"
    referenceIds: "${followup_json.response.body.referenceIds}"
    message: "${followup_json.response.body.message}"
    files: "${followup_json.response.body.files}"
  result: followup_response
  next: to_xml

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/response-to-xml"
    headers:
      Content-Type: "application/json"
    body: ${followup_response}
  result: xml_response
  next: respond

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 201
  next: end
