declaration:
  description: "Send follow-up message to local platform - shared by eDelivery and Authority API
    (gate-internal, X-Internal-Service-Token; also invoked via template:). Body: uil (object,
    required), referenceIds (array, required), message (string, required), files (array, optional)."
  internal: false
  returns: []
  additive: true
  allowlist:
    body:
      - field: uil
        type: object
      - field: message
        type: string
      - field: referenceIds
        type: array

# Shared step: reached directly (Authority API) and via template: (the -xml G2G wrapper, whose
# body is xml-mapper's FTI025 → JSON). Only `uil` is checked - it is dereferenced unconditionally
# below and by every caller; `referenceIds` / `message` presence is the caller's contract
# (authority/follow-up.yml checks them for the officer-facing 400).
validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.uil == null}
      next: bad_request
  next: setup

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "The request body must be a JSON object with a 'uil' object."
  wrapper: false
  status: 400
  next: end

# queryId: the FTI025 query id the follow-up arrived with (xml-mapper sends it back as x-request-id, an
# authority/X-Road call carries its own request id). Only a UUID counts; without one nothing is deduplicated.
setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}
    queryId: ${(/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(incoming.headers['x-request-id'] ?? '') && incoming.headers['x-request-id'].toLowerCase()) || null}
  next: insert_log

insert_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_follow_up_log"
    headers:
      Content-Type: "application/json"
    body:
      requestingGateId: "${incoming.body.uil.gateId}"
      datasetRequestId: "${incoming.body.uil.datasetId}"
      destinationGateId: "${incoming.body.uil.gateId}"
      destinationPlatformId: "${incoming.body.uil.platformId}"
      payload: "${incoming.body.message}"
      status: "DELIVERED"
      queryId: ${queryId}
  result: log_result

# With a queryId the insert returns no row when the latest row of the same (queryId, platform,
# dataset request) is already DELIVERED (#354): a repeat is logged and forwarded once. A first
# attempt that failed after logging leaves a FAILED row (record_failure), so a retry goes through.
check_insert:
  switch:
    # Transport failure reaching ReSql (issue #89, status 0) - the follow-up log write did not land.
    - condition: ${log_result.response.status == 0 || log_result.response.status >= 300}
      next: insert_failed
    - condition: ${!Array.isArray(log_result.response.body)}
      next: insert_failed
    - condition: ${log_result.response.body.length === 0 && queryId != null}
      next: repeated_follow_up
    - condition: ${log_result.response.body.length === 0}
      next: insert_failed

get_platform:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/platforms/${encodeURIComponent((incoming.body.uil.platformId ?? '').toLowerCase())}.json"
    headers:
      Content-Type: "application/json"
  result: platform_result

check_platform:
  switch:
    # A registry transport failure is a gate-side outage, so the not-found test below would
    # otherwise misreport it as "platform not found" (404). The registry answers 404 for an id it
    # does not serve.
    - condition: ${platform_result.response.status == 0 || platform_result.response.status >= 300}
      next: mark_lookup_failed
    # A DISABLED platform is treated as absent, so a caller cannot tell it apart from an unknown id.
    - condition: ${!platform_result.response.body || platform_result.response.body.id == null || platform_result.response.body.status !== 'ONLINE'}
      next: mark_not_found
    - condition: ${!!platform_result.response.body.eDeliveryCert}
      next: request_to_xml

forward_to_rest_platform:
  call: http.post
  args:
    url: "${platform_result.response.body.baseUrl}/v1/dataset/${encodeURIComponent(incoming.body.uil.datasetId ?? '')}/follow-up"
    headers: "${Object.assign(platform_result.response.body.headers ?? {}, {'Content-Type': 'application/json', 'X-Dataset-Request-ID': incoming.body.referenceIds[0], 'x-request-id': requestId})}"
    body: ${incoming.body}
  result: platform_response
  next: check_forward

request_to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${incoming.body}
  result: xml_request

forward_to_edelivery_platform:
  call: http.post
  timeout: 65000
  args:
    url: "[#EDELIVERY_URL]/api/v1/send/${platform_result.response.body.id}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    content_type: plaintext
    body: ${xml_request.response.body}
  result: platform_response

check_forward:
  switch:
    - condition: ${platform_response.response.status == 0}
      next: mark_forward_transport
    - condition: ${platform_response.response.status >= 300}
      next: mark_forward_status

respond:
  return: ${incoming.body.uil}
  wrapper: false
  status: ${platform_response.response.status}
  next: end

repeated_follow_up:
  return: ${incoming.body.uil}
  wrapper: false
  status: 200
  next: end

# A follow-up that was logged but not delivered gets a FAILED row, so a retry with the same query id
# is not taken for a repeat. The reason is a fixed word (and a status number), never peer text.
mark_not_found:
  assign:
    failure_kind: "not_found"
    failure_reason: "platform_not_found"
  next: record_failure

mark_lookup_failed:
  assign:
    failure_kind: "lookup"
    failure_reason: "platform_lookup_failed"
  next: record_failure

mark_forward_transport:
  assign:
    failure_kind: "forward_transport"
    failure_reason: "forward_unreachable"
  next: record_failure

mark_forward_status:
  assign:
    failure_kind: "forward_status"
    failure_reason: "forward_status_${platform_response.response.status}"
  next: record_failure

record_failure:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_follow_up_log"
    headers:
      Content-Type: "application/json"
    body:
      requestingGateId: "${incoming.body.uil.gateId}"
      datasetRequestId: "${incoming.body.uil.datasetId}"
      destinationGateId: "${incoming.body.uil.gateId}"
      destinationPlatformId: "${incoming.body.uil.platformId}"
      payload: "${incoming.body.message}"
      status: "FAILED"
      failureReason: ${failure_reason}
      queryId: ${queryId}
  result: failed_log

failure_dispatch:
  switch:
    - condition: ${failure_kind == 'not_found'}
      next: platform_not_found
    - condition: ${failure_kind == 'lookup'}
      next: platform_lookup_failed
    - condition: ${failure_kind == 'forward_transport'}
      next: forward_unavailable
  next: respond

platform_not_found:
  return:
    error: "Platform Not Found"
  wrapper: false
  status: 404
  next: end

insert_failed:
  return:
    error: "Failed to log follow-up message"
  wrapper: false
  status: 500
  next: end

platform_lookup_failed:
  return:
    error: "Platform lookup failed (data layer unavailable)"
  wrapper: false
  status: 502
  next: end

forward_unavailable:
  return:
    error: "The destination platform is unreachable"
  wrapper: false
  status: 502
  next: end
