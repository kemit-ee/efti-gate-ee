declaration:
  description: "Retrieve dataset from local platform via eDelivery"
  allowed_body: [xml]

parse_request:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-json"
    headers:
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: ${incoming.body.xml}
  result: request_json
  next: call_dataset

call_dataset:
  template: api/v1/authority/dataset
  request_type: "POST"
  body: ${request_json.response.body}
  result: dataset_response
  next: to_xml

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-xml"
    headers:
      Content-Type: "application/json"
    body: ${dataset_response}
  result: xml_response
  next: respond

respond:
  return: ${xml_response.response.body}
  wrapper: false
  headers:
    Content-Type: "text/xml"
  next: end
