declaration:
  description: "Retrieve dataset from local platform via eDelivery"
  allowed_body: [xml]

parse_request:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-json"
    headers:
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: ${incoming.body.xml}
  result: request_json
  next: call_dataset

call_dataset:
  template: api/v1/dataset
  request_type: "POST"
  body: # TODO: ${request_json.response.body}
    uil: ${request_json.response.body.uil}
    subsets: ${request_json.response.body.subsets}
  result: dataset_response
  next: respond

respond:
  return: ${dataset_response}
  wrapper: false
  headers:
    Content-Type: "text/xml"
  next: end
