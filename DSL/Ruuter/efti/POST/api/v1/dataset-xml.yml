declaration:
  description: "Retrieve dataset from local platform via eDelivery"
  allowed_body: [xml]

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}

parse_request:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-json"
    headers:
      x-request-id: ${requestId}
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: ${incoming.body.xml}
  result: request_json

call_dataset:
  template: api/v1/dataset-local
  request_type: "POST"
  # Ruuter #72 (h2ck.me H1, 0.9.11-rc): template: now runs the callee's guard against the
  # CHILD context — nothing is inherited from incoming.headers automatically. dataset-local
  # lives under this same guarded directory (efti/POST/api/v1/.guard.yml), so forward the
  # token this route was itself called with.
  headers:
    x-request-id: ${requestId}
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body: ${request_json.response.body}
  result: dataset_response

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-xml"
    headers:
      x-request-id: ${requestId}
      Content-Type: "application/json"
    body: ${dataset_response}
  result: xml_response

respond:
  return: ${xml_response.response.body}
  wrapper: false
  headers:
    Content-Type: "text/xml"
