check_admin:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
    body: {}
  result: admin_check
  next: verify_admin

verify_admin:
  switch:
    - condition: ${admin_check.response.status == 200}
      next: create_authority
  next: admin_fail

admin_fail:
  return: ${admin_check.response.body}
  status: ${admin_check.response.status}
  wrapper: false
  next: end

create_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      name: "${incoming.body.name}"
      registryCode: "${incoming.body.registryCode}"
      subsets: "${incoming.body.subsets}"
      status: "${incoming.body.status}"
  result: insert_result
  next: check_insert

check_insert:
  switch:
    - condition: ${insert_result.response.body == null || insert_result.response.body.length == 0}
      next: insert_failed
  next: verify_authority

verify_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create authority"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Authority created but could not be verified"}
  status: 500
  wrapper: false
  next: end
