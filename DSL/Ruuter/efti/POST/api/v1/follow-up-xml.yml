declaration:
  description: "Follow-up message through eDelivery"
  allowed_body: [xml]

parse_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/request-to-json"
    headers:
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: "${incoming.body.xml}"
  result: followup_json

call_follow_up:
  template: api/v1/follow-up-local
  request_type: "POST"
  # Ruuter #72 (h2ck.me H1, 0.9.11-rc): template: now runs the callee's guard against the
  # CHILD context — nothing is inherited from incoming.headers automatically. follow-up-local
  # lives under this same guarded directory (efti/POST/api/v1/.guard.yml), so forward the
  # token this route was itself called with.
  headers:
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body: ${followup_json.response.body}
  result: followup_response

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/response-to-xml"
    headers:
      Content-Type: "application/json"
    body: ${followup_response}
  result: xml_response

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 201
