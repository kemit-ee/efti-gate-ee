declaration:
  description: "Follow-up message through eDelivery"
  internal: false
  returns: []
  additive: true
  allowlist:
    body:
      - field: xml
        type: string
        required: true

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}

parse_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/request-to-json"
    headers:
      x-request-id: ${requestId}
      Content-Type: "text/xml"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    content_type: plaintext
    body:
      text: "${incoming.body.xml}"
  result: followup_json

call_follow_up:
  template: api/v1/follow-up-local
  request_type: "POST"
  # Ruuter #72 (h2ck.me H1, 0.9.11-rc): template: now runs the callee's guard against the
  # CHILD context - nothing is inherited from incoming.headers automatically. follow-up-local
  # lives under this same guarded directory (efti/POST/api/v1/.guard.yml), so forward the
  # token this route was itself called with.
  headers:
    x-request-id: ${requestId}
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body: ${followup_json.response.body}
  result: followup_response

# follow-up-local answers the same follow-up still in flight with this problem body; a template call
# returns only the body, so it is checked here instead of being mapped to FTI030.
check_follow_up:
  switch:
    - condition: ${followup_response.code == 'FOLLOW_UP_IN_PROGRESS'}
      next: follow_up_in_progress

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/response-to-xml"
    headers:
      x-request-id: ${requestId}
      Content-Type: "application/json"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${followup_response}
  result: xml_response

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 201

follow_up_in_progress:
  return:
    type: "https://api.efti.ee/errors/follow-up-in-progress"
    code: "FOLLOW_UP_IN_PROGRESS"
    title: "Follow-up In Progress"
    status: 409
    detail: "The same follow-up is being delivered or was not delivered yet. Retry later with the same request id."
  wrapper: false
  status: 409
  next: end
