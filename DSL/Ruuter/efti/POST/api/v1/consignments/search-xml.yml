declaration:
  description: "Search consignments through eDelivery"
  allowed_body: [xml]

to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/request-to-json"
    headers:
      Content-Type: "text/xml"
    content_type: plaintext
    body:
      text: ${incoming.body.xml}
  result: criteria_json
  next: local_search

local_search:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments"
    headers:
      Content-Type: "application/json"
    body:
      gateId: ${incoming.params.gateId ?? '[#OWN_GATE_ID]'}
      criteria: ${incoming.body}
  result: local_result
  next: to_xml

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-xml"
    headers:
      Content-Type: "application/json"
    body: ${local_result.response.body}
  result: xml_response
  next: respond

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 200
  next: end
