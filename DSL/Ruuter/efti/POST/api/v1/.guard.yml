# Public at this level. Routes here are the gate-to-gate inbound endpoints
# (dataset-xml, dataset-local, follow-up-xml, follow-up-local,
# consignments/search-xml) plus ping — all reached only from the edelivery
# container after AS4 mTLS. The authority-facing endpoints live under authority/
# and are guarded there (is_admin). Ruuter only enforces directory
# .guard.yml files, so a per-route guard here would be silently ignored.
guard_success:
  return: "success"
  status: 200
  wrapper: false
