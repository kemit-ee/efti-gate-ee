# efti/api/v1/* is a gate-internal surface, not a public one. The G2G inbound routes here
# (dataset-xml/-local, follow-up-xml/-local, consignments/search-xml, ping) are reached
# only by the edelivery container after AS4 mTLS terminates there; edelivery forwards the
# shared X-Internal-Service-Token on every call. The authority-facing routes live under
# authority/ and carry the same requirement, enforced there.
#
# This used to be public (network isolation only, relying on edelivery being the only
# path in). The token is defence in depth: anyone who reaches port 8086 directly no
# longer gets a free G2G-inbound surface.
#
# Ruuter #79 (@sviljus leid, parandatud turnerrainer/ruuter 0.9.13-rc): kui guard
# ise sisaldab `template:` sammu, mille sihtmärk on sama guardi all, tekkis
# 0.9.11–0.9.12-rc korral lõpmatu rekursioon (`guard → template → sama guard → …`)
# ja protsess crashis (exit 134). 0.9.13-rc lisas per-request guard-stacki: juba
# stackil olev guard jäetakse vahele + kõva `MAX_GUARD_DEPTH = 32` katkesti.
# Käesolev guard on puhas `switch` (ei kutsu `template:`), seega polnud crash'i
# teel - fix on siin ohutusvõrk, kui keegi peaks siia guardi `template:` lisama.

declaration:
  description: "efti/POST/api/v1 guard - gate-internal. Credential: X-Internal-Service-Token
    (required), must equal INTERNAL_SERVICE_TOKEN. No JWT path."

check_service_token:
  switch:
    - condition: ${incoming.headers != null && incoming.headers['x-internal-service-token'] != null && incoming.headers['x-internal-service-token'] != '' && incoming.headers['x-internal-service-token'] == '[#INTERNAL_SERVICE_TOKEN]'}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  detach:
    do:
      - call: http.post
        args:
          url: "[#RESQL_URL]/efti/insert_audit_log"
          headers:
            Content-Type: "application/json"
          body:
            action: "efti-internal.auth_denied"
            resource: "efti-internal"
            ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
            details: "${JSON.stringify({ reason: 'missing or invalid X-Internal-Service-Token' })}"
  next: guard_fail_respond

guard_fail_respond:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    code: "UNAUTHORIZED"
    title: "Unauthorized"
    status: 401
    detail: "This endpoint requires a valid X-Internal-Service-Token."
  status: 401
  headers:
    Content-Type: "application/problem+json"
  wrapper: false
  next: end
