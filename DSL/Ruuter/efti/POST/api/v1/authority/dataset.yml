declaration:
  description: "Authority API — get full consignment dataset XML filtered by subsets"
  allowed_body: [uil, subsets]

check_gate:
  switch:
    - condition: ${incoming.body.uil.gateId != '[#OWN_GATE_ID]'}
      next: forward_to_remote_gate
  next: get_platform

get_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_platform_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.uil.platformId}"
  result: platform_result
  next: check_platform

check_platform:
  switch:
    - condition: ${!platform_result.response.body.length}
      next: platform_not_found
  next: forward_to_platform

forward_to_platform:
  call: http.get
  args:
    url: "${platform_result.response.body[0]?.baseUrl}/v1/dataset/${incoming.body.uil.datasetId}?subsetId=${incoming.body.subsets.join(',')}"
    headers: "${Object.assign(platform_result.response.body[0]?.headers ?? {}, {'x-request-id': incoming.headers['x-request-id'] ?? null})}"
  result: platform_response
  next: respond

respond:
  return:
    uil: ${incoming.body.uil}
    subsets: ${incoming.body.subsets}
    xml: ${platform_response.response.body}
  wrapper: false
  status: ${platform_response.response.status}
  next: end

forward_to_remote_gate:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-xml"
    headers:
      Content-Type: "application/json"
    body:
      uil: "${incoming.body.uil}"
      subsets: "${incoming.body.subsets}"
  result: dataset_xml
  next: send_via_edelivery

send_via_edelivery:
  call: http.post
  timeout: 65000
  args:
    url: "[#EDELIVERY_URL]/api/v1/send/${incoming.body.uil.gateId}"
    headers:
      Content-Type: "text/xml"
      x-request-id: "${incoming.headers['x-request-id'] ?? ''}"
    body: "${dataset_xml.response.body}"
    content_type: plaintext
  result: edelivery_response
  next: check_edelivery_response

check_edelivery_response:
  switch:
    - condition: ${edelivery_response.response.status != 200}
      next: edelivery_error
  next: convert_response_to_json

convert_response_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-json"
    headers:
      Content-Type: "text/xml"
    body: "${edelivery_response.response.body}"
  result: dataset_json
  next: respond_remote

respond_remote:
  return: ${dataset_json.response.body}
  wrapper: false
  status: 200
  next: end

edelivery_error:
  return:
    error: "Remote gate dataset request failed"
    detail: "${edelivery_response.response.body}"
  wrapper: false
  status: ${edelivery_response.response.status}
  next: end

platform_not_found:
  return:
    error: "Platform Not Found"
  wrapper: false
  status: 404
  next: end
