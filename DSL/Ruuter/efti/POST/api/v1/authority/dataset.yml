declaration:
  description: "Authority requests a dataset from a Platform via the gate (gate-internal body form).
    Same {uil, subsets} contract as the sibling authority/search and authority/follow-up handlers.
    Called by the X-Road adapter (xroad/POST/v1/dataset.yml) after it has resolved the calling
    organisation and enforced authorities.subsets. The GET/path form for authority officers lives at
    efti/GET/api/v1/authority/dataset.yml; both delegate to the api/v1/dataset-local template."
  # Body: uil (object, required — {gateId, platformId, datasetId}) and subsets (array, required,
  # min 1). No allowed_body here (it would strip fields core validates itself); the dataset-local
  # template this delegates to declares allowed_body: [uil, subsets]. validate_input is the 400.

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.uil == null || incoming.body.subsets == null || incoming.body.subsets.length == 0}
      next: bad_request
  next: check_gate

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "The request body must be a JSON object with 'uil' (object) and a non-empty 'subsets' array."
  wrapper: false
  status: 400
  next: end

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}

check_gate:
  switch:
    - condition: ${incoming.body.uil.gateId != '[#OWN_GATE_ID]'}
      next: request_to_xml

call_local_platform:
  template: api/v1/dataset-local
  request_type: "POST"
  headers:
    x-request-id: ${requestId}
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body: ${incoming.body}
  result: dataset_response
  next: check_local_result

check_local_result:
  switch:
    - condition: ${dataset_response == null || dataset_response.xml == null}
      next: local_platform_error
  next: convert_response_to_json

local_platform_error:
  return: ${dataset_response}
  wrapper: false
  status: 404
  next: end

request_to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
    body: ${incoming.body}
  result: request_xml

check_request_xml:
  switch:
    - condition: ${request_xml.response.status == 0}
      next: mapper_unavailable

send_via_edelivery:
  call: http.post
  timeout: 65000
  args:
    url: "[#EDELIVERY_URL]/api/v1/send/${incoming.body.uil.gateId}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
    body: ${request_xml.response.body}
    content_type: plaintext
  result: edelivery_response

check_edelivery_response:
  switch:
    # Transport failure reaching the peer gate over eDelivery (issue #89, status 0): edelivery_error
    # echoes edelivery_response.response.status as the HTTP status, which would emit a broken
    # `status: 0`. Route the availability-failure class to a real 502.
    - condition: ${edelivery_response.response.status == 0}
      next: remote_gate_unavailable
    - condition: ${edelivery_response.response.status != 200}
      next: edelivery_error

assign_dataset_from_edelivery:
  assign:
    dataset_response:
      xml: ${edelivery_response.response.body}
  next: convert_response_to_json

edelivery_error:
  return:
    error: "Remote gate dataset request failed"
    detail: ${edelivery_response.response.body}
  wrapper: false
  status: ${edelivery_response.response.status}
  next: end

convert_response_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/dataset/response-to-json"
    headers:
      x-request-id: ${requestId}
      content-type: "text/xml"
    body: ${dataset_response.xml}
    content_type: plaintext
  result: dataset_json

check_dataset_json:
  switch:
    - condition: ${dataset_json.response.status == 0}
      next: mapper_unavailable

respond:
  return: ${dataset_json.response.body}
  wrapper: false
  next: end

mapper_unavailable:
  return:
    error: "XML mapper unavailable"
  wrapper: false
  status: 502
  next: end

remote_gate_unavailable:
  return:
    error: "The remote gate is unreachable"
    transportError: ${edelivery_response.response.error}
  wrapper: false
  status: 502
  next: end
