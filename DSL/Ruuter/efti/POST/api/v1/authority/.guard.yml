# JWT Authority API (search, dataset, follow-up). A competent authority proper is an
# organisation authenticated over X-Road (DSL/Ruuter/xroad/.guard.yml → authorities.registry_code);
# there is no "authority" flag on users. This interactive JWT surface is therefore restricted to
# gate operators: it requires a TARA JWT resolving to a users row with is_admin.
# check-admin-authority returns 200 for admins, 401 if the token is missing/invalid, 403 if
# authenticated but not admin.
validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
      x-forwarded-for: ${incoming.headers['x-forwarded-for'] ?? null}
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body: {}
  result: auth_result
  next: check_result

check_result:
  switch:
    - condition: ${auth_result.response.status == 200}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
  next: end
