# Authority API (search, follow-up, and dataset once wired) — gate-internal only, no JWT
# path. A competent authority proper is an organisation authenticated over X-Road
# (DSL/Ruuter/xroad/.guard.yml → authorities.registry_code); there is no "authority" flag
# on users, and there is no gate-operator JWT escape hatch on this surface any more.
#
# The sole credential is X-Internal-Service-Token: another gate component calling in over
# the internal network. Today that is the X-Road adapter (the xroad/ project on this same
# Ruuter), which resolves the calling organisation from X-Road-Client and enforces
# authorities.subsets itself before forwarding; the same token is earmarked for G2G inbound.
# This is a GENERIC internal-service credential — core stays unaware of X-Road, and the
# handlers below are identity-blind anyway (dataset.yml reads only body.uil/body.subsets,
# follow-up.yml hardcodes requestingUserId). The caller authorises itself before forwarding.
#
# The non-null/non-empty checks are load-bearing, not defensive noise: if
# INTERNAL_SERVICE_TOKEN is unset, '[#INTERNAL_SERVICE_TOKEN]' may interpolate to an empty
# string, and without them an absent or empty header would compare equal to it and
# authenticate. Deny is the fall-through branch.
check_service_token:
  switch:
    - condition: ${incoming.headers != null && incoming.headers['x-internal-service-token'] != null && incoming.headers['x-internal-service-token'] != '' && incoming.headers['x-internal-service-token'] == '[#INTERNAL_SERVICE_TOKEN]'}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    code: "UNAUTHORIZED"
    title: "Unauthorized"
    status: 401
    detail: "This endpoint requires a valid X-Internal-Service-Token."
  status: 401
  wrapper: false
  next: end
