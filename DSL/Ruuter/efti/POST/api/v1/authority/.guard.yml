# Authority-or-admin: explicitly stated for the authority/ subdirectory (same as the parent
# POST/api/v1/.guard, but kept here for clarity and future divergence).
#
# Two credentials are accepted:
#   1. X-Internal-Service-Token — another gate component calling in over the internal network.
#      Today that is the X-Road adapter (the xroad/ project on this same Ruuter), which has no way to obtain a TIM
#      JWT; the same token is earmarked for G2G inbound. This is a GENERIC internal-service
#      credential: core stays unaware of X-Road, and the handlers below are identity-blind anyway
#      (dataset.yml reads only body.uil/body.subsets, follow-up.yml hardcodes requestingUserId).
#      The caller is responsible for its own authorisation before forwarding — the X-Road adapter
#      resolves the organisation from X-Road-Client and enforces authorities.subsets itself.
#   2. Authorization: Bearer <TIM JWT> resolving to a users row with ADMIN or AUTHORITY.

# The non-null/non-empty checks are load-bearing, not defensive noise: if INTERNAL_SERVICE_TOKEN is
# unset, '[#INTERNAL_SERVICE_TOKEN]' may interpolate to an empty string, and without them an absent
# or empty header would compare equal to it and authenticate. Fall-through is the JWT path, never a
# bare success.
check_service_token:
  switch:
    - condition: ${incoming.headers != null && incoming.headers['x-internal-service-token'] != null && incoming.headers['x-internal-service-token'] != '' && incoming.headers['x-internal-service-token'] == '[#INTERNAL_SERVICE_TOKEN]'}
      next: guard_success
  next: validate_auth

validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-user-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
      x-viljus-knows-a-secret: "[#INTERNAL_SECRET]"
      x-forwarded-for: ${incoming.headers['x-forwarded-for'] ?? null}
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body: {}
  result: auth_result
  next: check_result

check_result:
  switch:
    - condition: ${auth_result.response.status != 200}
      next: guard_fail
    - condition: ${auth_result.response.body.isAdmin == true || auth_result.response.body.isAuthority == true}
      next: guard_success
  next: guard_fail_forbidden

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
  next: end

guard_fail_forbidden:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden","title":"Forbidden","status":403,"detail":"This action requires the ADMIN or AUTHORITY role."}')}
  status: 403
  wrapper: false
  next: end
