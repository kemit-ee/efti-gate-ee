declaration:
  description: "Authority search for consignments — local-first, then broadcast. A local match is
    returned at once with x-poll-more:false (this gate is authoritative for its own
    consignments). With no local match the response is [] with x-poll-more:true: the search is
    registered as a pending row in the gate DB and the other gates are queried in the background
    by a detached Ruuter task (parallel_http fan-out to eDelivery), then the aggregated
    ConsignmentRow[] is written back. Collect it by re-issuing the request with X-Request-Id +
    X-Poll and an empty body {}. Neither path ever blocks on a peer gate.
    Body: {operator, id}-shaped criteria object; criteria fields forwarded verbatim."

validate_input:
  switch:
    - condition: ${incoming.body == null}
      next: bad_request
  next: setup

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A JSON request body is required (send {} to poll for the rest of a prior search)."
  wrapper: false
  status: 400
  next: end

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}
    poll: ${incoming.headers['x-poll']}

check_poll:
  switch:
    - condition: ${!!requestId && !!poll}
      next: init_poll
  next: local_search

# --- poll path: collect the other gates' results for a prior search -----------------------------
# The result lives in the gate DB (search_results), written by the detached broadcast task. The
# first call inserted a `pending` row, so a poll can tell "broadcast registered, still running"
# from "unknown search id". The retired multiplexer long-polled in memory for up to 30s; we
# reproduce that bounded wait by reading the latest row and sleeping+retrying (60 x 500ms). An
# unknown id (or one already purged) answers immediately with x-poll-more:false, exactly as the
# retired service did.
init_poll:
  assign:
    attempts: 0
  next: poll_read

poll_read:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_search_result"
    headers:
      Content-Type: "application/json"
    body:
      searchId: "${requestId}"
  result: poll_result
  next: check_poll_result

check_poll_result:
  switch:
    - condition: ${poll_result.response.status != 200}
      next: poll_unavailable
    - condition: ${poll_result.response.body != null && poll_result.response.body.length == 1 && poll_result.response.body[0] != null && poll_result.response.body[0].status == 'complete'}
      next: respond_result
    - condition: ${poll_result.response.body != null && poll_result.response.body.length == 0}
      next: respond_unknown
    - condition: ${attempts < 60}
      next: poll_wait
  next: respond_still_pending

poll_wait:
  sleep: 500
  assign:
    attempts: "${attempts + 1}"
  next: poll_read

respond_result:
  return: ${poll_result.response.body[0].body}
  headers:
    content-type: "application/json"
    x-poll-more: false
  wrapper: false
  next: end

respond_unknown:
  return: []
  headers:
    content-type: "application/json"
    x-poll-more: "false"
  wrapper: false
  next: end

respond_still_pending:
  return: []
  headers:
    content-type: "application/json"
    x-poll-more: "true"
  wrapper: false
  next: end

poll_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Polling the cross-gate search results failed in the gate's data layer."
    resqlStatus: ${poll_result.response.status}
  wrapper: false
  status: 502
  next: end

# --- first call --------------------------------------------------------------------------------
local_search:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments"
    headers:
      Content-Type: "application/json"
    body:
      gateId: '[#OWN_GATE_ID]'
      criteria: ${incoming.body}
  result: local_result

check_local:
  switch:
    - condition: ${local_result.response.status == 0 || local_result.response.status >= 300}
      next: local_unavailable
    - condition: ${local_result.response.body.length > 0}
      next: respond_local
  next: criteria_to_xml

local_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Searching this gate's consignments failed in the data layer."
  status: 502
  wrapper: false
  next: end

# Local hit: authoritative for this gate's own consignments, return it and stop.
respond_local:
  return: ${local_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: false
  wrapper: false
  next: end

# No local match -> register the search, kick off the cross-gate broadcast in a detached task,
# and answer immediately. The detached task writes the aggregated result to the gate DB; the
# X-Poll path above reads it back.
criteria_to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${incoming.body}
  result: criteria_xml

# The peer registry is registry/gates/*.json, served by the ADR-015 registry service: this gate's
# peers are the ONLINE gates other than this one. Fetched fresh per search (the retired multiplexer
# cached it for 60s).
get_peer_gates:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/gates.json"
    headers:
      Content-Type: "application/json"
  result: gates_result
  next: check_gates

check_gates:
  switch:
    # A non-array body (an error object, a truncated response) must not silently become "no peers".
    - condition: ${gates_result.response.status != 200 || !Array.isArray(gates_result.response.body)}
      next: broadcast_unavailable
  next: assign_peers

assign_peers:
  assign:
    peer_gates: "${gates_result.response.body.filter(g => g.status === 'ONLINE' && g.id !== '[#OWN_GATE_ID]')}"
  next: register_pending

register_pending:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_search_pending"
    headers:
      Content-Type: "application/json"
    body:
      searchId: "${requestId}"
  result: pending_result
  next: check_pending

check_pending:
  switch:
    - condition: ${pending_result.response.status != 200}
      next: broadcast_unavailable
  next: start_broadcast

# Fire-and-forget: Ruuter answers as soon as the detach task is accepted and the peer fan-out runs
# in the background. The fan-out's per-peer result array is the structured replacement for the
# multiplexer's ad-hoc XML string-join: each gate's FTI021 document is converted to
# ConsignmentRow[] by xml-mapper and the flattened array is written to search_results as JSONB.
start_broadcast:
  detach:
    do:
      - parallel_http:
          peers: "${peer_gates}"
          call: http.post
          args:
            # The local eDelivery service signs/encrypts and does the actual AS4 exchange; it
            # blocks until the peer's reply arrives, hence the per-peer timeout.
            url: "[#EDELIVERY_URL]/api/v1/send/${peer.id}"
            headers:
              content-type: "text/xml"
              x-request-id: "${requestId}"
              x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
            body: "${criteria_xml.response.body}"
            content_type: plaintext
          aggregate: collect_all
          timeout: 62000
          max_concurrency: 32
          result: peer_responses
      - assign:
          # Only 2xx responses carrying an identifier set have consignments to map; an empty
          # FTI021 ("No consignments found") or a transport error is dropped here.
          good_responses: "${peer_responses.filter(r => r.response.status == 200 && typeof r.response.body === 'string' && r.response.body.indexOf('ParameterIDSetCriteria') != -1)}"
      - parallel_http:
          peers: "${good_responses}"
          call: http.post
          args:
            url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
            headers:
              content-type: "text/xml"
              x-request-id: "${requestId}"
              x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
            body: "${peer.response.body}"
            content_type: plaintext
          aggregate: collect_all
          timeout: 10000
          max_concurrency: 32
          result: converted
      - assign:
          search_body: "${converted.filter(c => c.response.status == 200).map(c => c.response.body).flat()}"
      - call: http.post
        args:
          url: "[#RESQL_URL]/efti/insert_search_complete"
          headers:
            Content-Type: "application/json"
          body:
            searchId: "${requestId}"
            body: "${JSON.stringify(search_body)}"
          result: complete_result
    timeout_ms: 90000
  next: respond_pending
  error: broadcast_unavailable

respond_pending:
  return: ${local_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: true
  wrapper: false
  next: end

broadcast_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Registering the cross-gate broadcast failed in the gate's data layer."
  wrapper: false
  status: 502
  next: end
