declaration:
  description: "Authority search for consignments — local-first, then broadcast. A local match is
    returned at once with x-poll-more:false (this gate is authoritative for its own
    consignments). With no local match the response is [] with x-poll-more:true and the other
    gates are queried in the background — collect their results by re-issuing the request with
    X-Request-Id + X-Poll and an empty body {}. Neither path ever blocks on a peer gate.
    Body: {operator, id}-shaped criteria object; criteria fields forwarded verbatim."

validate_input:
  switch:
    - condition: ${incoming.body == null}
      next: bad_request
  next: setup

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A JSON request body is required (send {} to poll for the rest of a prior search)."
  wrapper: false
  status: 400
  next: end

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}
    poll: ${incoming.headers['x-poll']}

check_poll:
  switch:
    - condition: ${!!requestId && !!poll}
      next: poll_remaining
  next: local_search

# --- poll path: collect the other gates' results for a prior search ---
# The timeout must exceed the multiplexer's bounded long-poll (GET /rest waits up to
# MULTIPLEXER_REST_POLL_SECONDS, default 30, for the first gate response) — with Ruuter's default
# 15s the wait itself became a status-0 transport stub, the stub flowed on into rest_to_json, and
# the poller got the xml-mapper's ParseError body back WITH STATUS 200 (the exact silent-wrong-body
# case ADR-006 warns about). Belt to the multiplexer's suspenders: since the completion sentinel in
# MultiplexerRoutes.startSearch a completed broadcast wakes the long-poll immediately, so the full
# 30s wait only happens while gates are genuinely still answering.
poll_remaining:
  call: http.get
  timeout: 35000
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/rest/${requestId}"
    headers:
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  result: rest_result
  next: check_rest

# Fail-closed before converting: a status-0 transport stub (Ruuter 0.9.15, issue #89) or a
# multiplexer error must not reach the xml-mapper as if it were gate XML.
check_rest:
  switch:
    - condition: ${rest_result.response.status == 0}
      next: rest_unavailable
    - condition: ${rest_result.response.status >= 400}
      next: rest_unavailable
  next: rest_to_json

rest_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
    headers:
      x-request-id: ${requestId}
      content-type: "text/xml"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${rest_result.response.body}
    content_type: plaintext
  result: rest_json
  next: check_rest_json

# Same discipline for the conversion itself: a mapper failure previously fell through to
# respond_rest, which has no status: and answered 200 with the mapper's error body.
check_rest_json:
  switch:
    - condition: ${rest_json.response.status != 200}
      next: rest_conversion_failed
  next: respond_rest

respond_rest:
  return: ${rest_json.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: ${rest_result.response.headers['x-poll-more']}
  wrapper: false
  next: end

rest_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Polling the cross-gate search results failed: the multiplexer is unreachable or errored."
    multiplexerStatus: ${rest_result.response.status}
  wrapper: false
  status: 502
  next: end

rest_conversion_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Converting the polled cross-gate search results failed in the mapping layer."
    mapperStatus: ${rest_json.response.status}
  wrapper: false
  status: 502
  next: end

# --- first call ---
local_search:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments"
    headers:
      Content-Type: "application/json"
    body:
      gateId: '[#OWN_GATE_ID]'
      criteria: ${incoming.body}
  result: local_result

check_local:
  switch:
    - condition: ${local_result.response.status == 0 || local_result.response.status >= 300}
      next: local_unavailable
    - condition: ${local_result.response.body.length > 0}
      next: respond_local
  next: criteria_to_xml

local_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Searching this gate's consignments failed in the data layer."
  status: 502
  wrapper: false
  next: end

# Local hit: authoritative for this gate's own consignments, return it and stop.
respond_local:
  return: ${local_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: false
  wrapper: false
  next: end

# No local match -> kick off the cross-gate broadcast and answer immediately.
criteria_to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${incoming.body}
  result: criteria_xml

# Non-blocking: the multiplexer registers the search, fans out to the other gates in the
# background, and returns at once. It never blocks this request on a peer gate's response —
# those are collected via the X-Poll path above. (Was a blocking POST /api/v1/first with a
# 65s timeout that returned HTTP 500 when no gate answered.)
start_broadcast:
  call: http.post
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/search/${requestId}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${criteria_xml.response.body}
    content_type: plaintext
  result: broadcast_started

respond_pending:
  return: ${local_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: true
  wrapper: false
