declaration:
  description: "Authority search for consignments — local-first, then broadcast. A local match is
    returned at once with x-poll-more:false (this gate is authoritative for its own
    consignments). With no local match the response is [] with x-poll-more:true and the other
    gates are queried in the background — collect their results by re-issuing the request with
    X-Request-Id + X-Poll and an empty body {}. Neither path ever blocks on a peer gate.
    Body: {operator, id}-shaped criteria object; criteria fields forwarded verbatim."

validate_input:
  switch:
    - condition: ${incoming.body == null}
      next: bad_request
  next: setup

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A JSON request body is required (send {} to poll for the rest of a prior search)."
  wrapper: false
  status: 400
  next: end

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}
    poll: ${incoming.headers['x-poll']}

check_poll:
  switch:
    - condition: ${!!requestId && !!poll}
      next: poll_remaining
  next: local_search

# --- poll path: collect the other gates' results for a prior search ---
poll_remaining:
  call: http.get
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/rest/${requestId}"
  result: rest_result

rest_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
    headers:
      x-request-id: ${requestId}
      content-type: "text/xml"
    body: ${rest_result.response.body}
    content_type: plaintext
  result: rest_json

respond_rest:
  return: ${rest_json.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: ${rest_result.response.headers['x-poll-more']}
  wrapper: false
  next: end

# --- first call ---
local_search:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments"
    headers:
      Content-Type: "application/json"
    body:
      gateId: '[#OWN_GATE_ID]'
      criteria: ${incoming.body}
  result: local_result

check_local:
  switch:
    - condition: ${local_result.response.body.length > 0}
      next: respond_local
  next: criteria_to_xml

# Local hit: authoritative for this gate's own consignments, return it and stop.
respond_local:
  return: ${local_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: false
  wrapper: false
  next: end

# No local match -> kick off the cross-gate broadcast and answer immediately.
criteria_to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
    body: ${incoming.body}
  result: criteria_xml

# Non-blocking: the multiplexer registers the search, fans out to the other gates in the
# background, and returns at once. It never blocks this request on a peer gate's response —
# those are collected via the X-Poll path above. (Was a blocking POST /api/v1/first with a
# 65s timeout that returned HTTP 500 when no gate answered.)
start_broadcast:
  call: http.post
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/search/${requestId}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
    body: ${criteria_xml.response.body}
    content_type: plaintext
  result: broadcast_started

respond_pending:
  return: ${local_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: true
  wrapper: false
