declaration:
  description: "Authority search for consignments — local first, then forward to other gates
    (gate-internal, X-Internal-Service-Token). Body: {operator, id}-shaped criteria object; {} is
    valid and, with X-Request-Id + X-Poll, means 'poll for the rest of a prior search'. Individual
    criteria fields are not enumerated here — forwarded verbatim."

validate_input:
  switch:
    - condition: ${incoming.body == null}
      next: bad_request
  next: setup

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A JSON request body is required (send {} to poll for the rest of a prior search)."
  wrapper: false
  status: 400
  next: end

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}
    poll: ${incoming.headers['x-poll']}

check_poll:
  switch:
    - condition: ${!!requestId && !!poll}
      next: poll_remaining
  next: local_search

poll_remaining:
  call: http.get
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/rest/${requestId}"
  result: rest_result

rest_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
    headers:
      x-request-id: ${requestId}
      content-type: "text/xml"
    body: ${rest_result.response.body}
    content_type: plaintext
  result: rest_json

respond_rest:
  return: ${rest_json.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: ${rest_result.response.headers['x-poll-more']}
  wrapper: false
  next: end

local_search:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignments"
    headers:
      Content-Type: "application/json"
    body:
      gateId: '[#OWN_GATE_ID]'
      criteria: ${incoming.body}
  result: local_result

check_local:
  switch:
    - condition: ${local_result.response.body.length > 0}
      next: respond_local
  next: criteria-to-xml

respond_local:
  return: ${local_result.response.body}
  headers:
    x-poll-more: false
  wrapper: false
  next: end

criteria-to-xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/request-to-xml"
    headers:
      x-request-id: ${requestId}
      content-type: "application/json"
    body: ${incoming.body}
  result: criteria_xml

forward_to_gates:
  call: http.post
  timeout: 65000
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/first/${requestId}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
    body: ${criteria_xml.response.body}
    content_type: plaintext
  result: gates_result

xml-to-json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
    headers:
      x-request-id: ${requestId}
      content-type: "text/xml"
    body: ${gates_result.response.body}
    content_type: plaintext
  result: first_result

respond_first:
  return: ${first_result.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: ${gates_result.response.headers['x-poll-more']}
  wrapper: false
