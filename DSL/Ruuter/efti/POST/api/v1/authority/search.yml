declaration:
  description: "Authority search for consignments — local first, then forward to other gates"

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}
  next: check_poll

check_poll:
  switch:
    - condition: ${incoming.body.poll == true && requestId}
      next: poll_remaining
  next: local_search

poll_remaining:
  call: http.get
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/rest/${requestId}"
  result: rest_result
  next: check_rest

check_rest:
  switch:
    - condition: ${!rest_result.response.body || rest_result.response.body == ''}
      next: respond_empty
  next: rest_to_json

rest_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
    headers:
      content-type: "text/xml"
    body: ${rest_result.response.body}
  result: rest_json
  next: respond_rest

respond_rest:
  return: ${rest_json.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: ${rest_result.response.headers['complete'] != 'true'}
  wrapper: false
  next: end

local_search:
  template: api/v1/consignments/search
  request_type: POST
  body:
    criteria: ${incoming.body}
    limit: 100
    offset: 0
  result: local_result
  next: check_local

check_local:
  switch:
    - condition: ${local_result.length > 0}
      next: respond_local
  next: criteria-to-xml

respond_local:
  return: ${local_result}
  wrapper: false
  next: end

criteria-to-xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/request-to-xml"
    headers:
      content-type: "application/json"
    body: ${incoming.body}
  result: criteria_xml
  next: forward_to_gates

forward_to_gates:
  call: http.post
  timeout: 65000
  args:
    url: "[#MULTIPLEXER_URL]/api/v1/first/${requestId}"
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
    body: ${criteria_xml.response.body}
    content_type: plaintext
  result: gates_result
  next: xml-to-json

xml-to-json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/search/response-to-json"
    headers:
      content-type: "text/xml"
    body: ${gates_result.response.body}
    content_type: plaintext
  result: first_result
  next: respond_first

respond_first:
  return: ${first_result}
  headers:
    content-type: "application/json"
    x-poll-more: true
  wrapper: false
  next: end

respond_empty:
  return: []
  wrapper: false
  next: end
