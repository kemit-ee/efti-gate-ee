declaration:
  description: "Authority sends a follow-up message to a Platform via the gate (gate-internal,
    X-Internal-Service-Token). Body: uil (object, required), referenceIds (array, required),
    message (string, required), files (array, optional — {fileName, base64Content, mimeType})."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.uil == null || incoming.body.referenceIds == null || incoming.body.message == null}
      next: bad_request
  next: check_gate

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "The request body must be a JSON object with 'uil' (object), 'referenceIds' (array) and 'message' (string)."
  wrapper: false
  status: 400
  next: end

check_gate:
  switch:
    - condition: ${incoming.body.uil.gateId != '[#OWN_GATE_ID]'}
      next: forward_to_remote_gate

call_local_platform:
  template: api/v1/follow-up-local
  request_type: "POST"
  # Ruuter #72 (h2ck.me H1, 0.9.11-rc): template: now runs the callee's guard against the
  # CHILD context — nothing is inherited from incoming.headers automatically. This route is
  # itself under efti/POST/api/v1/authority/.guard.yml (same X-Internal-Service-Token
  # credential as follow-up-local's own efti/POST/api/v1/.guard.yml), so forward it.
  headers:
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body: ${incoming.body}
  result: followup_response

respond_local:
  return: ${followup_response}
  wrapper: false
  status: 201
  next: end

forward_to_remote_gate:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/request-to-xml"
    headers:
      Content-Type: "application/json"
    body:
      uil: ${incoming.body.uil}
      referenceIds: ${incoming.body.referenceIds}
      message: ${incoming.body.message}
      files: ${incoming.body.files ?? []}
  result: followup_xml

send_via_edelivery:
  call: http.post
  timeout: 65000
  args:
    url: "[#EDELIVERY_URL]/api/v1/send/${incoming.body.uil.gateId}"
    headers:
      Content-Type: "text/xml"
      x-request-id: ${incoming.headers['x-request-id'] ?? ''}
    body: ${followup_xml.response.body}
    content_type: plaintext
  result: edelivery_response

check_edelivery_response:
  switch:
    - condition: ${edelivery_response.response.status != 200}
      next: edelivery_error

response_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/response-to-json"
    headers:
      Content-Type: "text/xml"
    body: ${edelivery_response.response.body}
    content_type: plaintext
  result: remote_json

respond_remote:
  return: ${remote_json.response.body}
  headers:
    Content-Type: "application/json"
  wrapper: false
  status: 201
  next: end

edelivery_error:
  return:
    error: "Remote gate follow-up failed"
    detail: ${edelivery_response.response.body}
  wrapper: false
  status: ${edelivery_response.response.status}
