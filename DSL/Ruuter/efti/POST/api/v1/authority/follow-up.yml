declaration:
  description: "Authority sends a follow-up message to a Platform via the gate (TARA JWT)"

check_gate:
  switch:
    - condition: ${incoming.body.uil.gateId != '[#OWN_GATE_ID]'}
      next: forward_to_remote_gate

call_local_platform:
  template: api/v1/follow-up-local
  request_type: "POST"
  body: ${incoming.body}
  result: followup_response

respond_local:
  return: ${followup_response}
  wrapper: false
  status: 201
  next: end

forward_to_remote_gate:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/request-to-xml"
    headers:
      Content-Type: "application/json"
    body:
      uil: ${incoming.body.uil}
      referenceIds: ${incoming.body.referenceIds}
      message: ${incoming.body.message}
      files: ${incoming.body.files ?? []}
  result: followup_xml

send_via_edelivery:
  call: http.post
  timeout: 65000
  args:
    url: "[#EDELIVERY_URL]/api/v1/send/${incoming.body.uil.gateId}"
    headers:
      Content-Type: "text/xml"
      x-request-id: ${incoming.headers['x-request-id'] ?? ''}
    body: ${followup_xml.response.body}
    content_type: plaintext
  result: edelivery_response

check_edelivery_response:
  switch:
    - condition: ${edelivery_response.response.status != 200}
      next: edelivery_error

response_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/followup/response-to-json"
    headers:
      Content-Type: "text/xml"
    body: ${edelivery_response.response.body}
    content_type: plaintext
  result: remote_json

respond_remote:
  return: ${remote_json.response.body}
  headers:
    Content-Type: "application/json"
  wrapper: false
  status: 201
  next: end

edelivery_error:
  return:
    error: "Remote gate follow-up failed"
    detail: ${edelivery_response.response.body}
  wrapper: false
  status: ${edelivery_response.response.status}
