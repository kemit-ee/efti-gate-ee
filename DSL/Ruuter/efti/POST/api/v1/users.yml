check_duplicate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_tara_sub_exists"
    headers:
      Content-Type: "application/json"
    body:
      taraSub: "${incoming.body.taraSub}"
  result: dup_result
  next: check_dup_result

check_dup_result:
  switch:
    - condition: ${dup_result.response.body != null && dup_result.response.body.length > 0}
      next: conflict
  next: create_user

create_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_user"
    headers:
      Content-Type: "application/json"
    body:
      taraSub: "${incoming.body.taraSub}"
      email: "${incoming.body.email}"
      name: "${incoming.body.name}"
  result: insert_result
  next: check_insert

check_insert:
  switch:
    - condition: ${insert_result.response.body == null || insert_result.response.body.length == 0}
      next: insert_failed
  next: verify_user

verify_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${insert_result.response.body[0].id}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body}
  status: 201
  next: end

conflict:
  return: '{"error": "Conflict", "detail": "tara_sub already exists on an active user"}'
  status: 409
  next: end

insert_failed:
  return: '{"error": "Failed to create user"}'
  status: 500
  next: end

verify_failed:
  return: '{"error": "User created but could not be verified"}'
  status: 500
  next: end
