check_admin:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
    body: {}
  result: admin_check
  next: verify_admin

verify_admin:
  switch:
    - condition: ${admin_check.response.status == 200}
      next: check_duplicate
  next: admin_fail

admin_fail:
  return: ${admin_check.response.body}
  status: ${admin_check.response.status}
  wrapper: false
  next: end

check_duplicate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_tara_sub_exists"
    headers:
      Content-Type: "application/json"
    body:
      taraSub: "${incoming.body.taraSub}"
  result: dup_result
  next: check_dup_result

check_dup_result:
  switch:
    - condition: ${dup_result.response.body != null && dup_result.response.body.length > 0}
      next: conflict
  next: create_user

create_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_user"
    headers:
      Content-Type: "application/json"
    body:
      taraSub: "${incoming.body.taraSub}"
      name: "${incoming.body.name}"
      roles: "${incoming.body.roles ?? []}"
  result: insert_result
  next: check_insert

check_insert:
  switch:
    - condition: ${insert_result.response.body == null || insert_result.response.body[0] == null || insert_result.response.body[0].id == null}
      next: insert_failed
  next: verify_user

verify_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${insert_result.response.body[0].id}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

conflict:
  return: {"error": "Conflict", "detail": "tara_sub already exists on an active user"}
  status: 409
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create user"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "User created but could not be verified"}
  status: 500
  wrapper: false
  next: end
