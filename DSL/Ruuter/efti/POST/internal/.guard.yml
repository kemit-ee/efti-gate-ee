# The /efti/internal/* routes (check-user-authority, check-admin-authority) are only ever
# called by this Ruuter's own .guard files over loopback. They are not routed by any
# reverse proxy / ingress (docker/ui/nginx.conf proxies only /admin /auth /platforms /tim
# /services/msh /tara; ruuter has no published port and is not on the public proxy network)
# and reachability is further governed by `internal_requests` in ruuter.yaml — so the
# routes are unreachable from outside the container network. This guard exists only so the
# directory has an explicit guard file; it does no credential check.
guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end
