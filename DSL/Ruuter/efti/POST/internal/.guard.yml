# The /efti/internal/* routes (check-user-authority, check-admin-authority) are only ever
# called by this Ruuter's own .guard files over loopback. This guard is a second line of
# defence behind network isolation and internal_requests: the caller must present the
# shared internal secret in x-viljus-knows-a-secret. A plain string compare is enough —
# the route is never reachable from outside a correctly deployed gate.
check_secret:
  switch:
    - condition: ${incoming.headers == null || incoming.headers['x-viljus-knows-a-secret'] != '[#INTERNAL_SECRET]'}
      next: guard_fail
  next: guard_success

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return:
    type: "https://api.efti.ee/errors/forbidden"
    title: "Forbidden"
    status: 403
    detail: "Internal endpoint."
  status: 403
  wrapper: false
  next: end
