declaration:
  call: declare
  version: "0.1"
  description: "Resolve the caller from an 'Authorization: Bearer <jwt>' header — validate the token with TIM, then load the users row by tara_sub. Returns the users row, or the string \"false\" on any failure."
  method: post
  accepts: json
  returns: json
  namespace: internal
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"

# Shared authentication logic, called over Ruuter's own loopback by the .guard files and
# by each endpoint that needs the caller's row.
#
# Why an internal HTTP route rather than a `template:` step: the Rust engine
# (ruuter-on-rust v0.8.1-rc.3) parses `template:` but cannot execute it — the step aborts
# with "template step invoked but the engine has no DSL tree attached", and any DSL
# containing one stops serving entirely (404). Verified by bisection: an identical DSL
# without a template step returns 200. Reachability is governed by
# `internal_requests` in ruuter.yaml.
#
# Single sentinel for every failure mode: the literal string "false". Callers only ever
# compare against that, so a new failure branch here never needs a matching change at
# every call site.

check_for_bearer:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.authorization == null || !incoming.headers.authorization.toLowerCase().startsWith("bearer ")}
      next: return_false
  next: extract_token

extract_token:
  assign:
    token: ${incoming.headers.authorization.substring(7)}
  next: check_token

check_token:
  switch:
    - condition: ${token != null && token != ''}
      next: validate_token
  next: return_false

validate_token:
  call: http.get
  args:
    url: "[#TIM_URL]/jwt/userinfo"
    headers:
      # TIM reads the token only from its own cookie. Re-frame the Bearer value here so
      # the gate's wire contract stays Bearer-only, per
      # docs/architecture/user-interfaces/README.md (no cookie, no CSRF token).
      cookie: "eftiJwtCookie=${token}"
  result: token_info
  next: check_token_info

check_token_info:
  switch:
    - condition: ${token_info.response.status >= 200 && token_info.response.status < 300}
      next: check_tara_sub
  next: return_false

check_tara_sub:
  switch:
    - condition: ${token_info.response.body.userinfo.claims.personalCode != '' && token_info.response.body.userinfo.claims.personalCode != null}
      next: lookup_user
  next: return_false

# The one DB lookup on the authentication path (docs/specs/permissions-matrix.md §6).
# Authorisation state is read from this row, never from the token's claims — the gate's
# snapshot can change after a token was minted, so DB-side state wins. The query also
# enforces the soft-delete, current-tara_sub and revocation checks, so 0 rows means
# "reject" for any of those reasons.
lookup_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_tara_sub"
    headers:
      Content-Type: application/json
    body:
      tara_sub: ${token_info.response.body.userinfo.claims.personalCode}
  result: user_res
  next: check_user_found

check_user_found:
  switch:
    - condition: ${user_res.response.body.length > 0}
      next: return_user
  next: return_false

return_user:
  return: ${user_res.response.body[0]}
  wrapper: false
  next: end

# Covers: no/!Bearer header, empty token, TIM rejected the token, no personalCode claim,
# a valid TARA identity with no users row (the gate does not auto-provision), a
# soft-deleted user, a superseded tara_sub, and a token predating token_revoked_at.
return_false:
  return: "false"
  wrapper: false
  next: end
