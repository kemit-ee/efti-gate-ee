declaration:
  call: declare
  version: "0.1"
  description: "Resolve the caller from an 'Authorization: Bearer <jwt>' header. Validates the
    token with TIM, checks the user is active and the token is not broadcast-revoked, then
    loads the users row by tara_sub. Returns 200 + user row on success, 401 on any failure."
  method: post
  namespace: internal
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"
      - field: x-forwarded-for
        type: string
        description: "Original client address, forwarded by the calling .guard"
      - field: x-request-id
        type: string
        description: "Correlation id, forwarded by the calling .guard"

# Shared authentication logic called over Ruuter's loopback by the .guard files.
# Reachability is governed by network isolation + `internal_requests` (see
# DSL/Ruuter/efti/POST/internal/.guard.yml); the calling guards forward
# x-forwarded-for / x-request-id so this line has a bit of context on who asked.
#
# Why an internal HTTP route rather than a `template:` step: the Rust engine
# (ruuter-on-rust v0.8.1-rc.3) parses `template:` but cannot execute it — the step aborts
# with "template step invoked but the engine has no DSL tree attached". Reachability is
# governed by `internal_requests` in ruuter.yaml.

log_context:
  log: "internal/check-user-authority rid=${incoming.headers['x-request-id'] ?? '-'} from=${incoming.headers['x-forwarded-for'] ?? '-'}"
  next: check_for_bearer

check_for_bearer:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.authorization == null || !incoming.headers.authorization.toLowerCase().startsWith("bearer ")}
      next: unauthorized
  next: extract_token

extract_token:
  assign:
    token: ${incoming.headers.authorization.substring(7)}
  next: check_token

check_token:
  switch:
    - condition: ${token != null && token != ''}
      next: validate_token
  next: unauthorized

validate_token:
  call: http.get
  args:
    url: "[#TIM_URL]/jwt/userinfo"
    headers:
      # TIM reads the token from its own cookie. Re-frame the Bearer value here so
      # the gate's wire contract stays Bearer-only.
      cookie: "eftiJwtCookie=${token}"
  result: token_info
  next: check_token_info

check_token_info:
  switch:
    - condition: ${token_info.response.status >= 200 && token_info.response.status < 300}
      next: check_tara_sub
  next: unauthorized

check_tara_sub:
  switch:
    - condition: ${token_info.response.body.userinfo.claims.personalCode != '' && token_info.response.body.userinfo.claims.personalCode != null}
      next: lookup_user
  next: unauthorized

# DB lookup: validates is_active, token_revoked_at (broadcast revocation), and returns
# the is_admin flag. 0 rows → reject for any reason.
lookup_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_user_auth"
    headers:
      Content-Type: application/json
    body:
      tara_sub: ${token_info.response.body.userinfo.claims.personalCode}
      token_issued_at: ${token_info.response.body.userinfo.issued_at}
  result: user_res
  next: check_user_found

check_user_found:
  switch:
    - condition: ${user_res.response.body.length > 0}
      next: return_user
  next: unauthorized

return_user:
  return: ${user_res.response.body[0]}
  status: 200
  wrapper: false
  next: end

# Covers: no/!Bearer header, empty token, TIM rejected the token, no personalCode claim,
# a valid TARA identity with no users row, a soft-deleted user, and a token predating
# token_revoked_at (broadcast revocation).
unauthorized:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    title: "Unauthorized"
    status: 401
    detail: "Token is missing, invalid, expired, or the user has no active gate account."
  status: 401
  wrapper: false
  next: end
