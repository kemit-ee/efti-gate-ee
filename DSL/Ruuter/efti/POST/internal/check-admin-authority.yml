declaration:
  call: declare
  version: "0.1"
  description: "Validates the caller's TARA JWT and returns 200 + user row on success,
    401 if not authenticated. Identical to check-user-authority — the system has a single
    admin user, so every authenticated user has full access."
  method: post
  namespace: internal
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"
      - field: x-forwarded-for
        type: string
        description: "Original client address, forwarded by the calling .guard"
      - field: x-request-id
        type: string
        description: "Correlation id, forwarded by the calling .guard"

# Reachability is governed by network isolation + `internal_requests` (see
# DSL/Ruuter/efti/POST/internal/.guard.yml); the calling guards forward
# x-forwarded-for / x-request-id for context.
log_context:
  log: "internal/check-admin-authority rid=${incoming.headers['x-request-id'] ?? '-'} from=${incoming.headers['x-forwarded-for'] ?? '-'}"


check_for_bearer:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.authorization == null || !incoming.headers.authorization.toLowerCase().startsWith("bearer ")}
      next: unauthorized


extract_token:
  assign:
    token: ${incoming.headers.authorization.substring(7)}

check_token:
  switch:
    - condition: ${token != null && token != ''}
      next: validate_token
  next: unauthorized

validate_token:
  call: http.get
  args:
    url: "[#TIM_URL]/jwt/userinfo"
    headers:
      cookie: "eftiJwtCookie=${token}"
  result: token_info

check_token_info:
  switch:
    - condition: ${token_info.response.status >= 200 && token_info.response.status < 300}
      next: check_tara_sub
  next: unauthorized

check_tara_sub:
  switch:
    - condition: ${token_info.response.body.userinfo.claims.personalCode != '' && token_info.response.body.userinfo.claims.personalCode != null}
      next: lookup_user
  next: unauthorized

lookup_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_user_auth"
    headers:
      Content-Type: application/json
    body:
      tara_sub: ${token_info.response.body.userinfo.claims.personalCode}
      token_issued_at: ${token_info.response.body.userinfo.issued_at}
  result: user_res

check_user_found:
  switch:
    - condition: ${user_res.response.body.length > 0}
      next: return_user
  next: unauthorized

return_user:
  return: ${user_res.response.body[0]}
  status: 200
  wrapper: false
  next: end

unauthorized:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    title: "Unauthorized"
    status: 401
    detail: "Token is missing, invalid, expired, or the user has no active gate account."
  status: 401
  wrapper: false
  next: end

forbidden:
  return:
    type: "https://api.efti.ee/errors/forbidden"
    title: "Forbidden"
    status: 403
    detail: "This action requires the ADMIN role."
  status: 403
  wrapper: false
