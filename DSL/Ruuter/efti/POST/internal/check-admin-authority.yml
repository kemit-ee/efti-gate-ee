declaration:
  call: declare
  version: "0.1"
  description: "Like check-user-authority but additionally requires the ADMIN role.
    Returns 200 + user row on success, 401 if not authenticated, 403 if authenticated
    but not ADMIN."
  method: post
  namespace: internal
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"

check_for_bearer:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.authorization == null || !incoming.headers.authorization.toLowerCase().startsWith("bearer ")}
      next: unauthorized
  next: extract_token

extract_token:
  assign:
    token: ${incoming.headers.authorization.substring(7)}
  next: check_token

check_token:
  switch:
    - condition: ${token != null && token != ''}
      next: validate_token
  next: unauthorized

validate_token:
  call: http.get
  args:
    url: "[#TIM_URL]/jwt/userinfo"
    headers:
      cookie: "eftiJwtCookie=${token}"
  result: token_info
  next: check_token_info

check_token_info:
  switch:
    - condition: ${token_info.response.status >= 200 && token_info.response.status < 300}
      next: check_tara_sub
  next: unauthorized

check_tara_sub:
  switch:
    - condition: ${token_info.response.body.userinfo.claims.personalCode != '' && token_info.response.body.userinfo.claims.personalCode != null}
      next: lookup_user
  next: unauthorized

lookup_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_user_auth"
    headers:
      Content-Type: application/json
    body:
      tara_sub: ${token_info.response.body.userinfo.claims.personalCode}
      token_issued_at: ${token_info.response.body.userinfo.issued_at}
  result: user_res
  next: check_user_found

check_user_found:
  switch:
    - condition: ${user_res.response.body.length > 0}
      next: check_admin_role
  next: unauthorized

check_admin_role:
  switch:
    - condition: ${user_res.response.body[0].is_admin == true}
      next: return_user
  next: forbidden

return_user:
  return: ${user_res.response.body[0]}
  status: 200
  wrapper: false
  next: end

unauthorized:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/unauthorized","title":"Unauthorized","status":401,"detail":"Token is missing, invalid, expired, or the user has no active gate account."}')}
  status: 401
  wrapper: false
  next: end

forbidden:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden","title":"Forbidden","status":403,"detail":"This action requires the ADMIN role."}')}
  status: 403
  wrapper: false
  next: end
