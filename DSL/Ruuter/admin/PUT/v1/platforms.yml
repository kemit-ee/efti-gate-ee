declaration:
  description: "Replace a platform (admin, TARA JWT). Path: platformId. Body: baseUrl (required);
    headers (object, optional), eDeliveryCert, tlsCert, status (optional)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.baseUrl == null}
      next: bad_request
  next: update_platform

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required field: baseUrl."
  wrapper: false
  status: 400
  next: end

update_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_platform"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      baseUrl: "${incoming.body.baseUrl}"
      headers: "${incoming.body.headers}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: update_result
  next: check_update

# update_platform RETURNS the new row (same columns as get_platform_by_id); an empty
# body means no such platform. No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.status == 0 || update_result.response.status >= 400 || !update_result.response.body.length}
      next: update_failed

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never
# fails or rolls back the platform write above; its result is intentionally unchecked.
write_audit_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "platform.update"
      resource: "platform"
      resourceId: "${incoming.params.pathParams[0]}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ platform_id: incoming.params.pathParams[0], before: null, after: update_result.response.body[0] })}"
  result: audit_result

publish_platform_change:
  call: http.post
  args:
    url: "[#PUBSUB_URL]/api/v1/publish"
    headers:
      Content-Type: "application/json"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body:
      name: "platform-changes"
      data:
        event: "updated"
  result: publish_result

respond:
  return: ${update_result.response.body[0]}
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update platform"}
  status: 500
  wrapper: false
  next: end
