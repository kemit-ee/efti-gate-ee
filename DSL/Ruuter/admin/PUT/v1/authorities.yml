update_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      name: "${incoming.body.name}"
      registryCode: "${incoming.body.registryCode}"
      subsets: "${JSON.stringify(incoming.body.subsets ?? [])}"
      status: "${incoming.body.status}"
  result: update_result
  next: check_update

check_update:
  switch:
    - condition: ${update_result.response.body == null || update_result.response.body.length == 0}
      next: update_failed
  next: verify_authority

verify_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body[0]}
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update authority"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Authority updated but could not be verified"}
  status: 500
  wrapper: false
  next: end
