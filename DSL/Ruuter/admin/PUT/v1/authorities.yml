declaration:
  description: "Replace a competent authority (admin, TARA JWT). Path: authorityId. Body: name,
    registryCode (required); subsets (array, optional — defaults []); status (optional)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.name == null || incoming.body.registryCode == null}
      next: bad_request
  next: update_authority

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: name, registryCode."
  wrapper: false
  status: 400
  next: end

update_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      name: "${incoming.body.name}"
      registryCode: "${incoming.body.registryCode}"
      subsets: "${JSON.stringify(incoming.body.subsets ?? [])}"
      status: "${incoming.body.status}"
  result: update_result
  next: check_update

# update_authority RETURNS the new row (same columns as get_authority_by_id); an empty
# body means no such authority. No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.status == 0 || update_result.response.status >= 400 || !update_result.response.body.length}
      next: update_failed
  next: write_audit_log

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never
# fails or rolls back the authority write above; its result is intentionally unchecked.
write_audit_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "authority.update"
      resource: "authority"
      resourceId: "${incoming.params.pathParams[0]}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ authority_id: incoming.params.pathParams[0], before: null, after: update_result.response.body[0] })}"
  result: audit_result

respond:
  return: ${update_result.response.body[0]}
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update authority"}
  status: 500
  wrapper: false
  next: end
