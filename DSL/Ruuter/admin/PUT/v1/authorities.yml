update_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      name: "${incoming.body.name}"
      registryCode: "${incoming.body.registryCode}"
      subsets: "${JSON.stringify(incoming.body.subsets ?? [])}"
      status: "${incoming.body.status}"
  result: update_result
  next: check_update

# update_authority RETURNS the new row (same columns as get_authority_by_id); an empty
# body means no such authority. No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.status >= 400 || !update_result.response.body?.length}
      next: update_failed
  next: respond

respond:
  return: ${update_result.response.body?.[0]}
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update authority"}
  status: 500
  wrapper: false
  next: end
