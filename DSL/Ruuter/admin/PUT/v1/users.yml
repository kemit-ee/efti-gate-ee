# Admin is enforced by admin/.guard.yml; this handler starts straight at the lookup.
check_exists:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: exists_result
  next: check_found

check_found:
  switch:
    - condition: ${exists_result.response.body == null || exists_result.response.body.length == 0}
      next: not_found
  next: update_user

update_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_user"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      taraSub: "${incoming.body.taraSub}"
      name: "${incoming.body.name}"
      isAdmin: ${incoming.body.isAdmin ?? false}
      isAuthority: ${incoming.body.isAuthority ?? false}
  result: update_result
  next: check_update

# update_user RETURNS the new row (column list matches get_user_by_id). No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.body == null || update_result.response.body.length == 0}
      next: update_failed
  next: respond

respond:
  wrapper: false
  return: ${update_result.response.body[0]}
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update user"}
  status: 500
  wrapper: false
  next: end
