declaration:
  description: "Replace a user (admin, TARA JWT). Path: userId. Body: taraSub, name (both required)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.taraSub == null || incoming.body.name == null}
      next: bad_request
  next: check_exists

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: taraSub, name."
  wrapper: false
  status: 400
  next: end

# Admin is enforced by admin/.guard.yml; this handler starts straight at the lookup.
check_exists:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: exists_result
  next: check_found

check_found:
  switch:
    - condition: ${exists_result.response.status == 0 || exists_result.response.status >= 300}
      next: upstream_unavailable
    - condition: ${!exists_result.response.body.length}
      next: not_found
  next: update_user

update_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_user"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      taraSub: "${incoming.body.taraSub}"
      name: "${incoming.body.name}"
  result: update_result
  next: check_update

# update_user RETURNS the new row (column list matches get_user_by_id). No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.status == 0 || update_result.response.status >= 400 || !update_result.response.body.length}
      next: update_failed
  next: write_audit_log

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never
# fails or rolls back the user write above; its result is intentionally unchecked.
# secret_hash is never copied into the audit row (§5.1) — update_user's RETURNING
# clause never includes it, so update_result.response.body[0] is already safe to log whole.
write_audit_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "user.update"
      resource: "user"
      resourceId: "${incoming.params.pathParams[0]}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ user_id: incoming.params.pathParams[0], before: exists_result.response.body[0], after: update_result.response.body[0] })}"
  result: audit_result

respond:
  wrapper: false
  return: ${update_result.response.body[0]}
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update user"}
  status: 500
  wrapper: false
  next: end

upstream_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
  next: end
