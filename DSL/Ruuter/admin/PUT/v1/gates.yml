declaration:
  description: "Replace a gate (admin, TARA JWT). Path: gateId. Body: countryCode, eDeliveryUrl
    (required); eDeliveryCert, tlsCert, status (optional)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.countryCode == null || incoming.body.eDeliveryUrl == null}
      next: bad_request
  next: update_gate

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: countryCode, eDeliveryUrl."
  wrapper: false
  status: 400
  next: end

update_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      countryCode: "${incoming.body.countryCode}"
      eDeliveryUrl: "${incoming.body.eDeliveryUrl}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: update_result
  next: check_update

# update_gate RETURNS the new row (same columns as get_gate_by_id); an empty body means
# no such gate. No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.status == 0 || update_result.response.status >= 400 || !update_result.response.body.length}
      next: update_failed

publish_gate_change:
  call: http.post
  args:
    url: "[#PUBSUB_URL]/api/v1/publish"
    headers:
      Content-Type: "application/json"
    body:
      name: "gate-changes"
      data:
        event: "updated"
  result: publish_result

respond:
  return: ${update_result.response.body[0]}
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update gate"}
  status: 500
  wrapper: false
  next: end
