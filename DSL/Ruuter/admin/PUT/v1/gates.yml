update_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      countryCode: "${incoming.body.countryCode}"
      eDeliveryUrl: "${incoming.body.eDeliveryUrl}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: update_result
  next: check_update

# update_gate RETURNS the new row (same columns as get_gate_by_id); an empty body means
# no such gate. No re-fetch needed.
check_update:
  switch:
    - condition: ${update_result.response.body == null || update_result.response.body.length == 0}
      next: update_failed
  next: respond

respond:
  return: ${update_result.response.body[0]}
  wrapper: false
  next: end

update_failed:
  return: {"error": "Failed to update gate"}
  status: 500
  wrapper: false
  next: end
