declaration:
  description: "Soft-delete a gate (admin, TARA JWT). Path: gateId. No body."

delete_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: delete_result

# soft_delete_gate RETURNS the tombstone row (row_id, id, status, created_at); an empty
# body means no such gate. No re-fetch needed — the RETURNING already proves the write.
check_delete:
  switch:
    - condition: ${delete_result.response.status >= 400 || delete_result.response.body[0]?.status != 'DELETED'}
      next: delete_failed
    - condition: ${!delete_result.response.body.length}
      next: not_found

publish_gate_change:
  call: http.post
  args:
    url: "[#PUBSUB_URL]/api/v1/publish"
    headers:
      Content-Type: "application/json"
    body:
      name: "gate-changes"
      data:
        event: "deleted"
  result: publish_result

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

delete_failed:
  return: {"error": "Gate deletion could not be verified"}
  status: 500
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
