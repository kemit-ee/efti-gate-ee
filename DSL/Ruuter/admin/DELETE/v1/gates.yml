delete_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: delete_result
  next: check_delete

# soft_delete_gate RETURNS the tombstone row (row_id, id, status, created_at); an empty
# body means no such gate. No re-fetch needed — the RETURNING already proves the write.
check_delete:
  switch:
    - condition: ${delete_result.response.body == null || delete_result.response.body.length == 0}
      next: not_found
    - condition: ${delete_result.response.body[0].status != 'DELETED'}
      next: delete_failed
  next: respond

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

delete_failed:
  return: {"error": "Gate deletion could not be verified"}
  status: 500
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end
