declaration:
  description: "Soft-delete a competent authority (admin, TARA JWT). Path: authorityId. No body."

delete_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: delete_result

# soft_delete_authority RETURNS the tombstone row (row_id, id, status, created_at); an empty
# body means no such authority. No re-fetch needed — the RETURNING already proves the write.
# The empty-body check MUST come before the status check: for a missing authority body[0] is
# undefined, so `body[0]?.status != 'DELETED'` is true and the row would 500 as "not verified"
# instead of 404.
check_delete:
  switch:
    - condition: ${delete_result.response.status == 0 || delete_result.response.status >= 400}
      next: delete_failed
    - condition: ${!delete_result.response.body.length}
      next: not_found
    - condition: ${delete_result.response.body[0]?.status != 'DELETED'}
      next: delete_failed

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never
# fails or rolls back the authority write above; its result is intentionally unchecked.
write_audit_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "authority.delete"
      resource: "authority"
      resourceId: "${incoming.params.pathParams[0]}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ authority_id: incoming.params.pathParams[0], before: null, after: null })}"
  result: audit_result

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

delete_failed:
  return: {"error": "Authority deletion could not be verified"}
  status: 500
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
