# Admin is enforced by admin/.guard.yml, which also exposes the caller row as ${caller}.
check_not_self:
  switch:
    - condition: ${caller.id == incoming.params.pathParams[0]}
      next: delete_self_error
  next: delete_user

delete_self_error:
  return: '{"error": "BadRequest", "detail": "Admin cannot delete their own account"}'
  status: 400
  wrapper: false
  next: end

delete_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_user"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: delete_result
  next: check_delete

check_delete:
  switch:
    - condition: ${delete_result.response.body == null || delete_result.response.body.length == 0}
      next: delete_failed
  next: verify_user

verify_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_user_by_id"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: not_found
    - condition: ${verify_result.response.body[0].isUserActive != false}
      next: verify_failed
  next: respond

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

delete_failed:
  return: {"error": "Failed to delete user"}
  status: 500
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end

verify_failed:
  return: {"error": "User deletion could not be verified"}
  status: 500
  wrapper: false
  next: end
