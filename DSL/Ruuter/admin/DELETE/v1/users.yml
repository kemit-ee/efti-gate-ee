# Admin is enforced by admin/.guard.yml, which also exposes the caller row as ${caller}.
check_not_self:
  switch:
    - condition: ${caller.id == incoming.params.pathParams[0]}
      next: delete_self_error
  next: delete_user

delete_self_error:
  return: '{"error": "BadRequest", "detail": "Admin cannot delete their own account"}'
  status: 400
  wrapper: false
  next: end

delete_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_user"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${incoming.params.pathParams[0]}"
  result: delete_result
  next: check_delete

# soft_delete_user RETURNS the tombstone row (row_id, id, is_user_active, created_at);
# an empty body means no such user, is_user_active must be false. No re-fetch needed.
check_delete:
  switch:
    - condition: ${delete_result.response.status >= 400 || delete_result.response.body?.[0]?.isUserActive != false}
      next: delete_failed
    - condition: ${!delete_result.response.body?.length}
      next: not_found
  next: respond

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

delete_failed:
  return: {"error": "User deletion could not be verified"}
  status: 500
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end
