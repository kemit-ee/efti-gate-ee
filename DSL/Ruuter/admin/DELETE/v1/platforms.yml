delete_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/soft_delete_platform"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: delete_result

# soft_delete_platform RETURNS the tombstone row (row_id, id, status, created_at); an empty
# body means no such platform. No re-fetch needed — the RETURNING already proves the write.
check_delete:
  switch:
    - condition: ${delete_result.response.status >= 400 || delete_result.response.body[0]?.status != 'DELETED'}
      next: delete_failed
    - condition: ${!delete_result.response.body.length}
      next: not_found

respond:
  return: ""
  status: 204
  wrapper: false
  next: end

delete_failed:
  return: {"error": "Platform deletion could not be verified"}
  status: 500
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
