declaration:
  description: "Full version history of one consignment dataset (admin, TARA JWT) — the live rows
    plus the rows already swept to the separate archive DB, newest first, metadata only (no xml).
    Query: datasetId (required), limit, offset (optional; each side is capped at 1000, default 100). No body."
  internal: false
  returns:
    - field: datasetId
      type: string
    - field: live
      type: array
    - field: archived
      type: array
  additive: true
  allowlist:
    params:
      - field: datasetId
      - field: limit
      - field: offset

validate_input:
  switch:
    - condition: ${incoming.params.datasetId == null || incoming.params.datasetId == ''}
      next: bad_request
  next: live_history

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Query parameter datasetId is required."
  wrapper: false
  status: 400
  next: end

live_history:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_history"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: ${incoming.params.datasetId}
      limit: "${incoming.params.limit}"
      offset: "${incoming.params.offset}"
  result: live_result

archived_history:
  call: http.post
  args:
    url: "[#RESQL_URL]/archive/get_archived_consignments"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: ${incoming.params.datasetId}
      limit: "${incoming.params.limit}"
      offset: "${incoming.params.offset}"
  result: archived_result

respond:
  return:
    datasetId: ${incoming.params.datasetId}
    live: ${live_result.response.body}
    archived: ${archived_result.response.body}
  headers:
    content-type: "application/json"
  wrapper: false
