declaration:
  description: "Get this gate's own record, resolved from OWN_GATE_ID (admin, TARA JWT). No inputs.
    Data comes from the ADR-015 `registry` service (the git folder registry/gates/*.json), not
    from a ReSql read model."

fetch_own_gate:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/gates/${('[#OWN_GATE_ID]').toLowerCase()}.json"
  result: result
  next: check_found

check_found:
  switch:
    - condition: ${result.response.status == 0}
      next: upstream_unavailable
    - condition: ${result.response.status == 404}
      next: not_found
    - condition: ${result.response.status != 200 || !result.response.body || result.response.body.id == null}
      next: upstream_unavailable
  next: respond

respond:
  return: ${result.response.body}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false

upstream_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
  next: end
