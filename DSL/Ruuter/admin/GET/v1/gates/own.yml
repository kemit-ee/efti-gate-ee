fetch_own_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_gate_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "[#OWN_GATE_ID]"
  result: result
  next: check_found

check_found:
  switch:
    - condition: ${!result.response.body.length}
      next: not_found
  next: respond

respond:
  return: ${result.response.body[0]}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false
  next: end
