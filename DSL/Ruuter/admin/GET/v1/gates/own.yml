declaration:
  description: "Get this gate's own record, resolved from OWN_GATE_ID (admin, TARA JWT). No inputs.
    Data comes from the `registry` service (build-time JSON generated from
    registry/gates/*.yml - ADR-015/ADR-016), not from a ReSql read model."
  internal: false
  returns:
    - field: id
      type: string
    - field: countryCode
      type: string
    - field: eDeliveryUrl
      type: string
    - field: eDeliveryCert
      type: string
    - field: tlsCert
      type: string
    - field: status
      type: string

fetch_own_gate:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/gates/${('[#OWN_GATE_ID]').toLowerCase()}.json"
  result: result
  next: check_found

check_found:
  switch:
    - condition: ${result.response.status == 0}
      next: upstream_unavailable
    - condition: ${result.response.status == 404}
      next: not_found
    - condition: ${result.response.status != 200 || !result.response.body || result.response.body.id == null}
      next: upstream_unavailable
  next: respond

respond:
  return: ${result.response.body}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false

upstream_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
  next: end
