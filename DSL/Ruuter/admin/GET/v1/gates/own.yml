declaration:
  description: "Get this gate's own record, resolved from OWN_GATE_ID (admin, TARA JWT). No inputs."

fetch_own_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_gate_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "[#OWN_GATE_ID]"
  result: result

check_found:
  switch:
    - condition: ${result.response.status == 0}
      next: upstream_unavailable
    - condition: ${!result.response.body.length}
      next: not_found

respond:
  return: ${result.response.body[0]}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false

upstream_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
  next: end
