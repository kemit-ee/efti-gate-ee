declaration:
  description: "List authorities, or get one by id (admin, TARA JWT). Path: authorityId (optional —
    absent lists). Query: limit, offset (optional). No body."

route:
  switch:
    - condition: ${incoming.params.pathParams[0] != null}
      next: fetch_single
  next: fetch_list

fetch_single:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: single_result

check_single:
  switch:
    - condition: ${single_result.response.status == 0 || single_result.response.status >= 300}
      next: upstream_unavailable
    - condition: ${!single_result.response.body.length}
      next: not_found

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never blocks
# the read response; its result is intentionally unchecked. Records that the row was
# viewed, not the row content itself.
write_audit_log_single:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "authority.read"
      resource: "authority"
      resourceId: "${incoming.params.pathParams[0]}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ authority_id: incoming.params.pathParams[0] })}"
  result: audit_result

respond_single:
  return: ${single_result.response.body[0]}
  wrapper: false
  next: end

fetch_list:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authorities"
    headers:
      Content-Type: "application/json"
    body:
      limit: "${incoming.params.limit}"
      offset: "${incoming.params.offset}"
  result: list_result

check_list:
  switch:
    - condition: ${list_result.response.status == 0 || list_result.response.status >= 300}
      next: upstream_unavailable

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never blocks
# the read response; its result is intentionally unchecked. Records that a list was
# browsed (count + filter), not the listed rows themselves.
write_audit_log_list:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "authority.list"
      resource: "authority"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ count: list_result.response.body.length, limit: incoming.params.limit, offset: incoming.params.offset })}"
  result: audit_result

respond_list:
  return: ${list_result.response.body}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false

upstream_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
  next: end
