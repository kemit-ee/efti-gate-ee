declaration:
  description: "List platforms, or get one by id (admin, TARA JWT). Path: platformId (optional —
    absent lists). Query: limit, offset (optional — list mode only). No body. Data comes from the
    ADR-015 `registry` service (the git folder registry/platforms/*.json), not from a ReSql read
    model: the whole registry is read and the page is cut here (default limit 20, 0..1000;
    negative offset clamps to 0). The plaintext apiKey is stripped from every response and
    replaced by hasApiKey."

route:
  switch:
    - condition: ${incoming.params.pathParams[0] != null}
      next: fetch_single
  next: fetch_list

fetch_single:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/platforms/${encodeURIComponent((incoming.params.pathParams[0]).toLowerCase())}.json"
  result: single_result
  next: check_single

check_single:
  switch:
    - condition: ${single_result.response.status == 0}
      next: upstream_unavailable
    - condition: ${single_result.response.status == 404}
      next: not_found
    - condition: ${single_result.response.status != 200 || !single_result.response.body || single_result.response.body.id == null}
      next: upstream_unavailable
  next: strip_credentials_single

# SECURITY: the registry serves the platform's live apiKey in plaintext (ADR-015); the admin
# read surface must never carry it, only whether a credential exists.
strip_credentials_single:
  assign:
    platform: "${Object.assign(Object.fromEntries(Object.entries(single_result.response.body).filter(([k]) => k !== 'apiKey')), {hasApiKey: single_result.response.body.apiKey != null})}"
  next: write_audit_log_single

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never blocks
# the read response; its result is intentionally unchecked. Records that the row was
# viewed, not the row content itself (it may carry eDeliveryCert/tlsCert material).
write_audit_log_single:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "platform.read"
      resource: "platform"
      resourceId: "${incoming.params.pathParams[0]}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ platform_id: incoming.params.pathParams[0] })}"
  result: audit_result
  next: respond_single

respond_single:
  return: ${platform}
  wrapper: false
  next: end

fetch_list:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/platforms.json"
  result: list_result
  next: check_list

check_list:
  switch:
    - condition: ${list_result.response.status != 200 || !Array.isArray(list_result.response.body)}
      next: upstream_unavailable
  next: compute_page

compute_page:
  assign:
    limit: "${Math.min(Math.max(Number(incoming.params.limit ?? 20) || 0, 0), 1000)}"
    offset: "${Math.max(Number(incoming.params.offset ?? 0) || 0, 0)}"
  next: slice_page

slice_page:
  assign:
    page: "${list_result.response.body.slice(offset, offset + limit)}"
  next: strip_credentials_list

strip_credentials_list:
  assign:
    platforms: "${page.map(p => Object.assign(Object.fromEntries(Object.entries(p).filter(([k]) => k !== 'apiKey')), {hasApiKey: p.apiKey != null}))}"
  next: write_audit_log_list

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never blocks
# the read response; its result is intentionally unchecked. Records that a list was
# browsed (count + filter), not the listed rows themselves.
write_audit_log_list:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "platform.list"
      resource: "platform"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ count: page.length, limit: incoming.params.limit, offset: incoming.params.offset })}"
  result: audit_result
  next: respond_list

respond_list:
  return: ${platforms}
  wrapper: false
  next: end

not_found:
  return: {"error": "Not Found"}
  status: 404
  wrapper: false

upstream_unavailable:
  return: {"error": "Data layer unavailable"}
  status: 502
  wrapper: false
  next: end
