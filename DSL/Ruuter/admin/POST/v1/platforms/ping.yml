get_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_platform_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: platform_result
  next: check_platform_exists

check_platform_exists:
  switch:
    - condition: ${!platform_result.response.body.length}
      next: platform_not_found
    - condition: ${!platform_result.response.body[0]?.eDeliveryCert}
      next: ping_rest
  next: ping_edelivery

ping_rest:
  call: http.post
  args:
    url: "${platform_result.response.body[0]?.baseUrl}"
    headers:
      Content-Type: "application/json"
    body: {}
  result: ping_result
  next: check_rest_ping

check_rest_ping:
  switch:
    - condition: ${ping_result.response.status != 200}
      next: update_offline
  next: update_online

ping_edelivery:
  call: http.post
  args:
    url: "[#EDELIVERY_URL]/api/v1/ping/${incoming.params.pathParams[0]}"
    headers:
      Content-Type: "application/json"
    body: {}
  result: ping_result
  next: check_edelivery_ping

check_edelivery_ping:
  switch:
    - condition: ${ping_result.response.status != 204}
      next: update_offline
  next: update_online

update_online:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_platform_ping"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      status: "ONLINE"
  result: online_result
  next: check_online_update

check_online_update:
  switch:
    - condition: ${!online_result.response.body.length}
      next: update_failed
  next: verify_online

verify_online:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_platform_by_id"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${!verify_result.response.body.length}
      next: update_failed
  next: respond_ok

respond_ok:
  return: ${verify_result.response.body[0]}
  wrapper: false
  next: end

update_offline:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/update_platform_ping"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.params.pathParams[0]}"
      status: "OFFLINE"
  result: offline_result
  next: check_offline_update

check_offline_update:
  switch:
    - condition: ${!offline_result.response.body.length}
      next: update_failed
  next: gateway_unavailable

gateway_unavailable:
  return: {"type": "https://api.efti.ee/errors/bad-gateway", "title": "Bad Gateway", "status": 502, "detail": "Platform ping failed — eDelivery unreachable, status set to OFFLINE"}
  status: 502
  wrapper: false
  next: end

platform_not_found:
  return: {"type": "https://api.efti.ee/errors/platform-not-found", "title": "Platform Not Found", "status": 404, "detail": "Platform not found"}
  status: 404
  wrapper: false
  next: end

update_failed:
  return: {"type": "https://api.efti.ee/errors/internal-server-error", "title": "Internal Server Error", "status": 500, "detail": "Failed to update platform ping status"}
  status: 500
  wrapper: false
  next: end
