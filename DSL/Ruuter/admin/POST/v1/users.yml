declaration:
  description: "Create a user (admin, TARA JWT). Body: taraSub, name (both required). A duplicate
    active taraSub returns 409."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.taraSub == null || incoming.body.name == null}
      next: bad_request
  next: check_duplicate

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: taraSub, name."
  wrapper: false
  status: 400
  next: end

check_duplicate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/check_tara_sub_exists"
    headers:
      Content-Type: "application/json"
    body:
      taraSub: "${incoming.body.taraSub}"
  result: dup_result
  next: check_dup_result

check_dup_result:
  switch:
    - condition: ${dup_result.response.body.length > 0}
      next: conflict
  next: create_user

create_user:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_user"
    headers:
      Content-Type: "application/json"
    body:
      taraSub: "${incoming.body.taraSub}"
      name: "${incoming.body.name}"
  result: insert_result
  next: check_insert

# insert_user RETURNS the full row (column list matches get_user_by_id); an empty body
# means the insert produced nothing. No re-fetch needed.
check_insert:
  switch:
    - condition: ${insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed
  next: respond

respond:
  return: ${insert_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

conflict:
  return: {"error": "Conflict", "detail": "tara_sub already exists on an active user"}
  status: 409
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create user"}
  status: 500
  wrapper: false
  next: end
