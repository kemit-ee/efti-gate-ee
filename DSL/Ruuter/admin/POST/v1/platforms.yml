declaration:
  description: "Create a platform (admin, TARA JWT). Body: id, baseUrl (required); headers
    (object, optional), eDeliveryCert, tlsCert, status (optional)."
  internal: false
  returns:
    - field: rowId
      type: string
    - field: id
      type: string
    - field: baseUrl
      type: string
    - field: headers
      type: object
    - field: eDeliveryCert
      type: string
    - field: tlsCert
      type: string
    - field: status
      type: string
    - field: apiKeyHint
      type: string
    - field: apiKeyGeneratedAt
      type: string
    - field: hasApiKey
      type: boolean
    - field: createdAt
      type: string
  additive: true
  allowlist:
    body:
      - field: id
        type: string
      - field: baseUrl
        type: string
      - field: eDeliveryCert
        type: string
      - field: headers
        type: object
      - field: status
        type: string
      - field: tlsCert
        type: string

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.id == null || incoming.body.baseUrl == null}
      next: bad_request
  next: create_platform

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: id, baseUrl."
  wrapper: false
  status: 400
  next: end

create_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_platform"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      baseUrl: "${incoming.body.baseUrl}"
      headers: "${incoming.body.headers}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: insert_result

# insert_platform RETURNS the full row (same columns as get_platform_by_id); an empty
# body means the insert produced nothing. No re-fetch needed.
check_insert:
  switch:
    - condition: ${insert_result.response.status == 0 || insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never
# fails or rolls back the platform write above; its result is intentionally unchecked.
write_audit_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "platform.create"
      resource: "platform"
      resourceId: "${incoming.body.id}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ platform_id: incoming.body.id, before: null, after: insert_result.response.body[0] })}"
  result: audit_result

# Best-effort, post-commit: the registry list read model (ADR-012) catches up right after the write; a
# failure here never fails the write, and POST /ops/v1/refresh-read-models is the safety net.
refresh_registry_lists:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/refresh_registry_lists"
    headers:
      Content-Type: "application/json"
    body: {}
  result: refresh_registry_lists_result


respond:
  return: ${insert_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create platform"}
  status: 500
  wrapper: false
