declaration:
  description: "Create a platform (admin, TARA JWT). Body: id, baseUrl (required); headers
    (object, optional), eDeliveryCert, tlsCert, status (optional)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.id == null || incoming.body.baseUrl == null}
      next: bad_request
  next: create_platform

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: id, baseUrl."
  wrapper: false
  status: 400
  next: end

create_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_platform"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      baseUrl: "${incoming.body.baseUrl}"
      headers: "${incoming.body.headers}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: insert_result

# insert_platform RETURNS the full row (same columns as get_platform_by_id); an empty
# body means the insert produced nothing. No re-fetch needed.
check_insert:
  switch:
    - condition: ${insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed

respond:
  return: ${insert_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create platform"}
  status: 500
  wrapper: false
