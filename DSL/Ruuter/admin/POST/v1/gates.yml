create_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      countryCode: "${incoming.body.countryCode}"
      eDeliveryUrl: "${incoming.body.eDeliveryUrl}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: insert_result
  next: check_insert

# insert_gate RETURNS the full row (same columns as get_gate_by_id); an empty body
# means the insert produced nothing. No re-fetch needed.
check_insert:
  switch:
    - condition: ${insert_result.response.body == null || insert_result.response.body.length == 0}
      next: insert_failed
  next: respond

respond:
  return: ${insert_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create gate"}
  status: 500
  wrapper: false
  next: end
