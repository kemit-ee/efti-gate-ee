declaration:
  description: "Create a gate (admin, TARA JWT). Body: id, countryCode, eDeliveryUrl (all
    required); eDeliveryCert, tlsCert, status (optional)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.id == null || incoming.body.countryCode == null || incoming.body.eDeliveryUrl == null}
      next: bad_request
  next: create_gate

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: id, countryCode, eDeliveryUrl."
  wrapper: false
  status: 400
  next: end

create_gate:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_gate"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      countryCode: "${incoming.body.countryCode}"
      eDeliveryUrl: "${incoming.body.eDeliveryUrl}"
      eDeliveryCert: "${incoming.body.eDeliveryCert}"
      tlsCert: "${incoming.body.tlsCert}"
      status: "${incoming.body.status}"
  result: insert_result

# insert_gate RETURNS the full row (same columns as get_gate_by_id); an empty body
# means the insert produced nothing. No re-fetch needed.
check_insert:
  switch:
    - condition: ${insert_result.response.status == 0 || insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed

publish_gate_change:
  call: http.post
  args:
    url: "[#PUBSUB_URL]/api/v1/publish"
    headers:
      Content-Type: "application/json"
    body:
      name: "gate-changes"
      data:
        event: "created"
  result: publish_result

respond:
  return: ${insert_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create gate"}
  status: 500
  wrapper: false
