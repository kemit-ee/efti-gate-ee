declaration:
  description: "Create a competent authority (admin, TARA JWT). Body: id, name, registryCode
    (all required); subsets (array, optional — defaults to []); status (optional — defaults ACTIVE)."

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.id == null || incoming.body.name == null || incoming.body.registryCode == null}
      next: bad_request
  next: create_authority

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "Required fields: id, name, registryCode."
  wrapper: false
  status: 400
  next: end

create_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_authority"
    headers:
      Content-Type: "application/json"
    body:
      id: "${incoming.body.id}"
      name: "${incoming.body.name}"
      registryCode: "${incoming.body.registryCode}"
      subsets: "${JSON.stringify(incoming.body.subsets ?? [])}"
      status: "${incoming.body.status}"
  result: insert_result

# insert_authority RETURNS the full row (same columns as get_authority_by_id); an empty
# body means the insert produced nothing. No re-fetch needed.
check_insert:
  switch:
    - condition: ${insert_result.response.status == 0 || insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failure here never
# fails or rolls back the authority write above; its result is intentionally unchecked.
write_audit_log:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      userId: "${caller.id}"
      action: "authority.create"
      resource: "authority"
      resourceId: "${incoming.body.id}"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ authority_id: incoming.body.id, before: null, after: insert_result.response.body[0] })}"
  result: audit_result

respond:
  return: ${insert_result.response.body[0]}
  status: 201
  wrapper: false
  next: end

insert_failed:
  return: {"error": "Failed to create authority"}
  status: 500
  wrapper: false
