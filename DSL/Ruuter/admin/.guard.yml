# Admin only — one project-level guard (Ruuter #39) for the whole admin surface:
# every GET/POST/PUT/DELETE under /admin/** requires the ADMIN role per
# docs/specs/permissions-matrix.md §3.3. Replaces the four byte-identical
# admin/{GET,POST,PUT,DELETE}/v1/.guard.yml files.
#
# check-admin-authority returns 200 + the caller row on success, 401 if the token
# is missing/invalid, 403 if authenticated but not ADMIN. On success the guard
# exposes the caller row as ${caller} (the shared execution context flows into the
# handler), so handlers do not re-call the internal route just to identify the caller.
validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-admin-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
    body: {}
  result: auth_result
  next: check_result

check_result:
  switch:
    - condition: ${auth_result.response.status == 200}
      next: bind_caller
  next: guard_fail

bind_caller:
  assign:
    caller: ${auth_result.response.body}
  next: guard_success

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
  next: end
