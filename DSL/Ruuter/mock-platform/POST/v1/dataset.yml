declaration:
  description: "Mock platform endpoint for testing follow-up messages"

check_api_key:
  switch:
    - condition: ${incoming.headers['x-api-key'] != 'mock-secret-key'}
      next: unauthorized
  next: check_path

check_path:
  switch:
    - condition: ${incoming.params.pathParams?.[1] != 'follow-up'}
      next: not_found
  next: log_request

log_request:
  log: "Follow-up request for datasetId=${incoming.params.pathParams[0]}: ${incoming.body}"
  next: respond

respond:
  return: ${incoming.body}
  wrapper: false
  status: 201
  next: end

unauthorized:
  return: '{"error": "Unauthorized"}'
  status: 401
  next: end

not_found:
  return: '{"error": "Not Found"}'
  status: 404
  next: end
