declaration:
  description: "Mock platform endpoint returning sample FTI010 dataset"

check_api_key:
  switch:
    - condition: ${incoming.headers['x-api-key'] != 'mock-secret-key'}
      next: unauthorized

respond:
  return: |
    <rsm:SpecifiedSupplyChainConsignment
        xmlns:rsm="urn:eu:move:eFTI:data:standard:FTI010GetCmdsResponse:1"
        xmlns="urn:eu:move:eFTI:data:standard:ReusableAggregateBusinessInformationEntity:34"
        xmlns:udt="urn:eu:move:eFTI:data:standard:UnqualifiedDataType:34">
      <GrossWeightMeasure unitCode="KGM">15000.00</GrossWeightMeasure>
      <NetWeightMeasure unitCode="KGM">12000.00</NetWeightMeasure>
      <GrossVolumeMeasure unitCode="MTQ">45.00</GrossVolumeMeasure>
      <PackageQuantity>120</PackageQuantity>
      <TransportEquipmentQuantity>2</TransportEquipmentQuantity>
      <ConsignorTradeParty>
        <ID schemeAgencyID="87">DE123456789012345</ID>
        <Name>Acme Logistics GmbH</Name>
        <PostalTradeAddress>
          <StreetName>Hauptstrasse</StreetName>
          <CityName>Berlin</CityName>
          <CountryID>DE</CountryID>
        </PostalTradeAddress>
      </ConsignorTradeParty>
      <ConsigneeTradeParty>
        <ID schemeAgencyID="87">FR987654321012345</ID>
        <Name>Speedy Imports SAS</Name>
        <PostalTradeAddress>
          <StreetName>Rue de la Paix</StreetName>
          <CityName>Paris</CityName>
          <CountryID>FR</CountryID>
        </PostalTradeAddress>
      </ConsigneeTradeParty>
      <CarrierTradeParty>
        <Name>TransEuropa Shipping BV</Name>
      </CarrierTradeParty>
      <MainCarriageLogisticsTransportMovement>
        <ModeCode>1</ModeCode>
        <ID>VOY-2021-001</ID>
        <SequenceNumeric>1</SequenceNumeric>
        <LoadingTransportEvent>
          <ActualOccurrenceDateTime>
            <udt:DateTimeString format="205">20210920060000</udt:DateTimeString>
          </ActualOccurrenceDateTime>
          <OccurrenceLogisticsLocation>
            <Name>Port of Hamburg</Name>
            <PostalTradeAddress>
              <CountryID>DE</CountryID>
            </PostalTradeAddress>
          </OccurrenceLogisticsLocation>
        </LoadingTransportEvent>
        <UnloadingTransportEvent>
          <ActualOccurrenceDateTime>
            <udt:DateTimeString format="102">20210924</udt:DateTimeString>
          </ActualOccurrenceDateTime>
          <OccurrenceLogisticsLocation>
            <Name>Port of Le Havre</Name>
            <PostalTradeAddress>
              <CountryID>FR</CountryID>
            </PostalTradeAddress>
          </OccurrenceLogisticsLocation>
        </UnloadingTransportEvent>
        <UsedLogisticsTransportMeans>
          <TypeCode>1522</TypeCode>
          <ID schemeAgencyID="5">IMO-9876543</ID>
          <Name>Pacific Trader</Name>
          <RegistrationTradeCountry>
            <ID>NL</ID>
          </RegistrationTradeCountry>
        </UsedLogisticsTransportMeans>
      </MainCarriageLogisticsTransportMovement>
    </rsm:SpecifiedSupplyChainConsignment>
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 200
  next: end

unauthorized:
  return:
    error: "Unauthorized"
  status: 401
  wrapper: false
