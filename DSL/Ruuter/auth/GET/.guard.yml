# Any authenticated user — validates JWT via TIM + DB lookup. On success the caller
# row is exposed as ${caller} for the handler (shared execution context), so
# auth/GET/user.yml does not re-run this lookup.

declaration:
  description: "auth/GET guard. Credential: Authorization: Bearer <TARA JWT> (required),
    validated via check-user-authority — any authenticated user."

validate_auth:
  call: http.post
  args:
    url: "[#RUUTER_URL]/efti/internal/check-user-authority"
    headers:
      Content-Type: application/json
      authorization: ${incoming.headers.authorization}
      x-forwarded-for: ${incoming.headers['x-forwarded-for'] ?? null}
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body: {}
  result: auth_result

check_result:
  switch:
    - condition: ${auth_result.response.status == 200}
      next: bind_caller
    # Loopback call to check-*-authority failed at the transport layer (issue #89, status 0):
    # guard_fail below echoes auth_result.response.status, which would emit a broken `status: 0`.
    - condition: ${auth_result.response.status == 0}
      next: guard_unavailable
  next: guard_fail

bind_caller:
  assign:
    caller: ${auth_result.response.body}

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${auth_result.response.body}
  status: ${auth_result.response.status}
  wrapper: false
  next: end

guard_unavailable:
  return:
    type: "https://api.efti.ee/errors/service-unavailable"
    title: "Service Unavailable"
    status: 503
    detail: "The authentication service is temporarily unreachable. Retry the request."
  status: 503
  wrapper: false
  next: end
