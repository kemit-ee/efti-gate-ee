declaration:
  call: declare
  version: "0.1"
  description: "Current user profile. Open to any authenticated caller, scoped to their own row — docs/specs/permissions-matrix.md:163, openapi.yaml operation getCurrentUser."
  method: get
  namespace: service
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"

# auth/GET/.guard.yml has already authenticated the caller and exposed the row as
# ${caller}; this handler just returns it.
return_user:
  return: ${caller}
  wrapper: false
  next: end
