declaration:
  version: "1.0"
  description: >
    Dev/CI login — mint a JWT directly without a TARA OIDC redirect.
    Returns the JWT in the response body for the frontend to store in sessionStorage.
    Disabled by default. DEV_LOGIN_ENABLED=true is required for local development and CI.
  method: post
  allowlist:
    body:
      - field: personalCode
        type: string
        description: "Estonian personal code, e.g. 60001019906"
      - field: firstName
        type: string
        description: "Given name"
      - field: lastName
        type: string
        description: "Family name"

validate_input:
  switch:
    - condition: ${'[#DEV_LOGIN_ENABLED]' != 'true'}
      next: disabled
    - condition: ${incoming.body == null || incoming.body.personalCode == null}
      next: missing_params

generate_jwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/custom/generate"
    headers:
      type: json
      X-TIM-Admin-Token: "[#TIM_ADMIN_TOKEN]"
    body:
      content:
        sub: "EE${incoming.body.personalCode}"
        personalCode: ${incoming.body.personalCode}
        firstName: ${incoming.body.firstName}
        lastName: ${incoming.body.lastName}
      expirationInMinutes: 60
      JWTName: "eftiJwtCookie"
  result: jwt_result

check_jwt:
  switch:
    - condition: ${200 <= jwt_result.response.status && jwt_result.response.status < 300}
      next: audit_login_success
  next: audit_login_failure_jwt

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): audit write failures never
# block the response; its result is intentionally unchecked. No local `users` row is
# looked up on this dev/CI path, so user_id stays null.
audit_login_success:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      action: "user.login"
      resource: "user"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ outcome: 'success', personal_code: incoming.body.personalCode, dev_login: true })}"
  result: audit_result

return_token:
  return:
    token: ${jwt_result.response.body.token}
  wrapper: false
  next: end

audit_login_failure_jwt:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_audit_log"
    headers:
      Content-Type: "application/json"
    body:
      action: "user.login"
      resource: "user"
      ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
      details: "${JSON.stringify({ outcome: 'failure', failure_reason: 'jwt_generation_failed', personal_code: incoming.body.personalCode, dev_login: true })}"
  result: audit_result
  next: jwt_error

jwt_error:
  status: 500
  return: {"error": "JWT generation failed"}
  wrapper: false
  next: end

missing_params:
  status: 400
  return: {"error": "personalCode is required"}
  wrapper: false
  next: end

disabled:
  status: 404
  return: {"error": "Not found"}
  wrapper: false
  next: end
