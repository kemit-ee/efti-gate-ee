declaration:
  version: "1.0"
  description: "Logout - blacklist JWT via TIM. The frontend drops its sessionStorage copy."
  method: post
  allowlist:
    header:
      - field: authorization
        type: string
        description: "Bearer <gate JWT>"
  internal: false
  returns:
    - field: message
      type: string

check_bearer:
  switch:
    - condition: ${incoming.headers == null || incoming.headers.authorization == null || !incoming.headers.authorization.toLowerCase().startsWith("bearer ")}
      next: return_ok

extract_token:
  assign:
    token: ${incoming.headers.authorization.substring(7)}

expire_tim_session:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/blacklist"
    headers:
      cookie: "eftiJwtCookie=${token}"
      X-TIM-Admin-Token: "[#TIM_ADMIN_TOKEN]"
  result: expire_result

check_expire:
  switch:
    - condition: ${200 <= expire_result.response.status && expire_result.response.status < 300}
      next: return_ok
  next: audit_logout_failed

# Best-effort, post-commit (docs/specs/logging-spec.md §5.2): a failed audit write never
# changes the response. Logout stays idempotent (a dead token makes TIM answer non-2xx on a
# repeat call), so the caller still gets 200; the audit row is the trail.
audit_logout_failed:
  detach:
    do:
      - call: http.post
        args:
          url: "[#RESQL_URL]/efti/insert_audit_log"
          headers:
            Content-Type: "application/json"
          body:
            action: "user.logout"
            resource: "user"
            ipAddress: "${incoming.headers['x-forwarded-for'] ?? null}"
            details: "${JSON.stringify({ outcome: 'failure', failure_reason: 'tim_blacklist_failed', tim_status: expire_result.response.status })}"
  next: return_ok

return_ok:
  return: {"message": "logged out"}
  wrapper: false
