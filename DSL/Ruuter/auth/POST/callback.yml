declaration:
  version: "1.0"
  description: >
    OIDC callback handler. Receives the authorization code from the frontend
    AuthCallbackPage, exchanges it via TIM's session-based callback, then returns
    the JWT in the response body for the frontend to store in sessionStorage.
  method: post
  allowlist:
    body:
      - field: code
        type: string
        description: "Authorization code from TARA-Mock"
      - field: state
        type: string
        description: "OAuth2 state parameter"

validate_input:
  switch:
    - condition: ${incoming.body == null || incoming.body.code == null || incoming.body.state == null}
      next: missing_params

# Step 1: Exchange code via TIM's callback endpoint.
# TIM validates state (single-use), exchanges code for tokens at TARA-Mock's
# token_endpoint, verifies the ID token, creates a session, and returns
# JSON with session_id and user_profile.
call_tim_callback:
  call: http.get
  args:
    url: "[#TIM_URL]/auth/callback/tara"
    query:
      code: ${incoming.body.code}
      state: ${incoming.body.state}
  result: callback_result

check_callback:
  switch:
    - condition: ${200 <= callback_result.response.status && callback_result.response.status < 300}
      next: normalize_personal_code
  next: callback_error

# Step 2a: Strip the "EE" country prefix that TARA adds to the sub claim.
# TARA returns user_id as "EE60001019906" (OIDC sub), but our DB stores
# personal codes as plain numeric strings ("60001019906").
normalize_personal_code:
  assign:
    raw_user_id: ${callback_result.response.body.user_profile.user_id}
    personal_code: "${callback_result.response.body.user_profile.user_id.startsWith('EE') ? callback_result.response.body.user_profile.user_id.substring(2) : callback_result.response.body.user_profile.user_id}"

# Step 2b: Generate a custom JWT with the user's profile claims.
generate_jwt:
  call: http.post
  args:
    url: "[#TIM_URL]/jwt/custom/generate"
    headers:
      type: json
      X-TIM-Admin-Token: "[#TIM_ADMIN_TOKEN]"
    body:
      content:
        sub: ${raw_user_id}
        personalCode: ${personal_code}
        firstName: ${callback_result.response.body.user_profile.first_name}
        lastName: ${callback_result.response.body.user_profile.last_name}
      expirationInMinutes: 480
      JWTName: "eftiJwtCookie"
  result: jwt_result

check_jwt:
  switch:
    - condition: ${200 <= jwt_result.response.status && jwt_result.response.status < 300}
      next: return_token
  next: jwt_error

# Step 3: Return the JWT in the response body.
# The frontend stores it in sessionStorage and sends it as Authorization: Bearer
# on every API call. No cookie, no CSRF token — per
# docs/architecture/user-interfaces/README.md §1.3.
return_token:
  return:
    token: ${jwt_result.response.body.token}
  wrapper: false
  next: end

callback_error:
  status: 401
  return: {"error": "Authentication failed"}
  wrapper: false
  next: end

jwt_error:
  status: 500
  return: {"error": "JWT generation failed"}
  wrapper: false
  next: end

missing_params:
  status: 400
  return: {"error": "code and state are required"}
  wrapper: false
