declaration:
  description: >
    AS4/eDelivery edge proxy (Ruuter pass-through proxy, issue turnerrainer/Ruuter#134).
    This route makes Ruuter the entry point for external eDelivery traffic: a peer gate
    POSTs its AS4 message to POST /services/msh and Ruuter streams it byte-identically to
    the Klite edelivery container's /services/msh, so the bytes the AS4 signature covers
    are never re-serialised. Ruuter does not parse, decrypt or transform the body.
    Request inputs: Content-Type (required; enforced by the sibling .guard.yml as
    multipart/related with type="application/soap+xml" and a boundary) and the AS4
    multipart body (opaque bytes, capped at max_body_bytes). The per-route controls:
    body cap, Content-Encoding allow-list and in-flight concurrency cap, are declared
    below, mirroring edelivery's own BODY_LIMIT_MB default so the edge is never weaker
    than the service behind it.
  proxy:
    upstream: "[#EDELIVERY_URL]/services/msh"
    preserve_headers: true
    # 10 MiB == edelivery's BODY_LIMIT_MB default (docker/code/Dockerfile, bodySizeLimit()).
    # Keep the edge cap at or below the service cap so oversized AS4 traffic is rejected
    # at the proxy before it is read off the socket.
    max_body_bytes: 10485760
    # AS4 does not use HTTP Content-Encoding; the inner payload's gzip is transparent to
    # this hop and never appears here. Only identity is accepted.
    allowed_encodings: ["identity"]
    # Longer than edelivery's EDELIVERY_TIMEOUT_SECONDS default (60 s) so a slow upstream
    # surfaces edelivery's own response rather than a self-inflicted proxy timeout.
    request_timeout_ms: 65000
  internal: false
  returns: []
