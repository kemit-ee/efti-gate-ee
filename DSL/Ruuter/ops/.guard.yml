# /ops/** — scheduled-job endpoints the external CronManager (Quartz) calls on a timer. Not a
# public surface: docker/ui/nginx.conf does not proxy /ops/, and `ruuter` has no published port on
# the public network. The sole credential is a static bearer, Authorization: Bearer ARCHIVE_OPS_TOKEN
# — literal compare, no JWT, matching docs/architecture/identity-and-access (CronManager static token).
#
# The non-null/non-empty checks are load-bearing: if ARCHIVE_OPS_TOKEN is unset,
# '[#ARCHIVE_OPS_TOKEN]' interpolates to an empty string and an absent/empty header must NOT match it.

declaration:
  description: "ops/** guard — CronManager only. Credential: Authorization: Bearer ARCHIVE_OPS_TOKEN
    (required, non-empty, exact match). No JWT path."

check_ops_token:
  switch:
    - condition: ${incoming.headers != null && incoming.headers['authorization'] != null && incoming.headers['authorization'] != '' && incoming.headers['authorization'] == 'Bearer [#ARCHIVE_OPS_TOKEN]'}
      next: guard_success
  next: guard_fail

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    code: "UNAUTHORIZED"
    title: "Unauthorized"
    status: 401
    detail: "This endpoint requires a valid CronManager ops token."
  status: 401
  wrapper: false
  next: end
