# Platform API-key guard (ADR-004) for the whole platforms POST surface — covers
# consignments.yml (direct platform upload) and consignments-xml.yml (eDelivery-
# delivered upload). The X-Api-Key header must be present and its SHA-256 must match
# api_key_hash on an active platform. The key itself is never stored — it is
# generated via POST /admin/v1/platforms/api-key/:id and shown once.
check_present:
  switch:
    - condition: ${incoming.headers == null || incoming.headers['x-api-key'] == null || incoming.headers['x-api-key'] == ''}
      next: guard_fail
  next: resolve_platform

resolve_platform:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_platform_by_api_key"
    headers:
      Content-Type: application/json
    body:
      apiKey: ${incoming.headers['x-api-key']}
  result: platform_res
  next: check_platform

check_platform:
  switch:
    - condition: ${platform_res.response.body == null || platform_res.response.body.length == 0}
      next: guard_fail
    - condition: ${platform_res.response.body.length > 1}
      next: guard_multi
  next: guard_success

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/unauthorized","title":"Unauthorized","status":401,"detail":"X-Api-Key is missing or does not match a registered platform."}')}
  status: 401
  wrapper: false
  next: end

guard_multi:
  return: ${JSON.parse('{"type":"https://api.efti.ee/errors/forbidden-multi-platform","title":"Forbidden","status":403,"detail":"X-Api-Key resolves to more than one active platform."}')}
  status: 403
  wrapper: false
  next: end
