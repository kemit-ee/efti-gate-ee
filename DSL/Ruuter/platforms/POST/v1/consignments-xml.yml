declaration:
  description: "Accept consignment XML from Platform through eDelivery"
  allowed_body: [xml]

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}

call_consignment:
  template: v1/consignments
  request_type: "POST"
  headers:
    x-request-id: ${requestId}
    x-api-key: ${incoming.headers['x-api-key'] ?? null}
    x-internal-service-token: ${incoming.headers['x-internal-service-token'] ?? null}
    x-platform-id: ${incoming.headers['x-platform-id'] ?? null}
  body:
    xml: ${incoming.body.xml}
  result: consignment_response

check_consignment:
  switch:
    - condition: ${!consignment_response.datasetId}
      next: upload_failed

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/upload/response-to-xml"
    headers:
      x-request-id: ${requestId}
      Content-Type: "application/json"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${consignment_response}
  result: xml_response

check_xml:
  switch:
    - condition: ${xml_response.response.status == 0 || xml_response.response.status != 200}
      next: response_failed

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 201
  next: end

upload_failed:
  return: ${consignment_response}
  status: ${consignment_response.status || 502}
  wrapper: false
  next: end

response_failed:
  return: {"error": "Upload response could not be rendered"}
  status: 502
  wrapper: false
  next: end
