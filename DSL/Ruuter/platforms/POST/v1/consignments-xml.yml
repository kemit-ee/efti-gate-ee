declaration:
  description: "Accept consignment XML from Platform through eDelivery"
  allowed_body: [xml]

call_consignment:
  template: v1/consignments
  request_type: "POST"
  # Ruuter #72 (h2ck.me H1, 0.9.11-rc): template: now runs the callee's guard against
  # the CHILD context — nothing is inherited from incoming.headers automatically. This
  # route is itself reached only via the guarded /platforms/v1/consignments-xml entry
  # (edelivery, over the internal network), so forward the internal-service credential
  # rather than an X-Api-Key we don't have here; platforms/.guard.yml accepts either.
  headers:
    x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
  body:
    xml: ${incoming.body.xml}
  result: consignment_response

to_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/upload/response-to-xml"
    headers:
      Content-Type: "application/json"
    body: ${consignment_response}
  result: xml_response

respond:
  return: ${xml_response.response.body}
  headers:
    Content-Type: "text/xml"
  wrapper: false
  status: 201
