declaration:
  description: |
    Accept consignment XML from Platforms (External API)
    Posted XML can be: 
      * the full FTI004UploadIdentifierRequest (if coming via eDelivery)
      * just the ParameterIDSetCriteria element (for direct platform upload via REST).
        In this case, datasetId must be provided as path parameter.
  allowed_body: [xml]

consignment_xml:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/upload/request-to-json"
    body:
      text: "${incoming.body.xml}"
    content_type: plaintext
    headers:
      Content-Type: "text/xml"
      X-Gate-Id: '[#OWN_GATE_ID]'
      X-Platform-Id: ${platform?.id}
      X-Dataset-Id: ${incoming.params?.pathParams[0]}
  result: consignment_json
  next: insert_consignment

insert_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_consignment"
    headers:
      Content-Type: "application/json"
    body: ${consignment_json.response.body}
  result: insert_result
  next: check_insert

check_insert:
  switch:
    - condition: ${insert_result.response.status >= 400 || !insert_result.response.body?.length}
      next: insert_failed
  next: verify_consignment

verify_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_by_id"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: "${insert_result.response.body[0].datasetId}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${verify_result.response.body == null || verify_result.response.body.length == 0}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body[0]}
  wrapper: false
  status: 201
  next: end

insert_failed:
  return: {"error": "Failed to insert consignment"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Consignment inserted but could not be verified"}
  status: 500
  wrapper: false
  next: end
