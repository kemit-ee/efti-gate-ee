declaration:
  description: |
    Accept consignment XML from Platforms (External API)
    Posted XML can be: 
      * the full FTI004UploadIdentifierRequest (if coming via eDelivery)
      * just the ParameterIDSetCriteria element (for direct platform upload via REST).
        In this case, datasetId must be provided as path parameter.
  allowed_body: [xml]

consignment_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/upload/request-to-json"
    body:
      text: "${incoming.body.xml}"
    content_type: plaintext
    headers:
      content-type: "text/xml"
      x-gate-id: ${incoming.headers['x-gate-id'] ?? '[#OWN_GATE_ID]'}
      # `platform` is assigned by platforms/.guard.yml and is only in scope for a request that
      # actually ran that guard. This handler is ALSO reached as a `template:` sub-call from
      # consignments-xml.yml, and a template sub-call carries neither the guard nor its context —
      # so a bare `${platform...}` here is a ReferenceError on that path (`?.`/`??` do not rescue an
      # UNDECLARED identifier; only `typeof` does). No ternary — `": "` would terminate the YAML
      # plain scalar. On the eDelivery path this is null and xml-mapper ignores it: a full
      # FTI004UploadIdentifierRequest carries the UIL in the XML (UploadRoutes.kt), the X-Platform-Id
      # header is read only for the bare-ParameterIDSetCriteria (direct REST) case.
      # STOPGAP — see the platforms-guard issue; real fix waits on Ruuter #57 (per-route guard opt-out).
      x-platform-id: ${(typeof platform !== 'undefined' && platform && platform.id) || null}
      x-dataset-id: ${incoming.params?.pathParams?.[0]}
  result: consignment_json
  next: insert_consignment

insert_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_consignment"
    headers:
      Content-Type: "application/json"
    body: ${consignment_json.response.body}
  result: insert_result
  next: check_insert

check_insert:
  switch:
    - condition: ${insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed
  next: verify_consignment

verify_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_by_id"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: "${insert_result.response.body[0]?.datasetId}"
  result: verify_result
  next: check_verify

check_verify:
  switch:
    - condition: ${!verify_result.response.body.length}
      next: verify_failed
  next: respond

respond:
  return: ${verify_result.response.body[0]}
  wrapper: false
  status: 201
  next: end

insert_failed:
  return: {"error": "Failed to insert consignment"}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Consignment inserted but could not be verified"}
  status: 500
  wrapper: false
  next: end
