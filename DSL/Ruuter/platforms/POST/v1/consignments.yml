declaration:
  description: |
    Accept consignment XML from Platforms (External API)
    Posted XML can be: 
      * the full FTI004UploadIdentifierRequest (if coming via eDelivery)
      * just the ParameterIDSetCriteria element (for direct platform upload via REST).
        In this case, datasetId must be provided as path parameter.
  allowed_body: [xml]

setup:
  assign:
    requestId: ${incoming.headers['x-request-id']}

consignment_to_json:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/upload/request-to-json"
    body:
      text: "${incoming.body.xml}"
    content_type: plaintext
    headers:
      content-type: "text/xml"
      x-request-id: ${requestId}
      x-gate-id: "[#OWN_GATE_ID]"
      x-platform-id: ${(typeof platform !== 'undefined' && platform && platform.id) || null}
      x-dataset-id: ${incoming.params?.pathParams?.[0]}
  result: consignment_json

# Transport failure reaching xml-mapper (issue #89, status 0) — without this the stub body
# {error,message} would be POSTed to insert_consignment as if it were the parsed consignment.
check_json:
  switch:
    - condition: ${consignment_json.response.status == 0 || consignment_json.response.status >= 500}
      next: mapper_unavailable
    - condition: ${consignment_json.response.status != 200}
      next: invalid_xml
    - condition: ${typeof platform === 'undefined' || !platform || typeof platform.id !== 'string' || typeof consignment_json.response.body?.platformId !== 'string' || typeof consignment_json.response.body?.gateId !== 'string' || consignment_json.response.body.platformId.toLowerCase() != platform.id.toLowerCase() || consignment_json.response.body.gateId.toLowerCase() != '[#OWN_GATE_ID]'.toLowerCase()}
      next: forbidden_owner

insert_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_consignment"
    headers:
      Content-Type: "application/json"
    body: ${consignment_json.response.body}
  result: insert_result

check_insert:
  switch:
    - condition: ${insert_result.response.status == 0 || insert_result.response.status >= 400 || !insert_result.response.body.length}
      next: insert_failed

verify_consignment:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_consignment_by_id"
    headers:
      Content-Type: "application/json"
    body:
      datasetId: "${insert_result.response.body[0]?.datasetId}"
      platformId: "${insert_result.response.body[0]?.platformId}"
      gateId: "${insert_result.response.body[0]?.gateId}"
  result: verify_result

check_verify:
  switch:
    - condition: ${verify_result.response.status == 0 || verify_result.response.status >= 300 || !verify_result.response.body.length}
      next: verify_failed

respond:
  return: ${verify_result.response.body[0]}
  wrapper: false
  status: 201
  next: end

insert_failed:
  return: {"error": "Failed to insert consignment", "status": 500}
  status: 500
  wrapper: false
  next: end

verify_failed:
  return: {"error": "Consignment inserted but could not be verified", "status": 500}
  status: 500
  wrapper: false
  next: end

mapper_unavailable:
  return: {"error": "XML mapper unavailable", "status": 502}
  status: 502
  wrapper: false
  next: end

invalid_xml:
  return: {"error": "Invalid consignment XML", "status": 400}
  status: 400
  wrapper: false
  next: end

forbidden_owner:
  return: {"error": "Consignment UIL must belong to the authenticated platform and this gate", "status": 403}
  status: 403
  wrapper: false
  next: end
