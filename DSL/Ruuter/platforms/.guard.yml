# Platform API-key guard (ADR-004, amended by ADR-015) — one project-level guard (Ruuter #39) for the
# whole platforms surface — covers consignments.yml (direct platform upload) and consignments-xml.yml
# (eDelivery-delivered upload). The X-Api-Key header must be present and must equal the apiKey
# declared for an ONLINE platform in registry/platforms/<id>.json, served by the registry service.
#
# The credential is compared in plaintext inside the DSL because Ruuter's expression engine has no
# hash function at all (no crypto / crypto.subtle / TextEncoder — verified against the running
# engine). ADR-004's "store only the SHA-256" rule was therefore dropped in ADR-015: the registry is
# a secret store and must never be reachable outside the Compose network.

declaration:
  description: "platforms/ guard (ADR-004/ADR-015). Credential: X-Api-Key (required); it must equal
    the apiKey of an ONLINE platform in registry/platforms/*.json — DISABLED does not authenticate.
    Also accepts X-Internal-Service-Token for the G2G consignments-xml route together with
    X-Platform-Id supplied by eDelivery."

check_present:
  switch:
    - condition: ${incoming.headers?.['x-internal-service-token'] != null && incoming.headers['x-internal-service-token'] != '' && '[#INTERNAL_SERVICE_TOKEN]' != '' && incoming.headers['x-internal-service-token'] == '[#INTERNAL_SERVICE_TOKEN]'}
      next: check_internal_platform
    - condition: ${!incoming.headers['x-api-key']}
      next: guard_fail

resolve_platforms:
  call: http.get
  args:
    url: "[#REGISTRY_URL]/platforms.json"
    headers:
      Content-Type: "application/json"
  result: platforms_res

# DENY IS THE FALL-THROUGH BRANCH and every accept path is an explicit positive condition — same
# posture as the X-Road guard. A non-array body (an error object, a truncated response) makes every
# length comparison false, so it must land on guard_fail, not guard_success.
check_platforms:
  switch:
    # A registry transport failure surfaces as status 0, already covered by `!= 200` here — the guard
    # fails closed (401), the correct posture for a credential check. Called out explicitly so the
    # availability-failure path is auditable.
    - condition: ${platforms_res.response.status != 200 || !Array.isArray(platforms_res.response.body)}
      next: guard_fail
  next: match_platform

# Only ONLINE platforms authenticate (DISABLED is a full stop), and a null apiKey can never equal the
# header, so a platform with no configured credential is unreachable by construction.
match_platform:
  assign:
    platform_matches: ${platforms_res.response.body.filter(p => p.apiKey != null && p.apiKey === incoming.headers['x-api-key'] && p.status === 'ONLINE')}

check_platform:
  switch:
    - condition: ${platform_matches.length > 1}
      next: guard_multi
    - condition: ${platform_matches.length === 1 && typeof platform_matches[0]?.id === 'string' && platform_matches[0].id != ''}
      next: guard_success
  next: guard_fail

guard_success:
  assign:
    # apiKey is stripped before the platform is exposed: ${platform} flows through the shared
    # execution context into the handler, and the credential must not travel past this guard.
    platform: ${Object.fromEntries(Object.entries(platform_matches[0]).filter(([key]) => key !== 'apiKey'))}
  next: return

check_internal_platform:
  switch:
    - condition: ${incoming.headers['x-platform-id'] == null || incoming.headers['x-platform-id'] == ''}
      next: guard_fail

bind_internal_platform:
  assign:
    platform:
      id: ${incoming.headers['x-platform-id']}
  next: return

return:
  return: "success"
  status: 200
  wrapper: false
  next: end

guard_fail:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    title: "Unauthorized"
    status: 401
    detail: "X-Api-Key is missing or does not match a registered platform."
  status: 401
  wrapper: false
  next: end

guard_multi:
  return:
    type: "https://api.efti.ee/errors/forbidden-multi-platform"
    title: "Forbidden"
    status: 403
    detail: "X-Api-Key resolves to more than one active platform."
  status: 403
  wrapper: false
