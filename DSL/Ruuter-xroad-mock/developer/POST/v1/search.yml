declaration:
  description: "Developer mock — imitates POST /xroad/v1/search. Returns a canned result array for
    mainTransportId EQ MOCK-PLATE-1 or MOCK-PLATE-3 (three shipments); an empty array
    otherwise and for poll requests. No subset
    check (identifier search is unrestricted)."

route:
  switch:
    - condition: ${incoming.body?.poll == true}
      next: respond_empty
    - condition: ${incoming.body?.mainTransportId?.id == 'MOCK-PLATE-3'}
      next: respond_multi
    - condition: ${incoming.body?.mainTransportId != null && incoming.body.mainTransportId.id == 'MOCK-PLATE-1'}
      next: respond_hit
  next: respond_empty

