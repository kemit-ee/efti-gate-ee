databaseChangeLog:
  # Auth surface — users + sessions, then dev-only fixtures (context: dev).
  - include:
      file: changelog/20260813-auth-schema.sql
      relativeToChangelogFile: false
  - include:
      file: changelog/20260813-auth-seed.sql
      relativeToChangelogFile: false

  - changeSet:
      id: 001-create-testandmestik
      author: devin
      changes:
        - createTable:
            tableName: testandmestik
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: data
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: hash
                  type: varchar(32)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-seed-testandmestik
      author: devin
      changes:
        - insert:
            tableName: testandmestik
            columns:
              - column:
                  name: data
                  value: "See on suvaline lausejupp ja selles võivad olla täpitähed äöü."
              - column:
                  name: hash
                  valueComputed: "md5('See on suvaline lausejupp ja selles võivad olla täpitähed äöü.')"
        - insert:
            tableName: testandmestik
            columns:
              - column:
                  name: data
                  value: "Teine suvaline testlause, mis sisaldab numbreid 123 ja märgendeid."
              - column:
                  name: hash
                  valueComputed: "md5('Teine suvaline testlause, mis sisaldab numbreid 123 ja märgendeid.')"
        - insert:
            tableName: testandmestik
            columns:
              - column:
                  name: data
                  value: "Kolmas näitelause ilma apostroofideta, kuid pikkusega piisavalt."
              - column:
                  name: hash
                  valueComputed: "md5('Kolmas näitelause ilma apostroofideta, kuid pikkusega piisavalt.')"
