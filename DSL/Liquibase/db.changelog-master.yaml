databaseChangeLog:
  - changeSet:
      id: 000-init-schema
      author: efti
      changes:
        - sqlFile:
            path: changelogs/000-init-schema.sql
            relativeToChangelogFile: true
            splitStatements: false
            encoding: UTF-8

  - changeSet:
      id: 001-create-testandmestik
      author: liqubase
      changes:
        - createTable:
            tableName: testandmestik
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: data
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: hash
                  type: varchar(32)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-seed-testandmestik
      author: liqubase
      changes:
        - insert:
            tableName: testandmestik
            columns:
              - column:
                  name: data
                  value: "See on suvaline lausejupp ja selles võivad olla täpitähed äöü."
              - column:
                  name: hash
                  valueComputed: "md5('See on suvaline lausejupp ja selles võivad olla täpitähed äöü.')"
        - insert:
            tableName: testandmestik
            columns:
              - column:
                  name: data
                  value: "Teine suvaline testlause, mis sisaldab numbreid 123 ja märgendeid."
              - column:
                  name: hash
                  valueComputed: "md5('Teine suvaline testlause, mis sisaldab numbreid 123 ja märgendeid.')"
        - insert:
            tableName: testandmestik
            columns:
              - column:
                  name: data
                  value: "Kolmas näitelause ilma apostroofideta, kuid pikkusega piisavalt."
              - column:
                  name: hash
                  valueComputed: "md5('Kolmas näitelause ilma apostroofideta, kuid pikkusega piisavalt.')"
