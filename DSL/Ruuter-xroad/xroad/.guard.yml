# X-Road access guard for the whole xroad surface (ADR-006). One project-level guard
# (Ruuter #39) covering every method under /xroad/** — replaces the two byte-identical
# xroad/{GET,POST}/v1/.guard.yml files that previously had to be kept in sync by hand.
#
# Identity model: this Ruuter is the PROVIDER-side X-Road adapter, called by our own Security
# Server (turvaserver). The Security Server establishes the caller ORGANISATION by mTLS and
# forwards it as X-Road-Client = instance/memberClass/memberCode[/subsystemCode]. The memberCode
# is the Estonian Business Registry code, which resolves to authorities.registry_code, and
# authorities.subsets is the authorisation source. X-Road-UserId is caller-asserted and NOT
# authenticated by X-Road, so it never grants access.
#
# !! X-Road-Client is an ORDINARY HEADER that this guard trusts unconditionally, because the
# !! Security Server already authenticated the caller. The whole model therefore depends on
# !! network isolation: anyone able to reach port 8087 directly can claim any registry code and
# !! impersonate any registered authority. Port 8087 must be reachable ONLY from the Security
# !! Server — never published publicly, never behind a public ingress. See ADR-006.
# !! (compose.override.yml publishes it on localhost for development only.)
#
# There is no protocolVersion to validate: in the X-Road REST protocol the version is the /r1/
# prefix on the CONSUMER's URL, consumed by the consumer's Security Server and never forwarded to
# the provider. Our own contract version is the /v1 in the route path.
#
# This guard authenticates only. It does NOT check requested subsets — no route on this surface
# accepts a subset parameter yet. When one is added, it must apply the FORBIDDEN_SUBSET check
# itself (see ADR-006).
#
# The resolved authority row is exposed to handlers as ${authority} (guard-side assign flows into
# the main DSL via the shared execution context). echo.yml reads it directly. subsets.yml
# deliberately re-resolves instead — see the rationale in that file.

log_context:
  log: "xroad guard client=${incoming.headers['x-road-client'] ?? '-'} xroad-id=${incoming.headers['x-road-id'] ?? '-'} rid=${incoming.headers['x-request-id'] ?? '-'}"
  next: check_client_header

check_client_header:
  switch:
    - condition: ${incoming.headers == null || incoming.headers['x-road-client'] == null || incoming.headers['x-road-client'] == ''}
      next: guard_unauthorized
  next: parse_client

parse_client:
  assign:
    xroad_parts: ${incoming.headers['x-road-client'].split('/')}
  next: validate_client_format

# 3 parts = member-level client (EE/GOV/70000099); 4 = subsystem-level (EE/GOV/70000099/tram).
# Both are valid X-Road client ids; only the memberCode at index 2 drives access control. The
# final-part check rejects a trailing slash ('EE/GOV/70000099/' splits to 4 parts with an empty
# last one), which is a malformed client id even though index 2 would still read correctly.
validate_client_format:
  switch:
    - condition: ${(xroad_parts.length === 3 || xroad_parts.length === 4) && xroad_parts[0] != '' && xroad_parts[1] != '' && xroad_parts[2] != null && xroad_parts[2] != '' && xroad_parts[xroad_parts.length - 1] != ''}
      next: check_id_header
  next: guard_unauthorized

# Deliberately after the client check: validate the credential before complaining about other
# headers, so a caller with a garbage client id gets 401 rather than a 400 about X-Road-Id.
check_id_header:
  switch:
    - condition: ${incoming.headers['x-road-id'] == null || incoming.headers['x-road-id'] == ''}
      next: guard_missing_header
  next: resolve_authority

resolve_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_registry_code"
    headers:
      Content-Type: application/json
      x-request-id: ${incoming.headers['x-request-id'] ?? null}
    body:
      registry_code: "${xroad_parts[2]}"
  result: authority_res
  next: check_authority

# DENY IS THE FALL-THROUGH BRANCH, and every accept path is an explicit positive condition.
# This ordering is load-bearing. If ReSql returns a non-array body (a 500 error object, a
# param-validation failure), then `body.length` is undefined and every comparison against it is
# false — so the request must land on guard_forbidden, not on guard_success. Writing this as a
# single negative condition with guard_success as the fall-through fails OPEN on exactly that
# input. Non-2xx internal responses do not raise; they populate response.status/body, which is why
# the status check comes first.
check_authority:
  switch:
    - condition: ${authority_res.response.status != 200}
      next: guard_forbidden
    - condition: ${authority_res.response.body == null || authority_res.response.body.length == 0}
      next: guard_forbidden
    - condition: ${authority_res.response.body.length > 1}
      next: guard_ambiguous
    - condition: ${authority_res.response.body.length === 1}
      next: bind_authority
  next: guard_forbidden

bind_authority:
  assign:
    authority: ${authority_res.response.body[0]}
  next: guard_success

guard_success:
  return: "success"
  status: 200
  wrapper: false
  next: end

# X-Road-Client is the credential, so its absence or malformation is 401, not 403 — same posture
# as the platform X-Api-Key guard (DSL/Ruuter/platforms/.guard.yml).
guard_unauthorized:
  return:
    type: "https://api.efti.ee/errors/unauthorized"
    code: "UNAUTHORIZED"
    title: "Authentication Required"
    status: 401
    detail: "X-Road-Client header is missing or malformed. Expected instance/memberClass/memberCode[/subsystemCode]."
  status: 401
  wrapper: false
  next: end

guard_missing_header:
  return:
    type: "https://api.efti.ee/errors/missing-required-header"
    code: "MISSING_REQUIRED_HEADER"
    title: "Missing Required Header"
    status: 400
    detail: "X-Road-Id header is required on every X-Road request."
  status: 400
  wrapper: false
  next: end

guard_forbidden:
  return:
    type: "https://api.efti.ee/errors/forbidden"
    code: "FORBIDDEN"
    title: "Forbidden"
    status: 403
    detail: "The X-Road client does not resolve to an active competent authority."
  status: 403
  wrapper: false
  next: end

# Registry misconfiguration: authorities.registry_code has no unique constraint and the admin
# create route does not check for duplicates, so two ACTIVE authorities can share a code. Denying
# is the only safe answer — picking either row would hand one organisation the other's subset
# entitlement. Mirrors guard_multi / FORBIDDEN_MULTI_PLATFORM in the platform guard; a dedicated
# FORBIDDEN_MULTI_AUTHORITY catalog code is proposed in ADR-006's open questions.
guard_ambiguous:
  return:
    type: "https://api.efti.ee/errors/forbidden"
    code: "FORBIDDEN"
    title: "Forbidden"
    status: 403
    detail: "The X-Road client registry code resolves to more than one active competent authority. This is a registry misconfiguration; contact the gate operator."
  status: 403
  wrapper: false
  next: end
