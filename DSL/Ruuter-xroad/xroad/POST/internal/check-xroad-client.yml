declaration:
  call: declare
  version: "0.1"
  description: "Validate X-Road-Client header and check the member code against the authorities registry. Returns the authority row, or the string \"false\" on any failure."
  method: post
  namespace: internal

# Shared X-Road authentication logic, called over this Ruuter's own loopback by
# the .guard file and by each endpoint that needs the caller's authority row.
#
# X-Road-Client header format: INSTANCE/CLASS/MEMBERCODE/SUBSYSTEM (4 parts).
# The MEMBERCODE (3rd part) is matched against authorities.registry_code.
#
# Single sentinel for every failure mode: the literal string "false".

check_for_header:
  switch:
    - condition: ${incoming.headers == null || incoming.headers['x-road-client'] == null || incoming.headers['x-road-client'] == ''}
      next: return_false
  next: parse_parts

parse_parts:
  assign:
    xroad_parts: ${incoming.headers['x-road-client'].split('/')}
  next: validate_format

validate_format:
  switch:
    - condition: ${xroad_parts.length === 4 && xroad_parts[2] != null && xroad_parts[2] != ''}
      next: lookup_authority
  next: return_false

lookup_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_registry_code"
    headers:
      Content-Type: application/json
    body:
      registry_code: "${xroad_parts[2]}"
  result: authority_res
  next: check_found

check_found:
  switch:
    - condition: ${authority_res.response.body != null && authority_res.response.body.length > 0}
      next: return_authority
  next: return_false

return_authority:
  return: ${authority_res.response.body[0]}
  wrapper: false
  next: end

return_false:
  return: "false"
  wrapper: false
  next: end
