declaration:
  description: "Echo endpoint for X-Road connectivity testing. Validates the caller against the authorities registry and returns the X-Road headers alongside the request body."

resolve_authority:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_authority_by_registry_code"
    headers:
      Content-Type: application/json
    body:
      registry_code: "${incoming.headers['x-road-client'].split('/')[2]}"
  result: authority_res
  next: respond

respond:
  return:
    xRoadClient: "${incoming.headers['x-road-client']}"
    xRoadId: "${incoming.headers['x-road-id']}"
    xRoadUserId: "${incoming.headers['x-road-userid']}"
    authority: ${authority_res.response.body[0]}
    echo: ${incoming.body}
  wrapper: false
  status: 200
  next: end
