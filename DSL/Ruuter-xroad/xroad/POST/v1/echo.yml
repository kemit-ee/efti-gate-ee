declaration:
  description: "Echo endpoint for X-Road connectivity testing. Validates the caller against the authorities registry and returns the X-Road headers alongside the request body."

# Re-call check-xroad-client to get the authority row (guard already verified access).
resolve_authority:
  call: http.post
  args:
    url: "http://localhost:[#PORT]/xroad/internal/check-xroad-client"
    headers:
      x-road-client: "${incoming.headers['x-road-client'] ?? ''}"
      x-road-id: "${incoming.headers['x-road-id'] ?? ''}"
  result: authority_res
  next: respond

respond:
  return:
    xRoadClient: "${incoming.headers['x-road-client']}"
    xRoadId: "${incoming.headers['x-road-id']}"
    xRoadUserId: "${incoming.headers['x-road-userid']}"
    authority: ${authority_res.response.body}
    echo: ${incoming.body}
  wrapper: false
  status: 200
  next: end
