declaration:
  description: "X-Road Authority operation: search consignments by identifier criteria (ADR-006).
    Local-first, then cross-gate broadcast - core handles that. Forwards to the gate's core REST API.
    No subset gate: this route returns identifier-level metadata, not dataset content, and takes no
    subset parameter. Competent authorities have unrestricted identifier search (Reg 2024/1942).
    Answers the curated projection transport-means returns (uil nested, no xml blob), the same shape
    as the developer mock's search."
  # Inputs (X-Road-Client / X-Road-Id validated by xroad/.guard.yml):
  #   body  object, required - {operator, id}-shaped criteria, or {poll: true, searchId} to collect the
  #         rest of a prior search. searchId is the x-search-id response header of the first call
  #         (the X-Road-Id of that call, which core keys the search on); a poll carries its own fresh
  #         X-Road-Id. Individual criteria fields are core's contract, forwarded verbatim -
  #         allowlist.body is additive and documents only the poll fields, so no criterion becomes
  #         mandatory or gets stripped.
  internal: false
  returns: []
  additive: true
  allowlist:
    body:
      - field: poll
        type: boolean
      - field: searchId
        type: string

# A missing/non-object body is the one thing this route rejects itself; everything else is core's
# contract. First step so a garbage body never reaches the forward.
validate_input:
  switch:
    - condition: ${incoming.body == null}
      next: bad_request
    - condition: ${incoming.body.poll === true}
      next: check_search_id
  next: forward_to_core

bad_request:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A JSON request body is required."
  wrapper: false
  status: 400
  next: end

# A poll names the search by the searchId the first response returned in x-search-id, not by its own
# X-Road-Id (PR-REST: every message has its own id). Fail-closed: anything but a UUID-shaped string
# is a 400 before core is asked.
check_search_id:
  switch:
    - condition: ${/^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(incoming.body.searchId)}
      next: read_owner
  next: bad_request_search_id

bad_request_search_id:
  return:
    type: "https://api.efti.ee/errors/bad-request"
    code: "BAD_REQUEST_GENERAL"
    title: "Bad Request"
    status: 400
    detail: "A poll needs {\"poll\": true, \"searchId\": <the x-search-id of the first response>}."
  wrapper: false
  status: 400
  next: end

# The owner marker is a search_results row under the key owner:<searchId>, written by register_owner
# when the first call left a search pending; its body is {owner: <registryCode>}. Only the authority
# that started the search may collect it. A missing marker, an expired one and another authority's
# search all answer the same empty result, so a poller cannot tell them apart.
read_owner:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/get_search_result"
    headers:
      Authorization: "Bearer [#RESQL_TOKEN]"
      Content-Type: application/json
    body:
      searchId: "owner:${incoming.body.searchId}"
  result: owner_res
  next: check_owner

check_owner:
  switch:
    - condition: ${owner_res.response.status != 200}
      next: owner_unavailable
    - condition: ${owner_res.response.body != null && owner_res.response.body.length == 1 && owner_res.response.body[0] != null && owner_res.response.body[0].body != null && owner_res.response.body[0].body.owner == authority.registryCode}
      next: poll_core
  next: respond_unknown_search

respond_unknown_search:
  return: []
  headers:
    content-type: "application/json"
    x-poll-more: "false"
  wrapper: false
  status: 200
  next: end

owner_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's search ownership record could not be read or written."
    failedStep: "search-owner"
    resqlStatus: ${owner_res.response.status}
  wrapper: false
  status: 502
  next: end

# X-Road-Id becomes x-request-id. That is load-bearing here rather than merely tidy: core's
# authority/search.yml uses x-request-id as the cross-gate search key (the search_results row key),
# so the X-Road-Id of this first call is the searchId the caller polls with. Core's first call
# returns the local slice immediately and never blocks on peer gates.
forward_to_core:
  call: http.post
  timeout: 40000
  args:
    url: "[#RUUTER_URL]/efti/api/v1/authority/search"
    headers:
      Content-Type: application/json
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
      x-request-id: "${incoming.headers['x-road-id']}"
    body: ${incoming.body}
  result: core_res
  next: check_core_status

# The poll goes to core under the first call's id (x-poll makes core read the stored search). A POLL
# through this step can legitimately wait: core's poll_remaining retries the search_results read for
# ~30s, and core's own upstream timeout allows for it (35s). This timeout must sit above that ladder
# or a healthy long-poll turns into a spurious core_unavailable 502.
poll_core:
  call: http.post
  timeout: 40000
  args:
    url: "[#RUUTER_URL]/efti/api/v1/authority/search"
    headers:
      Content-Type: application/json
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
      x-request-id: "${incoming.body.searchId}"
      x-poll: "true"
    body: {}
  result: core_res
  next: check_core_status

# Since Ruuter 0.9.15-rc (issue turnerrainer/Ruuter#89) a connection refusal, DNS failure, TLS
# handshake error or the timeout expiring no longer aborts the run: the http.post binds a stub
# `{status: 0, error: <kind>}` to core_res and falls through here, so the availability-failure
# class reaches core_unavailable's semantic 502 instead of Ruuter's generic 500. Policy pre-flight
# rejections (SSRF, host-allowlist, malformed URL, size cap) still raise.
check_core_status:
  switch:
    - condition: ${core_res.response.status == 0}
      next: core_unavailable
    - condition: ${core_res.response.status >= 400}
      next: core_error
  next: normalize_results

# Core answers in two shapes: a local hit is raw get_consignments rows (with the identifier xml
# blob), a poll returns the peers' xml-mapper ConsignmentRows. Both go through the same normalizer
# transport-means scope: allgates uses, so every search answer is the curated projection.
normalize_results:
  call: http.post
  args:
    url: "[#XML_MAPPER_URL]/api/v1/transport-means/normalize"
    headers:
      Content-Type: application/json
      x-request-id: "${incoming.headers['x-road-id']}"
      x-internal-service-token: "[#INTERNAL_SERVICE_TOKEN]"
    body: ${core_res.response.body}
  result: norm_res
  next: check_normalize

# Error is the fall-through: an empty array is an explicit accept, and a non-empty body must prove
# itself an array of projections via body[0].uil.
check_normalize:
  switch:
    - condition: ${norm_res.response.status != 200}
      next: normalize_failed
    - condition: ${norm_res.response.body != null && norm_res.response.body.length == 0}
      next: route_response
    - condition: ${norm_res.response.body != null && norm_res.response.body.length > 0 && norm_res.response.body[0] != null && norm_res.response.body[0].uil != null}
      next: route_response
  next: normalize_failed

# A first call that left a search pending hands the caller its searchId and records who owns it.
route_response:
  switch:
    - condition: ${incoming.body.poll === true}
      next: respond
    - condition: ${('' + (core_res.response.headers['x-poll-more'] ?? 'false')) == 'true'}
      next: register_owner
  next: respond

register_owner:
  call: http.post
  args:
    url: "[#RESQL_URL]/efti/insert_search_complete"
    headers:
      Authorization: "Bearer [#RESQL_TOKEN]"
      Content-Type: application/json
    body:
      searchId: "owner:${incoming.headers['x-road-id']}"
      body: "${JSON.stringify({ owner: authority.registryCode })}"
  result: owner_res
  next: check_owner_registered

check_owner_registered:
  switch:
    - condition: ${owner_res.response.status == 200}
      next: respond_pending
  next: owner_unavailable

respond_pending:
  return: ${norm_res.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: "true"
    x-search-id: "${incoming.headers['x-road-id']}"
  wrapper: false
  status: 200
  next: end

# core signals "more gates still responding" with x-poll-more; pass it through so the X-Road caller
# knows to poll again.
respond:
  return: ${norm_res.response.body}
  headers:
    content-type: "application/json"
    x-poll-more: ${core_res.response.headers['x-poll-more'] ?? 'false'}
  wrapper: false
  status: 200
  next: end

normalize_failed:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "Normalising the gate's consignment search result failed in the gate's mapping layer."
    failedStep: "transport-means-normalize"
    mapperStatus: ${norm_res.response.status}
  wrapper: false
  status: 502
  next: end

# Normalised to 502 GATEWAY_UNAVAILABLE, matching errors.json exactly; core's real status and body
# are carried in coreStatus / coreResponse. See dataset.yml's core_error for the full rationale.
core_error:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's consignment search failed. The gate's own status and response are carried in coreStatus and coreResponse."
    coreStatus: ${core_res.response.status}
    coreResponse: ${core_res.response.body}
  wrapper: false
  status: 502
  next: end

# Transport failure reaching core (issue #89): core never produced a status. Distinct from
# core_error so an operator sees "unreachable" rather than "core returned 5xx".
core_unavailable:
  return:
    type: "https://api.efti.ee/errors/bad-gateway"
    code: "GATEWAY_UNAVAILABLE"
    title: "Bad Gateway"
    status: 502
    detail: "The gate's core consignment search is unreachable. The transport failure kind is carried in transportError."
    transportError: ${core_res.response.error}
  wrapper: false
  status: 502
  next: end
