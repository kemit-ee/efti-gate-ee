[DSL]
PORT=8086
OWN_GATE_ID=EU-EE
RUUTER_URL=http://ruuter:8086
RESQL_URL=http://resql:8090
EDELIVERY_URL=http://edelivery:8081
XML_MAPPER_URL=http://xml-mapper:8082
MULTIPLEXER_URL=http://multiplexer:8083
PUBSUB_URL=http://pubsub:8084
TIM_URL=http://tim:8085
TIM_ADMIN_TOKEN=dev-tim-admin-token
# Shared secret for gate-internal component-to-component calls (currently the X-Road adapter calling
# the authority routes; earmarked for G2G inbound too).
#
# NOT baked into the ruuter image: Ruuter has no ${ENV} substitution, so this file is mounted
# read-only at runtime (compose.yml). This is the LOCAL DEV file. Production must mount an
# operator/Secret-resolved file instead.
#
# Whoever holds this token gets ADMIN-equivalent access to every route under
# efti/POST/api/v1/authority/ (dataset, follow-up, search).
# The xroad and authority surfaces now share port 8086, so isolation is a PATH constraint at the
# ingress (/xroad/** and /efti/api/v1/authority/** not publicly reachable), not a port one.
INTERNAL_SERVICE_TOKEN=dev-internal-service-token-change-me
# Local dev only; the production mounted file must set this to false.
DEV_LOGIN_ENABLED=true
# Static bearer for CronManager -> the gate's scheduled-job endpoints under /ops/** (archive sweep).
# Literal compare, no JWT. Same DEV-value / no-injection caveat as INTERNAL_SERVICE_TOKEN above.
# See docs/architecture/infrastructure/append_only_archival.md.
ARCHIVE_OPS_TOKEN=dev-archive-ops-token-change-me
