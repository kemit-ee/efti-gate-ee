[DSL]
PORT=8086
OWN_GATE_ID=EU-EE
RUUTER_URL=http://ruuter:8086
RESQL_URL=http://resql:8090
EDELIVERY_URL=http://edelivery:8081
XML_MAPPER_URL=http://xml-mapper:8082
MULTIPLEXER_URL=http://multiplexer:8083
TIM_URL=http://tim:8085
TIM_ADMIN_TOKEN=dev-tim-admin-token
# Shared secret for gate-internal component-to-component calls (currently the X-Road adapter calling
# the authority routes; earmarked for G2G inbound too).
#
# DEV VALUE, and there is NO INJECTION MECHANISM YET: this file is COPY-ed into the image by
# docker/ruuter/Dockerfile, Ruuter constants have no ${ENV} substitution anywhere in this repo, and
# no entrypoint rewrites the file. Changing the value means editing this tracked file and rebuilding
# the ruuter image — nothing fails loudly if you forget. (Until the xroad project was merged into
# the main Ruuter this had to be kept byte-identical in a second constants-xroad.ini; that file and
# the whole duplication hazard are gone.)
#
# Whoever holds this token gets ADMIN-or-AUTHORITY-equivalent access to every route under
# efti/POST/api/v1/authority/ (dataset, follow-up, search).
# The xroad and authority surfaces now share port 8086, so isolation is a PATH constraint at the
# ingress (/xroad/** and /efti/api/v1/authority/** not publicly reachable), not a port one. ADR-006's
# open questions before any production build.
INTERNAL_SERVICE_TOKEN=dev-internal-service-token-change-me
# Shared secret the .guard files present on the /efti/internal/* loopback calls.
# Dev value; override in production. See DSL/Ruuter/efti/POST/internal/.guard.yml.
INTERNAL_SECRET=dev-internal-secret
