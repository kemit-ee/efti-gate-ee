# Minimal config so Alertmanager starts and alerts are visible in its UI (http://localhost:9093).
# No notification integration (Slack/email/PagerDuty/on-call) is wired up yet -- `receiver: default`
# has no webhook, so firing alerts are not actually paged anywhere. Add a real receiver here before
# relying on this for production incident response.
route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
