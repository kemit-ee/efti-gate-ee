# Turvis trust view server (SPEC section 7.2). Static: turvis-trust.json and health.json are
# generated at image build time by scripts/registry-to-json.py, so there is no application code here.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # A stale trust view is a trust decision: never let a cache keep one.
    add_header Cache-Control "no-store" always;
    autoindex off;

    location / {
        try_files $uri =404;
    }

    error_page 404 = @json404;
    location @json404 {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }
}
