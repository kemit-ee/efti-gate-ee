# Registry file server (ADR-011). Static: every document is generated at image build time by
# scripts/registry-to-json.py, so there is no application code here at all.
#
# Port 8080 rather than nginx's default 80 to keep [#REGISTRY_URL] (= http://registry:8080)
# unchanged across the DSL, compose and the Kotlin services.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index gates.json;

    # The documents carry live platform API keys, so nothing may cache them — not the browser, not a
    # sidecar, not the Docker network. Also disable the directory index: only the generated files
    # exist, and an unknown path must be a 404 rather than a listing.
    add_header Cache-Control "no-store" always;
    autoindex off;

    location / {
        try_files $uri =404;
    }

    # Keep the error contract JSON-shaped, like the documents themselves, so a consumer parsing the
    # body of a failed lookup does not get nginx's HTML error page.
    error_page 404 = @json404;
    location @json404 {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }
}
