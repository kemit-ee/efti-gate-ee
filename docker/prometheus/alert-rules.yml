groups:
  - name: efti-gate
    rules:
      - alert: ServiceUnreachable
        # Prometheus's own scrape-health metric, not something RequestMetrics exposes.
        expr: up{job=~"edelivery|xml-mapper"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has not responded to a /metrics scrape for 2m"
          runbook: docs/runbooks/pod-crash-loop.md

      - alert: HighErrorRate
        # http_requests_total_<method>_<statusclass> has no labels (see RequestMetrics.kt), so
        # this matches on __name__ across every method/status-class combination instead.
        expr: >
          sum(rate({__name__=~"http_requests_total_.*_(4xx|5xx)"}[5m]))
            /
          clamp_min(sum(rate({__name__=~"http_requests_total_.*"}[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "4xx/5xx rate above 5% over 5m"
          runbook: docs/runbooks/high-error-rate.md

      - alert: NoOnlineEdeliveryPeers
        expr: edelivery_parties_online_total == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "edelivery sees zero ONLINE gates/platforms in the registry (own gate excluded check is not possible from this metric alone -- confirm against the registry service directly)"
          runbook: docs/runbooks/edelivery-communication-failure.md

      - alert: TrustGenerationMismatch
        # SPEC 7.4. klite's Metrics has no labels, so a generation is exported as a number (TrustGeneration.gauge) and equal
        # numbers mean equal generations. edelivery_turvis_trust_generation is the one Turvis last reported to this edelivery,
        # 0 until the first call. A rolling deploy overlaps for a short time, hence the 5 minutes.
        expr: >
          edelivery_registry_generation > 0
            and edelivery_turvis_trust_generation > 0
            and edelivery_registry_generation != edelivery_turvis_trust_generation
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "edelivery and Turvis loaded different registry/trust generations for 5m; deploy the matching artifacts, never trust the more permissive side"
          runbook: docs/runbooks/edelivery-communication-failure.md

      - alert: RegistryGenerationDivergence
        # More than one distinct value among edelivery replicas (count_values emits one series per distinct value),
        # and the same for the generation each replica last saw from Turvis.
        expr: >
          count(count_values("generation", edelivery_registry_generation > 0)) > 1
            or count(count_values("generation", edelivery_turvis_trust_generation > 0)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "edelivery replicas run on more than one registry or Turvis trust generation for 5m"
          runbook: docs/runbooks/edelivery-communication-failure.md

