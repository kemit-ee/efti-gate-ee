global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Only edelivery and xml-mapper expose /metrics today (klite's built-in OpenMetrics endpoint,
# see code/core/src/metrics/RequestMetrics.kt). Ruuter, ReSql and the registry nginx server don't
# expose a Prometheus endpoint yet -- add scrape jobs for them here once they do.
scrape_configs:
  - job_name: edelivery
    metrics_path: /metrics
    static_configs:
      - targets: ["edelivery:8081"]
  - job_name: xml-mapper
    metrics_path: /metrics
    static_configs:
      - targets: ["xml-mapper:8082"]
